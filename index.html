<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Ashen Gate</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060a;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;background:#0b0d12;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================================
   THE ASHEN GATE — a souls-like boss duel in one file.
   Boss: ALDRIC, WHO WAS GIVEN THE BLADE.
   ========================================================================= */

const W = 960, H = 540;
const ARENA = { x: 64, y: 64, w: W - 128, h: H - 128 };
const GATE = { x: W / 2, y: 26 };     // the threshold, beyond the top wall
const RING = { x: 336, y: 338 };      // the worn practice ring
/* 2.5D: the floor is seen at an angle, so it compresses toward the back;
   the people standing on it do not. SQUASH is that compression, pivoting on
   the middle of the room so the freed space becomes wall above and near
   floor below. */
const SQUASH = 0.64;
const HORIZON = 64 + (540 - 128) / 2;      // the arena's own middle
function projY(wy) { return HORIZON + (wy - HORIZON) * SQUASH; }
const ACCENT = '#ff9e2c';             // ember — reserved for boss telegraphs & fire
const COOL = '#9fc7ff';               // Nomad's one cool accent
const canvas = document.getElementById('c');
const RS = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * RS; canvas.height = H * RS;
const ctx = canvas.getContext('2d');

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);
fitCanvas();

/* ---------- tiny math helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
function angDiff(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
function turnToward(cur, target, maxStep) { const d = angDiff(cur, target); return cur + clamp(d, -maxStep, maxStep); }
const rand = (a, b) => a + Math.random() * (b - a);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* =========================================================================
   AUDIO — all synthesized, created lazily, resumed on any user gesture.
   ========================================================================= */
const AudioSys = {
  ac: null, master: null, sfxBus: null, voiceBus: null, noiseBuf: null, ambient: null,
  ensure() {
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        // ask for the shortest buffer the device will give us
        try { this.ac = new AC({ latencyHint: 'interactive' }); }
        catch (e) { this.ac = new AC(); }
        this.master = this.ac.createGain();
        this.master.gain.value = 0.45;
        this.master.connect(this.ac.destination);
        /* Two buses under the master. Ducking hushes the room by pulling sfxBus
           down; voiceBus is exempt, so a dying cry rings out OVER the hush
           instead of being swallowed by it. */
        this.sfxBus = this.ac.createGain();
        this.sfxBus.gain.value = 1;
        this.sfxBus.connect(this.master);
        this.voiceBus = this.ac.createGain();
        this.voiceBus.gain.value = 1;
        this.voiceBus.connect(this.master);
        const len = Math.floor(this.ac.sampleRate * 1.2);
        this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
      if (this.ac.state === 'running') this.startAmbient();
      return this.ac;
    } catch (e) { return null; }
  },
  // A bed under the whole fight: a low drone, and wind moving through the gate.
  // Built once, runs forever, ducked with everything else.
  startAmbient() {
    try {
      if (this.ambient || !this.ac) return;
      const ac = this.ac, t = ac.currentTime;
      const bus = ac.createGain();
      bus.gain.value = 0.0001;
      bus.gain.linearRampToValueAtTime(1, t + 3.5);   // fades up as you arrive
      bus.connect(this.sfxBus);                        // the bed ducks with everything else

      // the drone: two detuned voices, barely moving
      const dg = ac.createGain(); dg.gain.value = 0.055;
      const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 220;
      dg.connect(dlp); dlp.connect(bus);
      [43.65, 65.41, 87.31].forEach((f, i) => {
        const o = ac.createOscillator();
        o.type = i === 2 ? 'triangle' : 'sine';
        o.frequency.value = f * (1 + (i - 1) * 0.0015);
        const vg = ac.createGain(); vg.gain.value = i === 2 ? 0.35 : 1;
        o.connect(vg); vg.connect(dg);
        o.start(t);
        // a slow swell so it breathes instead of humming
        const lfo = ac.createOscillator(); lfo.type = 'sine';
        lfo.frequency.value = 0.03 + i * 0.017;
        const la = ac.createGain(); la.gain.value = 0.35;
        lfo.connect(la); la.connect(vg.gain);
        lfo.start(t);
      });

      // wind through the gate: filtered noise, the band drifting slowly
      const w = ac.createBufferSource(); w.buffer = this.noiseBuf; w.loop = true;
      const wbp = ac.createBiquadFilter(); wbp.type = 'bandpass';
      wbp.frequency.value = 380; wbp.Q.value = 0.7;
      const wg = ac.createGain(); wg.gain.value = 0.035;
      w.connect(wbp); wbp.connect(wg); wg.connect(bus);
      w.start(t);
      const wl = ac.createOscillator(); wl.type = 'sine'; wl.frequency.value = 0.045;
      const wla = ac.createGain(); wla.gain.value = 220;
      wl.connect(wla); wla.connect(wbp.frequency); wl.start(t);
      const wl2 = ac.createOscillator(); wl2.type = 'sine'; wl2.frequency.value = 0.07;
      const wla2 = ac.createGain(); wla2.gain.value = 0.018;
      wl2.connect(wla2); wla2.connect(wg.gain); wl2.start(t);

      this.ambient = bus;
    } catch (e) {}
  },
  ready() { return this.ac && this.ac.state === 'running'; },
  // hushes the room — the voice bus deliberately rides over it
  duck(level, secs) {
    try {
      if (!this.ac || !this.sfxBus) return;
      const now = this.ac.currentTime;
      const g = this.sfxBus.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(g.value, now);
      g.linearRampToValueAtTime(level / 0.45, now + secs);   // duck levels were authored against the old 0.45 master
    } catch (e) {}
  }
};
['pointerdown', 'touchstart', 'keydown', 'mousedown'].forEach(ev =>
  window.addEventListener(ev, () => AudioSys.ensure(), { passive: true }));

function _noise(ac, dur, filterType, f0, f1, gain, t0, bus) {
  const src = ac.createBufferSource(); src.buffer = AudioSys.noiseBuf; src.loop = true;
  const filt = ac.createBiquadFilter(); filt.type = filterType;
  filt.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) filt.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(bus || AudioSys.sfxBus);
  src.start(t0); src.stop(t0 + dur + 0.05);
}
function _tone(ac, type, f0, f1, dur, gain, t0, bus) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(bus || AudioSys.sfxBus);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  _run(fn) { try { const ac = AudioSys.ensure(); if (!ac || ac.state !== 'running') return; fn(ac, ac.currentTime); } catch (e) {} },
  // the given blade moves a lot of air; the scavenged knives barely move any
  swing(heavy, thin) {
    this._run((ac, t) => thin
      ? _noise(ac, heavy ? 0.11 : 0.07, 'bandpass', heavy ? 900 : 1500, heavy ? 3000 : 3800, 0.3, t)
      : _noise(ac, heavy ? 0.22 : 0.15, 'bandpass', heavy ? 260 : 380, heavy ? 1500 : 1900, 0.5, t));
  },
  bossSwing() { this._run((ac, t) => { _noise(ac, 0.28, 'bandpass', 180, 900, 0.65, t); _tone(ac, 'sawtooth', 110, 60, 0.22, 0.12, t); }); },
  /* ---- resolution: it landed ---- */
  /* An edge, not a bat. The cut is a very brief shear high up; the body under
     it is short and dull. Mid-range ring is what reads as wood, so there is
     almost none - only a thin, quick highlight well above it. */
  hitArmor() { this._run((ac, t) => {
    _noise(ac, 0.022, 'highpass', 6000, 9000, 0.5, t);      // the shear itself
    _noise(ac, 0.055, 'bandpass', 4200, 2600, 0.3, t);      // the edge dragging through
    _tone(ac, 'sine', 150, 52, 0.1, 0.42, t);               // a short, dull body
    _tone(ac, 'triangle', 2270, 2090, 0.07, 0.07, t);       // one thin highlight, high and gone
    _noise(ac, 0.05, 'lowpass', 1500, 500, 0.16, t + 0.004);
  }); },
  playerHit() { this._run((ac, t) => {
    _tone(ac, 'sine', 110, 42, 0.28, 0.85, t);             // it lands in your chest
    _noise(ac, 0.05, 'highpass', 2600, 1500, 0.3, t);      // the crack of the blow
    _noise(ac, 0.14, 'bandpass', 900, 380, 0.4, t);        // armour crunching
    _noise(ac, 0.22, 'lowpass', 1300, 220, 0.55, t);
  }); },

  /* ---- resolution: it hit nothing. Air, no low end, and gone quickly. ---- */
  whiff(heavy, thin) { this._run((ac, t) => {
    if (thin) {                                             // a short knife finding nothing
      _noise(ac, 0.09, 'bandpass', 5200, 1800, 0.2, t);
      _tone(ac, 'sine', 760, 520, 0.05, 0.02, t);
    } else if (heavy) {                                            // an edge parting air, and nothing else
      _noise(ac, 0.24, 'bandpass', 2600, 620, 0.3, t);
      _tone(ac, 'sine', 300, 175, 0.12, 0.045, t);          // the blade's own mass
    } else {
      _noise(ac, 0.15, 'bandpass', 4200, 1100, 0.26, t);
      _tone(ac, 'sine', 520, 340, 0.08, 0.03, t);
    }
  }); },
  bossWhiff(isMaul) { this._run((ac, t) => {
    if (isMaul) {                                          // a great mass passing through empty air
      _noise(ac, 0.42, 'bandpass', 320, 90, 0.42, t);
      _tone(ac, 'sine', 70, 40, 0.3, 0.13, t);
    } else {                                               // the shard, quick and thin
      _noise(ac, 0.14, 'bandpass', 1800, 600, 0.28, t);
    }
  }); },
  roll(light) {
    this._run((ac, t) => light
      ? _noise(ac, 0.13, 'lowpass', 1100, 420, 0.22, t)     // he barely touches the floor
      : _noise(ac, 0.2, 'lowpass', 600, 220, 0.3, t));
  },
  gulp() { this._run((ac, t) => { _tone(ac, 'sine', 300, 170, 0.12, 0.3, t); _tone(ac, 'sine', 260, 140, 0.12, 0.3, t + 0.16); _tone(ac, 'sine', 230, 120, 0.14, 0.3, t + 0.32); }); },
  flaskEmpty() { this._run((ac, t) => _tone(ac, 'square', 220, 200, 0.07, 0.12, t)); },
  slamImpact() { this._run((ac, t) => { _tone(ac, 'sine', 80, 34, 0.4, 0.9, t); _noise(ac, 0.3, 'lowpass', 900, 120, 0.7, t); }); },
  stagger() { this._run((ac, t) => { _tone(ac, 'square', 300, 90, 0.35, 0.25, t); _noise(ac, 0.35, 'bandpass', 700, 250, 0.4, t); }); },
  roar() { this._run((ac, t) => {
    _tone(ac, 'sawtooth', 82, 44, 1.3, 0.45, t);
    _tone(ac, 'sawtooth', 61, 38, 1.3, 0.45, t + 0.03);
    _tone(ac, 'square', 41, 30, 1.3, 0.3, t);
    _noise(ac, 1.2, 'bandpass', 350, 130, 0.5, t);
  }); },
  bell() { this._run((ac, t) => {
    [98, 196, 294.3, 392.7].forEach((f, i) => _tone(ac, 'sine', f, f * 0.985, 2.8 - i * 0.4, 0.42 / (i + 1), t));
    _noise(ac, 0.06, 'highpass', 2000, 3000, 0.1, t);
  }); },
  chime() { this._run((ac, t) => {
    [659, 830, 988, 1318].forEach((f, i) => _tone(ac, 'sine', f, f, 1.0, 0.22, t + i * 0.14));
    _tone(ac, 'sine', 329, 329, 1.8, 0.15, t);
  }); },
  fog() { this._run((ac, t) => _noise(ac, 0.9, 'lowpass', 500, 150, 0.25, t)); },
  parry() { this._run((ac, t) => {
    _tone(ac, 'square', 1400, 950, 0.09, 0.28, t);
    _tone(ac, 'sine', 2300, 1750, 0.16, 0.22, t);
    _tone(ac, 'sine', 320, 150, 0.1, 0.3, t);
    _noise(ac, 0.08, 'highpass', 2600, 4200, 0.3, t);
  }); },
  // the bleed meter filling and letting go — a wet tear, not a clang
  rupture() { this._run((ac, t) => {
    _noise(ac, 0.26, 'bandpass', 1500, 260, 0.4, t);
    _tone(ac, 'sawtooth', 190, 58, 0.34, 0.3, t);
    _tone(ac, 'sine', 92, 40, 0.4, 0.42, t);
    _noise(ac, 0.5, 'lowpass', 700, 180, 0.16, t);
  }); },
  // steel refusing steel — a bright open ring, longer than anything else here
  clash() { this._run((ac, t) => {
    _noise(ac, 0.012, 'highpass', 5000, 8000, 0.5, t);
    [2489, 3671, 5230].forEach((f, i) => {
      _tone(ac, 'triangle', f, f * 0.997, 0.55 - i * 0.12, 0.16 / (1 + i * 0.7), t);
    });
    _tone(ac, 'sine', 620, 240, 0.16, 0.2, t);
    _tone(ac, 'sine', 180, 70, 0.22, 0.3, t);
  }); },
  // a maul shrugging two knives aside — no ring in it at all
  deflect() { this._run((ac, t) => {
    _noise(ac, 0.2, 'bandpass', 2100, 600, 0.4, t);
    _tone(ac, 'sawtooth', 760, 320, 0.14, 0.07, t);
    _noise(ac, 0.12, 'lowpass', 900, 300, 0.3, t + 0.02);
    _tone(ac, 'sine', 150, 60, 0.18, 0.28, t);
  }); },
  block() { this._run((ac, t) => {
    _tone(ac, 'sine', 210, 90, 0.14, 0.45, t);
    _tone(ac, 'square', 360, 250, 0.05, 0.1, t);
    _noise(ac, 0.1, 'lowpass', 1300, 350, 0.3, t);
  }); },
  guardBreak() { this._run((ac, t) => {
    _tone(ac, 'sawtooth', 240, 65, 0.35, 0.4, t);
    _tone(ac, 'sine', 110, 40, 0.3, 0.5, t);
    _noise(ac, 0.3, 'bandpass', 900, 200, 0.5, t);
  }); },
  exposed() { this._run((ac, t) => {
    [660, 990, 1320].forEach((f, i) => _tone(ac, 'sine', f, f * 1.01, 0.8, 0.2, t + i * 0.11));
    _noise(ac, 0.5, 'highpass', 3000, 5000, 0.08, t);
  }); },
  scrapeOne() { this._run((ac, t) => {
    _noise(ac, 0.28, 'bandpass', 900 + Math.random() * 500, 500, 0.2, t);
    _tone(ac, 'sawtooth', 220 + Math.random() * 120, 140, 0.2, 0.05, t);
  }); },
  chargeFull() { this._run((ac, t) => { _tone(ac, 'sine', 660, 720, 0.14, 0.16, t); _tone(ac, 'sine', 990, 1020, 0.18, 0.1, t + 0.04); }); },
  learn() { this._run((ac, t) => {         // recognition, not regret: a low tone that rises
    _tone(ac, 'sine', 128, 148, 0.75, 0.2, t, AudioSys.voiceBus);
    _tone(ac, 'sine', 192, 224, 0.6, 0.12, t + 0.14, AudioSys.voiceBus);
    _tone(ac, 'sine', 64, 74, 0.8, 0.14, t, AudioSys.voiceBus);
  }); },
  read() { this._run((ac, t) => {          // a sharp intake — he has seen it
    _tone(ac, 'square', 1150, 1500, 0.07, 0.16, t);
    _noise(ac, 0.16, 'highpass', 2200, 3600, 0.22, t);
    _tone(ac, 'sawtooth', 150, 210, 0.14, 0.14, t);
  }); },
  bodyFall() { this._run((ac, t) => {     // all of him, at once, onto stone
    _tone(ac, 'sine', 78, 30, 0.4, 0.8, t);
    _tone(ac, 'sine', 52, 26, 0.5, 0.5, t + 0.01);
    _noise(ac, 0.26, 'lowpass', 620, 100, 0.55, t);
    // plate rattling as it settles
    _noise(ac, 0.1, 'bandpass', 1700, 900, 0.14, t + 0.02);
    _noise(ac, 0.07, 'bandpass', 2400, 1400, 0.09, t + 0.08);
    // and the dust it pushes out
    const d = ac.createBufferSource(); d.buffer = AudioSys.noiseBuf; d.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.11, t + 0.09);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    d.connect(f); f.connect(g); g.connect(AudioSys.sfxBus);
    d.start(t); d.stop(t + 0.75);
  }); },
  swordDrop(light) { this._run((ac, t) => {   // steel onto stone, and a smaller second bounce
    const m = light ? 1.5 : 1, g = light ? 0.55 : 1;   // a knife rings higher and smaller
    _noise(ac, 0.02, 'highpass', 3000 * m, 5000, 0.3 * g, t);
    [1180, 1631, 2390, 3049].forEach((f, i) => {
      _tone(ac, 'triangle', f * m, f * m * 0.992, 0.5 - i * 0.09, (0.13 / (1 + i * 0.55)) * g, t);
    });
    _tone(ac, 'sine', 220 * m, 120 * m, 0.09, 0.2 * g, t);
    [1631, 2390].forEach((f, i) => _tone(ac, 'triangle', f * m * 1.01, f * m, 0.22 - i * 0.06, 0.05 * g, t + 0.095));
    _noise(ac, 0.05, 'bandpass', 2600 * m, 1600, 0.07 * g, t + 0.095);
  }); },
  helmSigh() { this._run((ac, t) => {     // he is hollow; this is only air leaving
    const s = ac.createBufferSource(); s.buffer = AudioSys.noiseBuf; s.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
    bp.Q.value = 1.6;
    bp.frequency.setValueAtTime(760, t);
    bp.frequency.exponentialRampToValueAtTime(210, t + 1.15);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    s.connect(bp); bp.connect(g); g.connect(AudioSys.voiceBus);
    s.start(t); s.stop(t + 1.25);
    _tone(ac, 'sine', 128, 96, 0.5, 0.05, t + 0.04, AudioSys.voiceBus);   // the barest breath of pitch
  }); },
  deathCry() { this._run((ac, t) => {     // it falls, and it fails
    const V = AudioSys.voiceBus;
    const waver = ac.createOscillator(); waver.type = 'sine';
    waver.frequency.setValueAtTime(5.5, t);
    waver.frequency.linearRampToValueAtTime(13, t + 1.6);   // the tremor worsens
    const wg = ac.createGain(); wg.gain.value = 0.3;
    waver.connect(wg); waver.start(t); waver.stop(t + 1.8);

    [[112, 'sawtooth', 0.78], [168, 'sawtooth', 0.44], [56, 'square', 0.5]].forEach(([f0, ty, gain]) => {
      const o = ac.createOscillator(); o.type = ty;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.47, t + 1.6);
      const th = ac.createBiquadFilter(); th.type = 'bandpass';   // a throat around it
      th.Q.value = 2.2;
      th.frequency.setValueAtTime(700, t);
      th.frequency.exponentialRampToValueAtTime(180, t + 1.5);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(gain, t + 0.07);
      g.gain.setValueAtTime(gain, t + 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
      wg.connect(g.gain);                                        // the waver rides the level
      o.connect(th); th.connect(g); g.connect(V);
      o.start(t); o.stop(t + 1.8);
    });
    _noise(ac, 1.5, 'bandpass', 420, 110, 0.38, t, V);           // the ember going out
    _noise(ac, 0.06, 'highpass', 1800, 3000, 0.22, t, V);
  }); },
  effort(heavy) { this._run((ac, t) => {  // the sound of putting his weight behind it
    const V = AudioSys.voiceBus;
    const f0 = heavy ? 96 + Math.random() * 16 : 132 + Math.random() * 20;
    _tone(ac, 'sawtooth', f0, f0 * 0.72, heavy ? 0.26 : 0.16, heavy ? 0.11 : 0.07, t, V);
    _noise(ac, heavy ? 0.2 : 0.12, 'bandpass', 400, 190, heavy ? 0.09 : 0.05, t, V);
  }); },
  stab() { this._run((ac, t) => {
    _tone(ac, 'sine', 190, 60, 0.2, 0.7, t);
    _noise(ac, 0.12, 'bandpass', 1800, 500, 0.5, t);
    _noise(ac, 0.3, 'lowpass', 700, 90, 0.55, t + 0.02);
  }); },
  maulSwing() { this._run((ac, t) => { _noise(ac, 0.32, 'bandpass', 140, 700, 0.7, t); _tone(ac, 'sawtooth', 90, 45, 0.28, 0.14, t); }); },
  shardSwing() { this._run((ac, t) => _noise(ac, 0.13, 'bandpass', 500, 2300, 0.5, t)); },
  maulImpact() { this._run((ac, t) => {
    _tone(ac, 'sine', 70, 28, 0.5, 1.0, t);
    _noise(ac, 0.35, 'lowpass', 800, 90, 0.8, t);
    _noise(ac, 0.08, 'highpass', 1500, 3000, 0.25, t);
  }); },
  fissure() { this._run((ac, t) => { _noise(ac, 0.5, 'bandpass', 300, 1400, 0.35, t); _tone(ac, 'sawtooth', 100, 55, 0.4, 0.12, t); }); },
  chargeWhoosh() { this._run((ac, t) => _noise(ac, 0.55, 'bandpass', 160, 620, 0.5, t)); },
  daze() { this._run((ac, t) => {
    _tone(ac, 'square', 320, 180, 0.3, 0.25, t);
    _tone(ac, 'sine', 180, 90, 0.45, 0.4, t);
    _noise(ac, 0.3, 'lowpass', 1000, 200, 0.5, t);
  }); },
  crack() { this._run((ac, t) => {
    // the haft breaking over his knee — layered snaps over a deep body
    _noise(ac, 0.05, 'highpass', 1800, 4200, 0.9, t);
    _tone(ac, 'square', 900, 220, 0.05, 0.5, t);
    _tone(ac, 'square', 700, 160, 0.06, 0.45, t + 0.03);
    _tone(ac, 'square', 500, 120, 0.08, 0.4, t + 0.07);
    _tone(ac, 'sawtooth', 130, 40, 0.5, 0.55, t + 0.02);
    _noise(ac, 0.45, 'lowpass', 900, 100, 0.7, t + 0.02);
  }); },
  mourn() { this._run((ac, t) => {
    // a slow minor swell where the swing should have been
    [[130.8, 0.3, 0], [155.6, 0.22, 0.09], [65.4, 0.26, 0.05]].forEach(([f, g, dl]) => {
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f, t + dl);
      o.frequency.linearRampToValueAtTime(f * 0.965, t + dl + 1.8);
      const gn = ac.createGain();
      gn.gain.setValueAtTime(0.0001, t + dl);
      gn.gain.linearRampToValueAtTime(g, t + dl + 0.5);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dl + 2.0);
      o.connect(gn); gn.connect(AudioSys.voiceBus);    // his voice rides over the hush
      o.start(t + dl); o.stop(t + dl + 2.1);
    });
  }); }
};

/* =========================================================================
   RUMBLE — feature-checked everywhere.
   ========================================================================= */
function rumble(ms, strong, weak) {
  try {
    const gp = Input.pad;
    if (gp && gp.vibrationActuator && typeof gp.vibrationActuator.playEffect === 'function') {
      const p = gp.vibrationActuator.playEffect('dual-rumble',
        { startDelay: 0, duration: ms, strongMagnitude: clamp(strong, 0, 1), weakMagnitude: clamp(weak, 0, 1) });
      if (p && p.catch) p.catch(() => {});
    }
  } catch (e) {}
}

/* =========================================================================
   INPUT — controller primary, keyboard/mouse fallback, unified edges +
   a 150ms buffer for attacks/rolls/parries.
   ========================================================================= */
const BUFFER_MS = 150;
const Input = {
  device: 'kb',                 // 'kb' | 'pad'
  keys: {}, pad: null,
  prevPadB: [], prevRT: false,
  kbEdges: {},                  // one-frame edges from key/mouse events
  // unified per-frame edges:
  light: false, heavy: false, lock: false, flask: false, confirm: false, parry: false, pause: false,
  menuL: false, menuR: false, prevMenuX: 0,   // menu left/right, edge-triggered
  moveX: 0, moveY: 0, moveMag: 0,
  sprint: false, blockHeld: false, blockPressed: false, heavyHeld: false, mouseRDown: false,
  dodgeWasDown: false, dodgeHoldT: 0, dodgeSprinted: false,
  buffer: null,                 // {act:'roll'|'light'|'heavy'|'parry', t: ms}

  setBuffer(act) { this.buffer = { act, t: performance.now() }; },
  peekBuffer() {
    if (this.buffer && performance.now() - this.buffer.t <= BUFFER_MS) return this.buffer.act;
    this.buffer = null; return null;
  },
  consumeBuffer() { const a = this.peekBuffer(); this.buffer = null; return a; },

  poll(rdt) {
    this.light = this.heavy = this.lock = this.flask = this.confirm = this.parry = this.pause = false;
    this.menuL = this.menuR = false;

    /* ---- gamepad (polled; buttons are not event-driven) ---- */
    let gp = null;
    try {
      const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
      for (let i = 0; i < pads.length; i++) { if (pads[i] && pads[i].connected !== false) { gp = pads[i]; break; } }
    } catch (e) {}
    this.pad = gp;

    let padDodgeDown = false, padBlock = false;
    let sx = 0, sy = 0, smag = 0;
    if (gp) {
      const b = gp.buttons || [];
      const bd = i => !!(b[i] && (b[i].pressed || b[i].value > 0.5));
      const was = i => !!this.prevPadB[i];
      const edge = i => bd(i) && !was(i);

      // any pad activity -> controller prompts
      let anyAct = false;
      for (let i = 0; i < b.length; i++) if (bd(i)) { anyAct = true; break; }
      const rawAx = gp.axes || [];
      if (Math.abs(rawAx[0] || 0) > 0.25 || Math.abs(rawAx[1] || 0) > 0.25) anyAct = true;
      if (anyAct) { this.device = 'pad'; AudioSys.ensure(); }

      // left stick, radial deadzone 0.18, magnitude scales speed
      const ax = rawAx[0] || 0, ay = rawAx[1] || 0;
      const m = Math.sqrt(ax * ax + ay * ay);
      if (m > 0.18) {
        const scaled = Math.min(1, (m - 0.18) / (1 - 0.18));
        sx = (ax / m) * scaled; sy = (ay / m) * scaled; smag = scaled;
      }

      if (edge(5)) this.light = true;                        // RB
      const rt = bd(7);                                      // RT analog
      if (rt && !this.prevRT) this.heavy = true;
      this.prevRT = rt;
      if (edge(11)) this.lock = true;                        // R3
      if (edge(2)) this.flask = true;                        // X / Square
      if (edge(0) || edge(9)) this.confirm = true;           // A or Start
      if (edge(9)) this.pause = true;                        // Start also pauses the fight
      if (edge(6)) this.parry = true;                        // L2 / LT (analog-safe)
      padBlock = bd(4);                                      // L1 / LB — hold to guard
      padDodgeDown = bd(1);                                  // B / Circle
      if (edge(14)) this.menuL = true;                       // d-pad, for menus
      if (edge(15)) this.menuR = true;

      // either stick nudged left/right, edge-triggered, for menu choices
      const mx = Math.abs(rawAx[0] || 0) > Math.abs(rawAx[2] || 0) ? (rawAx[0] || 0) : (rawAx[2] || 0);
      const mstep = mx > 0.55 ? 1 : (mx < -0.55 ? -1 : 0);
      if (mstep !== this.prevMenuX) {
        if (mstep === 1) this.menuR = true;
        if (mstep === -1) this.menuL = true;
        this.prevMenuX = mstep;
      }

      const nb = [];
      for (let i = 0; i < b.length; i++) nb[i] = bd(i);
      this.prevPadB = nb;
    } else {
      this.prevPadB = []; this.prevRT = false; this.prevMenuX = 0;
    }

    /* ---- keyboard/mouse ---- */
    let kx = 0, ky = 0;
    if (this.keys['KeyA'] || this.keys['ArrowLeft']) kx -= 1;
    if (this.keys['KeyD'] || this.keys['ArrowRight']) kx += 1;
    if (this.keys['KeyW'] || this.keys['ArrowUp']) ky -= 1;
    if (this.keys['KeyS'] || this.keys['ArrowDown']) ky += 1;
    if (kx || ky) { const m = Math.hypot(kx, ky); kx /= m; ky /= m; }

    if (this.kbEdges.light) this.light = true;
    if (this.kbEdges.heavy) this.heavy = true;
    if (this.kbEdges.lock) this.lock = true;
    if (this.kbEdges.flask) this.flask = true;
    if (this.kbEdges.confirm) this.confirm = true;
    if (this.kbEdges.pause) this.pause = true;
    if (this.kbEdges.parry) this.parry = true;
    if (this.kbEdges.menuL) this.menuL = true;
    if (this.kbEdges.menuR) this.menuR = true;
    const kbDodgeDown = !!this.keys['Space'];
    const kbBlock = !!(this.keys['ShiftLeft'] || this.keys['ShiftRight']);
    this.kbEdges = {};

    /* ---- merge movement (pad wins if it has input) ---- */
    if (smag > 0) { this.moveX = sx; this.moveY = sy; this.moveMag = smag; }
    else { this.moveX = kx; this.moveY = ky; this.moveMag = (kx || ky) ? 1 : 0; }

    /* ---- dodge/sprint: tap = roll, hold >250ms = sprint (identical paths) ---- */
    const down = padDodgeDown || kbDodgeDown;
    if (down && !this.dodgeWasDown) { this.dodgeHoldT = 0; this.dodgeSprinted = false; }
    if (down) {
      this.dodgeHoldT += rdt;
      if (this.dodgeHoldT > 0.25 && this.moveMag > 0.01) { this.sprint = true; this.dodgeSprinted = true; }
      if (this.moveMag <= 0.01) this.sprint = false;
    } else {
      if (this.dodgeWasDown && this.dodgeHoldT <= 0.25 && !this.dodgeSprinted) this.setBuffer('roll');
      this.sprint = false;
    }
    this.dodgeWasDown = down;
    const bh = padBlock || kbBlock;
    this.blockPressed = bh && !this.blockHeld;   // one-frame edge, for the ritual
    this.blockHeld = bh;
    this.heavyHeld = this.prevRT || this.mouseRDown;   // for the charged heavy

    if (this.light) this.setBuffer('light');
    if (this.heavy) this.setBuffer('heavy');
    if (this.parry) this.setBuffer('parry');
  }
};

window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  Input.device = 'kb';
  if (e.repeat) { Input.keys[e.code] = true; return; }
  Input.keys[e.code] = true;
  if (e.code === 'KeyQ') Input.kbEdges.lock = true;
  if (e.code === 'KeyE') Input.kbEdges.flask = true;
  if (e.code === 'KeyF') Input.kbEdges.parry = true;
  if (e.code === 'Enter') Input.kbEdges.confirm = true;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') Input.kbEdges.menuL = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') Input.kbEdges.menuR = true;
  if (e.code === 'Escape' || e.code === 'KeyP') Input.kbEdges.pause = true;
});
window.addEventListener('keyup', e => { Input.keys[e.code] = false; });
canvas.addEventListener('mousedown', e => {
  Input.device = 'kb';
  if (e.button === 0) Input.kbEdges.light = true;
  if (e.button === 2) { Input.kbEdges.heavy = true; Input.mouseRDown = true; }
  e.preventDefault();
});
window.addEventListener('mouseup', e => { if (e.button === 2) Input.mouseRDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('gamepadconnected', () => {
  Input.device = 'pad'; AudioSys.ensure();
  G.padLost = 0;
});
// a controller dropping mid-fight should never cost a run — hold everything
window.addEventListener('gamepaddisconnected', () => {
  if (Input.device === 'pad') {
    G.padLost = 1;
    if (G.screen === 'fight') G.paused = true;
  }
});

/* =========================================================================
   PRE-RENDERED ART — glow sprites, fog sprite, and the arena's still-life
   detail are baked ONCE at load, then blitted every frame.
   ========================================================================= */
function makeGlow(r, g, b) {
  const s = document.createElement('canvas');
  s.width = s.height = 64;
  const c = s.getContext('2d');
  const grad = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, `rgba(${r},${g},${b},0.85)`);
  grad.addColorStop(0.45, `rgba(${r},${g},${b},0.3)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = grad;
  c.fillRect(0, 0, 64, 64);
  return s;
}
const GLOW_EMBER = makeGlow(255, 158, 44);
const GLOW_BLUE = makeGlow(159, 199, 255);
const GLOW_GOLD = makeGlow(232, 193, 90);
const GLOW_RED  = makeGlow(216, 101, 78);   // the pair's dull red — bleed, and their eyes

const FOG_SPRITE = (() => {
  const s = document.createElement('canvas');
  s.width = s.height = 64;
  const c = s.getContext('2d');
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(150,165,205,1)');
  g.addColorStop(1, 'rgba(150,165,205,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, 64, 64);
  return s;
})();

const FOG_BAND = (() => {
  const s = document.createElement('canvas');
  s.width = 320; s.height = 72;
  const c = s.getContext('2d');
  const rr2 = mulberry32(77);
  for (let i = 0; i < 22; i++) {
    const x = rr2() * 320, y = 18 + rr2() * 36, r = 24 + rr2() * 34;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(120,128,150,0.10)');
    g.addColorStop(1, 'rgba(120,128,150,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  }
  return s;
})();

/* shared sword profile — Nomad's blade and the five fallen ones are the SAME sword */
function drawSwordProfile(c, len, opts) {
  opts = opts || {};
  const white = opts.white;
  c.fillStyle = white ? '#ffffff' : (opts.flat ? opts.flat : '#4a3b2c');
  c.fillRect(-8, -1.8, 8, 3.6);
  c.beginPath(); c.arc(-9, 0, 2.4, 0, Math.PI * 2); c.fill();
  c.fillStyle = white ? '#ffffff' : (opts.flat ? opts.flat : '#6e6046');
  c.fillRect(-1.5, -7, 3, 14);
  if (white) c.fillStyle = '#ffffff';
  else if (opts.flat) c.fillStyle = opts.flat;
  else {
    const g = c.createLinearGradient(0, -3.5, 0, 3.5);
    g.addColorStop(0, '#f4f7ff'); g.addColorStop(0.5, '#c3cddf'); g.addColorStop(1, '#8f9ab0');
    c.fillStyle = g;
  }
  c.beginPath();
  c.moveTo(1.5, -3.2); c.lineTo(len - 8, -2.4); c.lineTo(len, 0); c.lineTo(len - 8, 2.4); c.lineTo(1.5, 3.2);
  c.closePath(); c.fill();
  if (!white && !opts.flat) {
    c.strokeStyle = 'rgba(255,255,255,0.55)';
    c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(3, 0); c.lineTo(len - 7, 0); c.stroke();
  }
}

/* procedural dead-script glyph strokes — angular marks, never letters */
function makeGlyph(rr, size, disorder) {
  const strokes = [];
  const n = 2 + Math.floor(rr() * 3);
  const j = () => (rr() - 0.5) * size * disorder * 1.6;
  strokes.push([j(), -size / 2 + j(), j(), size / 2 + j()]);
  for (let i = 1; i < n; i++) {
    const y0 = -size / 2 + rr() * size;
    const dir = rr() < 0.5 ? 1 : -1;
    strokes.push([j(), y0 + j(), dir * size * (0.4 + rr() * 0.5) + j(), y0 + j()]);
  }
  return strokes;
}
function strokeGlyph(c, glyph, x, y, alpha, col, lw) {
  c.strokeStyle = col || `rgba(178,172,160,${alpha})`;
  c.lineWidth = lw || 1;
  for (const s of glyph) { c.beginPath(); c.moveTo(x + s[0], y + s[1]); c.lineTo(x + s[2], y + s[3]); c.stroke(); }
}

/* ---------- the arena, baked once: gate, pillars, fallen swords, the
   tally, the dead-script writing, the worn practice ring ---------- */
/* The floor lying down frees a band at the top of the screen. That band is
   the far wall of the room, and the gate stands in it — the one thing here
   taller than Aldric. Baked once; it never changes. */
const WALL_H = Math.round(projY(ARENA.y)) + 8;
const WALL_BAKE = (() => {
  const s = document.createElement('canvas');
  s.width = W; s.height = WALL_H;
  const c = s.getContext('2d');
  const rr = mulberry32(20240817);

  // the mass of it, darker as it climbs out of the brazier light
  const g = c.createLinearGradient(0, 0, 0, WALL_H);
  g.addColorStop(0, '#07080c'); g.addColorStop(0.55, '#101219'); g.addColorStop(1, '#191c25');
  c.fillStyle = g; c.fillRect(0, 0, W, WALL_H);

  // courses of block, each one a little different
  const rowH = 22;
  for (let y = WALL_H % rowH; y < WALL_H; y += rowH) {
    const off = (Math.floor(y / rowH) % 2) * 38;
    for (let x = -60 + off; x < W + 60; x += 76) {
      const w2 = 76 - 3, h2 = rowH - 3;
      const lit = Math.pow(y / WALL_H, 1.4);        // only the foot of it catches the fire
      const v = (10 + rr() * 12) * (0.25 + lit * 0.95);
      c.fillStyle = `rgb(${8 + v | 0},${9 + v | 0},${14 + v | 0})`;
      c.fillRect(x, y, w2, h2);
      c.fillStyle = 'rgba(255,255,255,0.03)';       // the lit top lip of each block
      c.fillRect(x, y, w2, 1.5);
      c.fillStyle = 'rgba(0,0,0,0.35)';
      c.fillRect(x, y + h2 - 1.5, w2, 1.5);
      if (rr() < 0.2) {                              // a crack, here and there
        c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 1;
        c.beginPath();
        const sx = x + rr() * w2;
        c.moveTo(sx, y + 2); c.lineTo(sx + (rr() - 0.5) * 12, y + h2 - 2); c.stroke();
      }
    }
  }

  // THE GATE — an arch that runs off the top of the frame
  const gx = GATE.x, aw = 108, base = WALL_H;
  c.save();
  c.beginPath();
  c.moveTo(gx - aw, base);
  c.lineTo(gx - aw, 46);
  c.quadraticCurveTo(gx, -34, gx + aw, 46);
  c.lineTo(gx + aw, base);
  c.closePath();
  c.clip();
  // what lies beyond it: nothing you can see, and a little ember light
  const bg = c.createLinearGradient(0, 0, 0, base);
  bg.addColorStop(0, '#05060a'); bg.addColorStop(0.7, '#140d08'); bg.addColorStop(1, '#2a1608');
  c.fillStyle = bg; c.fillRect(gx - aw, 0, aw * 2, base);
  c.globalAlpha = 0.5;
  c.drawImage(GLOW_EMBER, gx - 120, base - 150, 240, 240);
  c.globalAlpha = 1;
  // the bars, still barring it
  c.strokeStyle = '#191b23'; c.lineWidth = 9;
  for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(gx + i * 30, 0); c.lineTo(gx + i * 30, base); c.stroke(); }
  c.strokeStyle = '#22252f'; c.lineWidth = 7;
  for (const yy of [60, 108]) { c.beginPath(); c.moveTo(gx - aw, yy); c.lineTo(gx + aw, yy); c.stroke(); }
  c.restore();
  // the arch ring itself
  c.strokeStyle = '#2b2f3b'; c.lineWidth = 7;
  c.beginPath();
  c.moveTo(gx - aw, base); c.lineTo(gx - aw, 46);
  c.quadraticCurveTo(gx, -34, gx + aw, 46);
  c.lineTo(gx + aw, base);
  c.stroke();
  c.strokeStyle = 'rgba(0,0,0,0.65)'; c.lineWidth = 2;
  c.stroke();
  // voussoirs around the arch — the stones that hold it up
  c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 1.5;
  for (let i = 0; i <= 10; i++) {
    const t = i / 10, ang = Math.PI * (1 - t);
    const ox = gx + Math.cos(ang) * -aw, oy = 46 - Math.sin(ang) * 62;
    c.beginPath(); c.moveTo(ox, oy); c.lineTo(gx + (ox - gx) * 1.18, oy - 12); c.stroke();
  }

  // the wall meets the floor in a hard dark line
  c.fillStyle = 'rgba(0,0,0,0.55)';
  c.fillRect(0, WALL_H - 7, W, 7);
  return s;
})();

const BRAZIERS = [
  [ARENA.x + 34, ARENA.y + 34], [ARENA.x + ARENA.w - 34, ARENA.y + 34],
  [ARENA.x + 34, ARENA.y + ARENA.h - 34], [ARENA.x + ARENA.w - 34, ARENA.y + ARENA.h - 34]
];
const ARENA_BAKE = (() => {
  const s = document.createElement('canvas');
  s.width = W; s.height = H;
  const c = s.getContext('2d');
  const rr = mulberry32(90210);

  // ---- floor: irregular flagstones, per-stone shade, cracks, ash drifts ----
  c.fillStyle = '#0b0d12';
  c.fillRect(0, 0, W, H);
  c.save();
  c.beginPath(); c.rect(ARENA.x, ARENA.y, ARENA.w, ARENA.h); c.clip();
  c.fillStyle = '#12141b';
  c.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
  let fy = ARENA.y - 10;
  while (fy < ARENA.y + ARENA.h + 20) {
    const rh = 38 + rr() * 18;
    let fx = ARENA.x - 30 - rr() * 30;
    while (fx < ARENA.x + ARENA.w + 20) {
      const rw = 42 + rr() * 30;
      // lit from the arena's heart, falling off toward the walls
      const lit = 1 - clamp(dist(fx + rw / 2, fy + rh / 2, W / 2, H / 2) / 470, 0, 1);
      const shade = 20 + lit * 26 + rr() * 7;
      c.fillStyle = `rgb(${shade | 0},${(shade + 2) | 0},${(shade + 9) | 0})`;
      const j = () => (rr() - 0.5) * 5;
      c.beginPath();
      c.moveTo(fx + j(), fy + j());
      c.lineTo(fx + rw + j(), fy + j());
      c.lineTo(fx + rw + j(), fy + rh + j());
      c.lineTo(fx + j(), fy + rh + j());
      c.closePath(); c.fill();
      c.strokeStyle = '#0a0b10';
      c.lineWidth = 1.4;
      c.stroke();
      if (rr() < 0.2) {          // a cracked stone
        c.strokeStyle = 'rgba(6,7,10,0.8)';
        c.lineWidth = 1;
        const cx0 = fx + rr() * rw, cy0 = fy + rr() * rh;
        c.beginPath(); c.moveTo(cx0, cy0);
        c.lineTo(cx0 + (rr() - 0.5) * 26, cy0 + (rr() - 0.5) * 22);
        c.lineTo(cx0 + (rr() - 0.5) * 44, cy0 + (rr() - 0.5) * 40);
        c.stroke();
      }
      if (rr() < 0.13) {         // ash drifted into the seams
        const ag = c.createRadialGradient(fx + rw / 2, fy + rh / 2, 0, fx + rw / 2, fy + rh / 2, rw * 0.7);
        ag.addColorStop(0, 'rgba(170,165,155,0.07)');
        ag.addColorStop(1, 'rgba(170,165,155,0)');
        c.fillStyle = ag;
        c.fillRect(fx - 10, fy - 10, rw + 20, rh + 20);
      }
      fx += rw;
    }
    fy += rh;
  }
  // scorch marks radiating from the center

   HE TRAINED YOU. The ledger of your habits — kept per character, carried
   across deaths, burned on victory. He never grows stronger from it; he
   only grows less surprised. At most two lessons per attempt, none before
   five clean observations, and every lesson is announced by the pause.
   ========================================================================= */
const HABITS = {
  data: null, storageOk: true,
  adopted: [],           // lessons active THIS attempt (two at most)
  pending: null,         // a lesson waiting for its moment
  checkT: 3,

  key() { return 'ashen_habits_' + CH().id; },
  blank() {
    return { roll: { L: 0, R: 0, K: 0 }, punish: 0, flask: [], near: 0, far: 0,
             block: 0, rolls: 0, chargeRec: 0, dc: [0, 0, 0, 0], orbit: { cw: 0, ccw: 0 } };
  },
  load() {
    let d = null;
    try { const raw = localStorage.getItem(this.key()); if (raw) d = JSON.parse(raw); }
    catch (e) { this.storageOk = false; }
    this.data = Object.assign(this.blank(), d || {});
  },
  save() {
    if (!this.data) return;
    try { localStorage.setItem(this.key(), JSON.stringify(this.data)); }
    catch (e) { this.storageOk = false; }
  },
  clear() {                              // victory: the ledger burns, both pages
    this.data = this.blank();
    try { localStorage.removeItem('ashen_habits_blade'); localStorage.removeItem('ashen_habits_pair'); }
    catch (e) {}
  },

  qualified(id) {
    const d = this.data; if (!d) return false;
    switch (id) {
      case 'rollDir': {
        const m = Math.max(d.roll.L, d.roll.R, d.roll.K), t = d.roll.L + d.roll.R + d.roll.K;
        return m >= 5 && m / t > 0.55;
      }
      case 'punish': return d.punish >= 5;
      case 'flask': {
        if (d.flask.length < 5) return false;
        const m = d.flask.reduce((a, b) => a + b, 0) / d.flask.length;
        const v = Math.sqrt(d.flask.reduce((a, b) => a + (b - m) * (b - m), 0) / d.flask.length);
        return v < 0.12;
      }
      case 'spacing': { const t = d.near + d.far; return t >= 20 && (d.near / t > 0.7 || d.far / t > 0.7); }
      case 'block': return CH().id === 'blade' && d.block >= 5 && d.block > d.rolls * 0.8;
      case 'charge': return CH().id === 'blade' && d.chargeRec >= 5;
      case 'dc': {
        if (CH().id !== 'pair') return false;
        const m = Math.max(...d.dc), t = d.dc.reduce((a, b) => a + b, 0);
        return m >= 5 && m / t > 0.6;
      }
      case 'orbit': {
        if (CH().id !== 'pair') return false;
        const t = d.orbit.cw + d.orbit.ccw;
        return t >= 12 && Math.max(d.orbit.cw, d.orbit.ccw) / t > 0.72;
      }
    }
    return false;
  },
  candidates() {
    return CH().id === 'blade'
      ? ['rollDir', 'punish', 'flask', 'spacing', 'block', 'charge']
      : ['rollDir', 'punish', 'flask', 'spacing', 'dc', 'orbit'];
  },
  glance(dt) {
    if (this.adopted.length >= 2 || this.pending) return;
    this.checkT -= dt;
    if (this.checkT > 0) return;
    this.checkT = 2.5;
    for (const id of this.candidates()) {
      if (!this.adopted.includes(id) && this.qualified(id)) { this.pending = id; break; }
    }
  },
  has(id) { return this.adopted.includes(id); },

  rollLead() { const r = this.data.roll; return (r.R >= r.L ? -1 : 1) * 0.3; },
  flaskAt() { const f = this.data.flask; return f.reduce((a, b) => a + b, 0) / Math.max(1, f.length); },
  spacingKind() { return this.data.near >= this.data.far ? 'near' : 'far'; },
  dcIndex() { return this.data.dc.indexOf(Math.max(...this.data.dc)); },
  orbitSign() { return this.data.orbit.cw >= this.data.orbit.ccw ? 1 : -1; }
};

  P.walkT = 0; P.trail.length = 0; P.speedNow = 0; P.blocking = false;
  P.blockStun = 0; P.chain = 0; P.chainT = 0; P.hchain = 0; P.hchainT = 0; P.actQueue = null;

  B.poise = 0; B.staggerT = 0; B.bleed = 0; B.defBreak = 0; B.wOff = 0.5; B.wLen = 86; B.tele = 0; B.flash = 0; B.dieT = 0;

/* Three draughts. The gate does not soften for anyone, however many
   times they come back to it. */
function flaskAllowance() { return 3; }

/* ---------- camera: a slow drift toward the action, pushed in for the beats ---------- */
function camKick(ang, amt) {
  G.kickX = Math.cos(ang) * amt;
  G.kickY = Math.sin(ang) * amt;
}
function updateCamera(dt) {
  let tx = W / 2, ty = H / 2, tz = 1.04;
  if (G.screen === 'fight' || G.screen === 'refade' || G.screen === 'dead' || G.screen === 'victory') {
    // drift toward the midpoint of the duel, clamped to the overscan slack
    /* the floor is tipped, so a body at world y shows up at projY(y) — the
       camera has to chase the projection or it frames everyone's feet */
    const mx = (P.x + B.x) / 2, my = projY((P.y + B.y) / 2);
    tx = W / 2 + clamp((mx - W / 2) * 0.28, -16, 16);
    ty = H / 2 + clamp((my - H / 2) * 0.28, -9, 9);
    // when the two close in, the camera leans in with them
    if (G.screen === 'fight' && B.state !== 'break' && B.state !== 'carve') {
      const closeness = clamp(1 - dist(P.x, P.y, B.x, B.y) / 420, 0, 1);
      tz = 1.04 + closeness * 0.05;
    }
    if (G.screen === 'dead') {         // stay on the body — this is the beat that was invisible
      const kk = clamp(G.screenT / 0.7, 0, 1);
      tz = 1.04 + 0.44 * kk;
      tx = lerp(W / 2, P.deathX, kk); ty = lerp(H / 2, projY(P.deathY) - 14, kk);
    }
    else if (B.state === 'break') { tz = 1.20; tx = lerp(tx, B.x, 0.35); ty = lerp(ty, projY(B.y), 0.35); }
    else if (G.slowmo > 0) { tz = 1.34; tx = lerp(tx, B.x, 0.5); ty = lerp(ty, projY(B.y), 0.5); }
    else if (B.state === 'carve') { tz = 1.13; tx = lerp(tx, B.x, 0.3); ty = lerp(ty, projY(B.y), 0.3); }
  }
  const sp = (G.slowmo > 0 || B.state === 'break') ? 3.4 : (G.screen === 'dead' ? 2.2 : 1.6);
  G.cam.x = lerp(G.cam.x, tx, Math.min(1, sp * dt));
  G.cam.y = lerp(G.cam.y, ty, Math.min(1, sp * dt));
  G.cam.zoom = lerp(G.cam.zoom, tz, Math.min(1, sp * dt));
  // the directional kick: every landed hit shoves the frame along the blow
  G.kickX = (G.kickX || 0) * Math.max(0, 1 - 9 * dt);
  G.kickY = (G.kickY || 0) * Math.max(0, 1 - 9 * dt);
  G.cam.x += G.kickX; G.cam.y += G.kickY;
  // never let the drift reveal past the world edges
  const halfW = W / (2 * G.cam.zoom), halfH = H / (2 * G.cam.zoom);
  G.cam.x = clamp(G.cam.x, halfW, W - halfW);
  G.cam.y = clamp(G.cam.y, halfH, H - halfH);
}
function goto(screen) { G.screen = screen; G.screenT = 0; }

/* =========================================================================
   COMBAT HELPERS
   ========================================================================= */
function spawnParticles(x, y, n, col, sp, life) {
  for (let i = 0; i < n; i++) {
    if (G.particles.length >= PART_CAP) G.particles.shift();
    const a = rand(0, Math.PI * 2), v = rand(sp * 0.3, sp);
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(life * 0.5, life), maxLife: life, col, size: rand(1.5, 4) });
  }
}
function spawnDrift(x, y, vx, vy, col, life, size) {
  if (G.particles.length >= PART_CAP) G.particles.shift();
  G.particles.push({ x, y, vx, vy, life, maxLife: life, col, size });
}
function addSlash(x, y, ang, r, half, col, dur) {
  G.slashes.push({ x, y, ang, r, half, col, t: 0, dur });
}

function playerInvulnerable() {
  if (G.cinematic) return true;
  if (P.hurtInv > 0) return true;
  if (P.act && P.act.type === 'roll' && P.act.t < P.act.dur * CH().iFrames) return true;
  return false;
}

/* ---------- ember fissures: race out along the ground from a slam ---------- */
function spawnFissures(ix, iy) {
  const base = Math.atan2(P.y - iy, P.x - ix);   // aimed where the player stood at impact
  const group = { hit: false };
  for (const off of [-0.55, -0.18, 0.18, 0.55]) {
    const jit = [];
    for (let i = 0; i < 12; i++) jit.push((Math.random() - 0.5) * 15);
    G.fissures.push({ x: ix, y: iy, ang: base + off, len: 0, maxLen: rand(220, 280), speed: 430, t: 0, jit, group });
  }
  sfx.fissure();
}
function updateFissures(dt) {
  for (let i = G.fissures.length - 1; i >= 0; i--) {
    const f = G.fissures[i];
    f.t += dt;
    if (f.len < f.maxLen) {
      f.len = Math.min(f.maxLen, f.len + f.speed * dt);
      if (!f.group.hit && !P.dead) {
        const dx = Math.cos(f.ang), dy = Math.sin(f.ang);
        const px = P.x - f.x, py = P.y - f.y;
        const along = px * dx + py * dy;
        if (along > 8 && along < f.len) {
          const off = Math.abs(px * -dy + py * dx);
          if (off < 15 + P.r * 0.6) {
            if (damagePlayer(26, f.x + dx * along, f.y + dy * along, false)) f.group.hit = true;
            else if (playerInvulnerable()) f.group.hit = true;   // rolled perpendicular — it's past you
          }
        }
      }
      if (Math.random() < dt * 20) {
        spawnDrift(f.x + Math.cos(f.ang) * f.len, f.y + Math.sin(f.ang) * f.len,
          rand(-14, 14), rand(-55, -20), ACCENT, rand(0.3, 0.7), rand(1.5, 3));
      }
    }
    if (f.t > 1.5) G.fissures.splice(i, 1);
  }
}

/* ---------- the discarded maul head, lying where it fell ---------- */
function updateDebris(dt) {
  const d = G.debris;
  if (!d || d.settleT <= 0) return;
  d.settleT -= dt;
  d.x += d.vx * dt; d.y += d.vy * dt;
  d.rot += d.vr * dt;
  d.vx -= d.vx * 3.2 * dt; d.vy -= d.vy * 3.2 * dt; d.vr -= d.vr * 3 * dt;
  d.x = clamp(d.x, ARENA.x + 20, ARENA.x + ARENA.w - 20);
  d.y = clamp(d.y, ARENA.y + 20, ARENA.y + ARENA.h - 20);
  if (d.settleT <= 0) { d.vx = d.vy = d.vr = 0; }
}

function damagePlayer(dmg, srcX, srcY, parryable, kbMult) {
  if (P.dead) return false;
  if (playerInvulnerable()) return false;
  // PARRY — the blade turned aside at the exact moment, from the front
  if (parryable && P.act && P.act.type === 'parry' && P.act.t <= 0.2) {
    const toSrc = Math.atan2(srcY - P.y, srcX - P.x);
    if (Math.abs(angDiff(P.face, toSrc)) < 1.9) {
      P.act.success = true;
      onParrySuccess();
      return false;                          // the hit never lands
    }
  }
  // block — guard held, attack from the front
  if (P.blocking && CH().canBlock && P.st > 0) {
    const toSrc = Math.atan2(srcY - P.y, srcX - P.x);
    if (Math.abs(angDiff(P.face, toSrc)) < 1.75) {
      // the shard's quick cuts are hard to catch — they eat far more stamina through a guard
      const cost = (14 + dmg * 0.45) * (B.broken ? 1.5 : 1);
      if (P.st >= cost) {                    // the guard holds — chip damage + stamina
        P.st -= cost; P.stDelay = 0.7;
        P.hp -= Math.max(1, Math.round(dmg * 0.22));
        P.hurtInv = Math.max(P.hurtInv, 0.2);
        const ba = Math.atan2(P.y - srcY, P.x - srcX);
        P.kbX = Math.cos(ba) * 130; P.kbY = Math.sin(ba) * 130;
        spawnParticles(P.x + Math.cos(toSrc) * 14, P.y + Math.sin(toSrc) * 14, 8, '#cfd6e4', 180, 0.35);
        G.hitstop = Math.max(G.hitstop, 0.035);
        G.shake = Math.max(G.shake, 4);
        sfx.block();
        if (HABITS.data) HABITS.data.block++;
        P.resolve = Math.min(10, P.resolve + 0.5);   // the guard held — that too is form
        P.blockStun = 0.2;                   // shoved back onto your heels for a beat
        rumble(90, 0.3, 0.5);
        if (P.hp <= 0) { P.hp = 0; P.dead = true; P.deathX = P.x; P.deathY = P.y; P.deathFace = P.face; killPlayer(); }
        return true;
      }
      // not enough stamina behind the shield-arm — GUARD BREAK
      P.st = -25; P.stDelay = 0.9;
      P.resolve = 0;
      dmg = Math.round(dmg * 0.5);
      P.hp -= dmg;
      P.flash = 0.12;
      P.hurtInv = 0.45;
      const gba = Math.atan2(P.y - srcY, P.x - srcX);
      P.kbX = Math.cos(gba) * 330; P.kbY = Math.sin(gba) * 330;
      P.act = { type: 'hurt', t: 0, dur: 0.7 }; P.actQueue = null;
      G.hitstop = Math.max(G.hitstop, 0.08);
      G.shake = Math.max(G.shake, 11);
      spawnParticles(P.x, P.y, 16, '#c33b3b', 200, 0.5);
      sfx.guardBreak();
      rumble(320, 1.0, 0.6);
      if (P.hp <= 0) { P.hp = 0; P.dead = true; P.deathX = P.x; P.deathY = P.y; P.deathFace = P.face; killPlayer(); }
      return true;
    }
  }
  if (CH().id === 'pair' && P.frenzy >= 8) dmg = Math.round(dmg * 1.15);   // he refused the world; it did not refuse him
  P.resolve = 0;                              // discipline is unbroken until it is broken
  P.hp -= dmg;
  P.flash = 0.12;
  P.hurtInv = 0.45;
  const a = Math.atan2(P.y - srcY, P.x - srcX);
  camKick(a, 4.5);
  const kb = 260 * (kbMult || 1);
  P.kbX = Math.cos(a) * kb; P.kbY = Math.sin(a) * kb;
  const wasFlask = P.act && P.act.type === 'flask';
  P.act = { type: 'hurt', t: 0, dur: 0.35 }; P.actQueue = null;
  if (wasFlask) sfx.flaskEmpty(); // the sip is wasted
  G.hitstop = Math.max(G.hitstop, 0.07);
  G.shake = Math.max(G.shake, 9 + dmg * 0.15);
  spawnParticles(P.x, P.y, 14, '#c33b3b', 190, 0.5);
  sfx.playerHit();
  rumble(220, 0.95, 0.5);
  if (P.hp <= 0) { P.hp = 0; P.dead = true; P.deathX = P.x; P.deathY = P.y; P.deathFace = P.face; killPlayer(); }
  return true;
}

function killPlayer() {
  P.act = null;
  G.deaths++;
  HABITS.save();                          // he writes down what he saw
  G.hitstop = Math.max(G.hitstop, 0.2);   // the world catches its breath as he goes down
  sfx.helmSigh();
  sfx.bell();
  rumble(500, 0.8, 0.8);
  goto('dead');
}

function damageBoss(dmg, noBleed) {
  if (B.state === 'dying' || B.state === 'carve' || G.screen !== 'fight') return;
  dmg = Math.round(dmg * (1 + 0.01 * B.defBreak));   // sundered armor keeps none of it out
  const lethal = B.hp - dmg <= 0;
  B.hp -= dmg;
  B.flash = 0.1;
  B.poise += CH().poisePerHit;
  G.hitstop = Math.max(G.hitstop, 0.07);
  G.shake = Math.max(G.shake, 4);
  const a = Math.atan2(P.y - B.y, P.x - B.x);
  camKick(a + Math.PI, 2.6);   // the frame leans into the blow
  spawnParticles(B.x + Math.cos(a) * B.r, B.y + Math.sin(a) * B.r, 10, '#e8e2d0', 170, 0.4);
  G.dmgNums.push({ x: B.x + Math.cos(a) * (B.r + 10), y: bossHeadY() + 10, v: dmg, t: 0 });
  if (!lethal) sfx.hitArmor();   // the last blow belongs to his cry alone
  rumble(70, 0.15, 0.5);
  if (!noBleed && !lethal) addBleed();   // a coated cut banks its share of the debt

  if (B.poise >= BD().poiseMax && B.state !== 'stagger' && B.state !== 'break' && B.state !== 'daze' && B.state !== 'hesitate') {
    B.state = 'stagger'; B.stateT = 0; B.staggerT = 1.5; B.poise = 0;
    B.atk = null; B.tele = 0;
    sfx.stagger();
    G.shake = Math.max(G.shake, 8);
    spawnParticles(B.x, B.y, 24, ACCENT, 220, 0.6);
  }

  // THE BREAK — at half health he makes a decision
  const tr = BD().transition;
  if (tr && !B.phase2 && B.state !== tr.state && B.hp <= B.hpMax * tr.at && B.hp > 0) {
    B.state = tr.state; B.stateT = 0; B.breakStep = 0;
    B.atk = null; B.tele = 0;
    G.cinematic = true;
    G.fissures.length = 0;
    AudioSys.duck(0.05, 0.5);   // the room falls near-silent
    return;
  }

  if (B.hp <= 0) {
    B.hp = 0; B.atk = null; B.tele = 0;
    // the killing blow: time dilates, the room holds its breath
    G.slowmo = 0.55;
    G.hitstop = Math.max(G.hitstop, 0.14);
    G.shake = Math.max(G.shake, 12);
    rumble(420, 0.9, 0.7);
    sfx.deathCry();              // on the voice bus; the room clears out from under it
    AudioSys.duck(0.045, 0.18);
    spawnParticles(B.x, B.y, 34, '#ffe9a8', 260, 0.9);
    HABITS.clear();                        // a new run starts clean — both pages of the ledger
    BD().onDeath();
  }
}

function spendStamina(cost) { P.st = Math.max(-25, P.st - cost); P.stDelay = 0.7; }

/* A perfect parry: his swing is turned, and for a moment he is the one exposed. */
function onParrySuccess() {
  sfx.parry();
  G.hitstop = Math.max(G.hitstop, 0.09);
  G.shake = Math.max(G.shake, 6);
  rumble(160, 0.5, 0.9);
  const mx = (P.x + B.x) / 2, my = (P.y + B.y) / 2;
  spawnParticles(mx, my, 18, '#ffe9a8', 260, 0.45);
  spawnParticles(mx, my, 8, '#f2f6ff', 340, 0.3);
  if (B.state === 'attack' || B.state === 'idle' || B.state === 'chainPause') {
    B.state = 'recoil'; B.stateT = 0;
    B.atk = null; B.tele = 0; B.phaseStarted = false;
  }
}

/* =========================================================================
   THE CLASH — two committed swings meeting in the same instant.
   Rare by construction: the player's blade must be in the heart of its own
   active frames on the exact frame Aldric's connects. Rolling and blocking
   are checked first and always win the argument.
   ========================================================================= */
const CLASH_SET1 = { slam: 1, buried: 1, spin: 1, charge: 1, sweep: 1 };
const CLASH_SET2 = { rising: 1, step: 1 };   // the quick shard work just trades

/* =========================================================================
   THE BESTIARY
   A boss is a pile of data plus a handful of beats that are only his.
   Everything the engine needs to run one lives in this table: his name and
   health, the shape he presents in each phase, which attacks he owns, how
   he chooses between them, how he stands when he is not swinging, and the
   scripted moments that are his alone. Adding another means writing a new
   entry here — the driver in updateBoss() never learns his name.
   ========================================================================= */
const BOSSES = {
  aldric: {
    id: 'aldric', name: 'ALDRIC',
    hpMax: 1200,
    poiseMax: 6,                    // clean hits before his stance gives
    entry: { x: ARENA.x + ARENA.w - 170, face: Math.PI },
    phases: [
      { id: 'maul',  set: ATK1, r: 34, height: 46, wLen: 86,
        clash: CLASH_SET1, choose: chooseAttack1, idle: aldricIdleMaul },
      { id: 'shard', set: ATK2, r: 19, height: 30, wLen: 58,
        clash: CLASH_SET2, choose: chooseAttack2, idle: aldricIdleShard }
    ],
    /* states the engine hands straight back to him */
    states: { carve: aldricCarve, break: aldricBreak, hesitate: aldricHesitate, read: aldricRead },
    /* the half-health decision, and what is left when he loses */
    transition: { at: 0.5, state: 'break' },

};
function BD() { return BOSSES[B.defId] || BOSSES.aldric; }
function BPH() { return BD().phases[B.phase2 ? 1 : 0]; }
/* Everything the world draws sits on the flattened floor, but the two of them
   stand up out of it. Anything meant to float over a head has to climb the
   same distance the body did. */
function liftOf(h) { return h / SQUASH; }
function bossHeadY() {
  const shr = B.phase2 ? 0.58 : 1;
  return B.y - liftOf(BPH().height * 0.9 * shr + B.r * shr + 6);
}
function playerHeadY() { return P.y - liftOf(22 + 16); }

function playerAttackActive() {
  const a = P.act;
  if (!a || (a.type !== 'light' && a.type !== 'heavy') || a.charging) return null;
  const et = a.t - (a.held || 0);
  const heavy = a.type === 'heavy';
  const w0 = a.dur * (heavy ? 0.42 : 0.38), w1 = a.dur * (heavy ? 0.64 : 0.68);
  // only the heart of the swing can catch steel — the edges are too late or too early
  const c0 = w0 + (w1 - w0) * 0.2, c1 = w0 + (w1 - w0) * 0.8;
  return (et >= c0 && et <= c1) ? a : null;
}

/* returns 'clash' | 'win' | 'deflect' | null. Called only when Aldric's blow
   has already connected geometrically. */
function tryClash() {
  if (G.screen !== 'fight') return null;
  if (playerInvulnerable() || P.blocking) return null;   // the roll and the guard resolve first, always
  if (!BPH().clash[B.atk]) return null;
  const a = playerAttackActive();
  if (!a) return null;
  if (CH().id === 'blade' && a.type !== 'heavy') return null;   // the light cut trades; only the heavy argues

  const ang = Math.atan2(B.y - P.y, B.x - P.x);
  const cx = P.x + Math.cos(ang) * (P.r + 22), cy = P.y + Math.sin(ang) * (P.r + 22);

  if (CH().id === 'pair') {                    // two knives cannot stop a maul
    P.act = { type: 'deflected', t: 0, dur: 0.6 };
    P.actQueue = null;
    P.z = 18;                                    // slapped off his feet entirely
    P.kbX = -Math.cos(ang) * 380; P.kbY = -Math.sin(ang) * 380;
    G.hitstop = Math.max(G.hitstop, 0.05);
    G.shake = Math.max(G.shake, 7);
    rumble(180, 0.5, 0.6);
    sfx.deflect();
    clashSparks(cx, cy, 10, false);
    return 'deflect';
  }

  if (a.chargeToll) {                          // the fully charged smash does not negotiate
    a.hit0 = true; a.hitDone = true;
    const dmg = Math.round(CH().heavyDmg * (1 + (a.chargeT || 0) / CH().chargeMax));
    damageBoss(dmg, true);
    B.defBreak += 1;
    G.dmgNums.push({ x: B.x, y: bossHeadY() - 6, v: 'SUNDERED', t: 0 });
    breakPoise();
    B.x += Math.cos(ang) * 34; B.y += Math.sin(ang) * 34;
    B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
    B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
    G.hitstop = Math.max(G.hitstop, 0.16);
    G.shake = Math.max(G.shake, 18);
    rumble(600, 1.0, 1.0);
    sfx.clash();
    G.rings.push({ x: cx, y: cy, t: 0, dur: 0.5, big: true });
    clashSparks(cx, cy, 40, true);
    return 'win';
  }

  // NEUTRAL CLASH — both blades ring, both bodies give ground
  P.act = { type: 'clashed', t: 0, dur: 0.35 };
  P.actQueue = null;
  P.z = 15; B.z = Math.max(B.z || 0, 12);        // the bind lifts them both
  P.kbX = -Math.cos(ang) * 320; P.kbY = -Math.sin(ang) * 320;
  B.state = 'clashed'; B.stateT = 0; B.atk = null; B.tele = 0; B.pushA = ang;
  G.hitstop = Math.max(G.hitstop, 0.11);
  G.shake = Math.max(G.shake, 16);
  rumble(450, 1.0, 1.0);
  sfx.clash();
  G.rings.push({ x: cx, y: cy, t: 0, dur: 0.4, big: false });
  clashSparks(cx, cy, 26, true);
  return 'clash';
}

// physics sparks: thrown hard, then dragged down by the world
function clashSparks(x, y, n, hot) {
  for (let i = 0; i < n; i++) {
    if (G.particles.length >= PART_CAP) G.particles.shift();
    const a = rand(0, Math.PI * 2), v = rand(90, hot ? 380 : 220);
    G.particles.push({
      x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - rand(30, hot ? 150 : 80),
      grav: 640,
      life: rand(0.25, hot ? 0.75 : 0.45), maxLife: 0.75,
      col: hot ? (i % 3 ? '#ffe9c8' : '#fff6e6') : (i % 2 ? 'rgba(190,182,168,0.8)' : '#c98a52'),
      size: rand(1.2, hot ? 3 : 2.2)
    });
  }
}

/* Aldric's poise, ended outright rather than chipped away — the charged smash. */
function breakPoise() {
  if (B.state === 'stagger' || B.state === 'break' || B.state === 'daze' || B.state === 'hesitate') return;
  if (B.state === 'carve' || B.hp <= 0) return;
  B.state = 'stagger'; B.stateT = 0; B.staggerT = 1.8; B.poise = 0;
  B.atk = null; B.tele = 0;
  sfx.stagger();
  G.shake = Math.max(G.shake, 10);
  spawnParticles(B.x, B.y, 26, ACCENT, 230, 0.6);
}

/* THE BLOOD RITUAL — the pair cuts his own palm across both edges (1% of his
   own life), and for thirty seconds the steel remembers it. Every coated hit
   banks a debt against Aldric — one-eighth of a percent of his whole life per
   cut — and the debt is paid out as damage over time whether the cutting
   continues or not. The ritual takes a minute to be willing to work again. */
function startRitual() {
  if (CH().id !== 'pair' || G.screen !== 'fight' || P.dead || G.cinematic) return;
  if (P.ritualCd > 0) { sfx.flaskEmpty(); return; }   // the blood is not ready
  P.hp = Math.max(1, P.hp - Math.max(1, P.hpMax * 0.01));   // it cannot kill him, only cost him
  P.coatT = 30;
  P.ritualCd = 60;
  P.flash = 0.08;
  sfx.rupture();
  rumble(180, 0.4, 0.6);
  spawnParticles(P.x, P.y, 14, '#c0392b', 160, 0.5);
  spawnParticles(P.x, P.y, 6, '#e8654e', 220, 0.35);
}
function addBleed() {
  if (!CH().bleed || P.coatT <= 0) return;
  if (B.state === 'carve' || B.hp <= 0 || G.screen !== 'fight') return;
  B.bleed += B.hpMax * 0.0025;             // twenty coated hits = 5% of his life, owed
}

/* ---------- the carving (the ending) ---------- */
function startCarve() {
  P.locked = false;
  B.state = 'carve'; B.stateT = 0;
  const rr = mulberry32((Math.random() * 1e9) | 0);
  const glyphs = [];
  for (let i = 0; i < 9; i++) glyphs.push(makeGlyph(rr, 13, 0.35));
  const strokes = [];
  glyphs.forEach((g2, gi) => { g2.forEach(s => strokes.push({ g: gi, s })); });
  /* He falls where he stood, and writes on the stone in front of him. */
  G.carve = {
    phase: 'fall', t: 0,
    x: B.x + Math.cos(B.face) * 34, y: B.y + Math.sin(B.face) * 20,
    strokes, progress: 0, scrapeT: 0, thudDone: false
  };
}

/* =========================================================================
   PLAYER UPDATE
   ========================================================================= */
function updatePlayer(dt) {
  if (P.dead) return;
  P.hurtInv = Math.max(0, P.hurtInv - dt);
  P.flash = Math.max(0, P.flash - dt);
  P.stFlash = Math.max(0, P.stFlash - dt * 2.2);
  P.hpGhost = Math.max(P.hp, P.hpGhost - P.hpMax * 0.3 * dt);

  // scarf trails the shoulder — his one cool-blue mark
  {
    let ax = P.x + Math.cos(P.face + 2.4) * 10, ay = P.y + Math.sin(P.face + 2.4) * 10;
    for (const s2 of P.scarf) {
      s2.x += (ax - s2.x) * Math.min(1, 13 * dt);
      s2.y += (ay - s2.y) * Math.min(1, 13 * dt);
      ax = s2.x; ay = s2.y;
    }
  }

  if (G.cinematic) return;    // the break holds him still and untouchable

  // knockback decay
  P.x += P.kbX * dt; P.y += P.kbY * dt;
  P.kbX -= P.kbX * 10 * dt; P.kbY -= P.kbY * 10 * dt;

  const mvX = Input.moveX, mvY = Input.moveY, mag = Input.moveMag;
  if (mag > 0.01) { P.moveDirX = mvX / (Math.hypot(mvX, mvY) || 1); P.moveDirY = mvY / (Math.hypot(mvX, mvY) || 1); }

  // lock-on toggle
  if (Input.lock && G.screen === 'fight') {
    if (B.state !== 'dying' && B.state !== 'carve') P.locked = !P.locked;
  }
  if (B.state === 'dying' || B.state === 'carve') P.locked = false;

  // facing
  if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
  else if (mag > 0.01 && (!P.act || P.act.type === 'flask')) P.face = Math.atan2(mvY, mvX);

  // guard is a held stance, and only the one who was given a real sword has one
  P.blocking = Input.blockHeld && CH().canBlock && !P.act && G.screen === 'fight';
  // the same hand that raises the knight's guard opens the scavenger's palm
  if (Input.blockPressed && CH().id === 'pair') startRitual();
  P.ritualCd = Math.max(0, P.ritualCd - dt);
  P.coatT = Math.max(0, P.coatT - dt);

  const busy = P.act && P.act.type !== 'flask';
  const sprinting = Input.sprint && !busy && !P.blocking && mag > 0.01 && P.st > 0;

  /* ---- start buffered actions ---- */
  const C = CH();
  /* a press made mid-swing is remembered until the swing ends — this is what
     makes the strings chain like they should, instead of the input dying in
     the 150ms buffer while a long swing finishes */
  if (P.act && (P.act.type === 'light' || P.act.type === 'heavy') && !P.act.charging && P.act.t > P.act.dur * 0.3) {
    if (Input.light) P.actQueue = 'light';
    if (Input.heavy) P.actQueue = 'heavy';
  }
  // DASH-CANCEL — the scavenged pair may leave any attack's recovery early.
  // This is the whole character: mobility instead of a guard.
  let canAct = (!P.act || (P.act.type === 'flask')) && P.blockStun <= 0;
  if (!canAct && C.dashCancel && P.act && Input.peekBuffer() === 'roll' && P.st > 0) {
    const a = P.act;
    const cancellable = a.type === 'light' || a.type === 'heavy';
    const past = cancellable && a.t > a.dur * (a.type === 'heavy' ? 0.64 : 0.68);   // the cut is spent; the rest is recovery
    if (past) canAct = true;                 // the cut has already landed; the rest is just recovery
  }

  if (canAct && G.screen === 'fight') {
    const want = Input.peekBuffer();
    if (want === 'roll' && P.st > 0) {
      Input.consumeBuffer();
      spendStamina(25);
      let dx = P.moveDirX, dy = P.moveDirY;
      if (mag <= 0.01) {
        if (P.locked) { const a = Math.atan2(P.y - B.y, P.x - B.x); dx = Math.cos(a); dy = Math.sin(a); }
        else { dx = Math.cos(P.face); dy = Math.sin(P.face); }
      } else { dx = mvX / (Math.hypot(mvX, mvY) || 1); dy = mvY / (Math.hypot(mvX, mvY) || 1); }
      /* he watches which way you leave, and out of what */
      const wasCancel = P.act && (P.act.type === 'light' || P.act.type === 'heavy');
      if (HABITS.data) {
        const dd = dist(P.x, P.y, B.x, B.y) || 1;
        const ux = (B.x - P.x) / dd, uy = (B.y - P.y) / dd;
        const dot = dx * ux + dy * uy, cross = ux * dy - uy * dx;
        if (dot < -0.45) HABITS.data.roll.K++;
        else if (cross > 0) HABITS.data.roll.R++;
        else HABITS.data.roll.L++;
        HABITS.data.rolls++;
        if (wasCancel && C.dashCancel) {
          const ci = clamp(P.chain, 0, 3);
          HABITS.data.dc[ci]++;
          // the answer to a rhythm he has memorized arrives on the beat
          if (HABITS.has('dc') && ci === HABITS.dcIndex() && dist(P.x, P.y, B.x, B.y) < 260
              && B.state === 'idle') B.cd = Math.min(B.cd, 0.12);
        }
      }
      P.act = { type: 'roll', t: 0, dur: C.rollDur, dirX: dx, dirY: dy };
      P.actQueue = null;
      sfx.roll(C.id === 'pair');
      for (let i = 0; i < 4; i++) spawnDrift(P.x - dx * 8, P.y - dy * 8 + 5, -dx * rand(20, 50) + rand(-12, 12), rand(-18, -4), 'rgba(150,146,138,0.45)', rand(0.3, 0.5), rand(1.5, 2.5));
    } else if (want === 'parry' && (!P.act) && P.st > 0) {
      Input.consumeBuffer();
      spendStamina(10);
      if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
      P.act = { type: 'parry', t: 0, dur: 0.45, success: false };
      G.lastAggro = G.time;
    } else if ((want === 'light' || want === 'heavy') && (!P.act) && P.st > 0
               && B.state === 'recoil' && P.spGauge >= SP_MAX
               && dist(P.x, P.y, B.x, B.y) < 170) {
      /* THE ANSWERING BLOW — he is reeling from a parry, and the long-held
         debt is called in. Same price paid to him either way; the two do not
         collect it the same way. */
      Input.consumeBuffer();
      P.spGauge = 0;
      P.face = Math.atan2(B.y - P.y, B.x - P.x);
      P.act = { type: 'special', t: 0, dur: C.id === 'pair' ? 0.72 : 0.66, face: P.face, stabs: 0 };
      G.lastAggro = G.time;
    } else if ((want === 'light' || want === 'heavy') && (!P.act) && P.st > 0) {
      Input.consumeBuffer();
      const heavy = want === 'heavy';
      /* strings: each press inside the window advances the sentence.
         Lights and heavies keep separate chains, like they should. */
      const str = heavy ? C.heavyStr : C.lightStr;
      if (heavy) {
        P.hchain = (P.hchainT > 0) ? (P.hchain + 1) % str.length : 0;
        P.hchainT = 0.75;
      } else {
        P.chain = (P.chainT > 0) ? (P.chain + 1) % str.length : 0;
        P.chainT = 0.6;
      }
      const spec = str[heavy ? P.hchain : P.chain];
      if (HABITS.data && (B.state === 'stagger' || B.state === 'daze')) HABITS.data.punish++;
      spendStamina(spec.stam);
      if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
      P.swingAlt = !P.swingAlt;
      P.act = { type: want, t: 0, dur: spec.dur, spec, hitDone: false, face: P.face,
                side: spec.side || 1, held: 0,
                charging: heavy && !!spec.charge && C.chargeMax > 0, chargeT: 0, chargeToll: false };
      G.lastAggro = G.time;                  // swinging reads as aggression
    } else if ((want === 'light' || want === 'heavy' || want === 'roll' || want === 'parry') && P.st <= 0) {
      // not enough stamina — drop it and flash the stamina bar
      Input.consumeBuffer();
      P.stFlash = 0.4;
    }
  }
  // flask (not buffered; explicit press)
  if (Input.flask && !P.act && G.screen === 'fight') {
    if (P.flasks > 0) {
      P.flasks -= 1;
      if (HABITS.data) { HABITS.data.flask.push(P.hp / P.hpMax); if (HABITS.data.flask.length > 10) HABITS.data.flask.shift(); }
      P.act = { type: 'flask', t: 0, dur: 1.0 };
      sfx.gulp();
    } else sfx.flaskEmpty();
  }

  // frenzy starves in stillness; resolve simply waits
  P.frenzyT = Math.max(0, P.frenzyT - dt);
  if (P.frenzy > 0 && P.frenzyT <= 0) { P.frenzy--; P.frenzyT = 0.6; }

  /* ---- run current action ---- */
  let speedMul = 1;
  if (P.act) {
    const hasten = (CH().id === 'pair' && (P.act.type === 'light' || P.act.type === 'heavy'))
      ? 1 + 0.04 * P.frenzy : 1;                 // madness moves the hands faster
    P.act.t += dt * hasten;
    const a = P.act;
    if (a.type === 'roll') {
      P.z = Math.max(0, (P.z || 0) - 200 * dt);
      const k = a.t / a.dur;
      const sp = C.rollSpeed * (1 - k * 0.75);
      P.x += a.dirX * sp * dt; P.y += a.dirY * sp * dt;
      P.trail.push({ x: P.x, y: P.y, rot: Math.atan2(a.dirY, a.dirX), a: 0.9 });
      if (a.dirX * (B.x - P.x) + a.dirY * (B.y - P.y) > 0) G.lastAggro = G.time;   // rolling in counts
      speedMul = 0;
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'light' || a.type === 'heavy') {
      speedMul = 0;
      const heavy = a.type === 'heavy';
      const spec = a.spec || (heavy ? C.heavyStr[0] : C.lightStr[0]);
      const held = a.held || 0;                    // time spent frozen at the top of a charge
      const et = a.t - held;                       // elapsed swing time, charge excluded
      const wStart = a.dur * (heavy ? 0.42 : 0.38), wEnd = a.dur * (heavy ? 0.64 : 0.68);

      /* intent beats sequence: a trigger still held a fifth of a second into
         an unchargeable follow-up was asking for the charge all along — the
         wind-up converts into the opening smash before anything commits */
      if (heavy && !spec.charge && C.chargeMax > 0 && Input.heavyHeld && !a.hitDone
          && a.t >= 0.2 && !a.converted) {
        const s0 = C.heavyStr[0];
        P.hchain = 0;
        P.act = { type: 'heavy', t: a.t, dur: s0.dur, spec: s0, hitDone: false, face: a.face,
                  side: 1, held: 0, charging: true, chargeT: 0, chargeToll: false, converted: true };
        return;
      }

      // soft tracking through the wind-up — the string turns with its target
      if (et < a.dur * 0.3 && !a.charging) {
        const want2 = P.locked ? Math.atan2(B.y - P.y, B.x - P.x)
          : (Input.moveMag > 0.01 ? Math.atan2(Input.moveY, Input.moveX) : a.face);
        a.face = turnToward(a.face, want2, 4.5 * dt);
        P.face = a.face;
      }

      /* THE GIVEN BLADE's charged heavy: keep the trigger down and he holds the
         sword at the top, the edge gathering pale light. It burns stamina the
         whole time, and a hit knocks it out of him. Released full, it does not
         just hurt — it takes Aldric off his feet. */
      if (heavy && a.charging) {
        if (et >= a.dur * 0.32) {
          a.held = held + dt;                      // frozen: et stops advancing
          /* the held wind-up tracks — locked on he keeps the point on Aldric,
             unlocked he can be steered with the stick. Release latches it:
             the falling blade itself stays committed and dodgeable. */
          if (P.locked) a.face = Math.atan2(B.y - P.y, B.x - P.x);
          else if (Input.moveMag > 0.01) a.face = turnToward(a.face, Math.atan2(Input.moveY, Input.moveX), 2.5 * dt);
          P.face = a.face;
          if (!Input.heavyHeld) a.charging = false;
          else {
            a.chargeT = Math.min(C.chargeMax, a.chargeT + dt);
            if (!a.chargeObs && a.chargeT > 0.3 && HABITS.data) {
              a.chargeObs = true;
              const bAtk = B.state === 'attack' && B.atk && (B.setRef || currentSet())[B.atk];
              const inRec = (bAtk && bAtk.phases[B.phaseIdx] && bAtk.phases[B.phaseIdx].k === 'r')
                || (B.state === 'idle' && B.cd > 0.35);
              if (inRec) HABITS.data.chargeRec++;
            }
            P.st = Math.max(-25, P.st - C.chargeDrain * dt); P.stDelay = 0.7;
            if (a.chargeT >= C.chargeMax || P.st <= 0) {
              if (!a.chargeToll && a.chargeT >= C.chargeMax) { a.chargeToll = true; sfx.chargeFull(); }
              a.charging = false;
            }
            if (Math.random() < 0.25) spawnDrift(P.x + rand(-14, 14), P.y + rand(-14, 6), rand(-10, 10), rand(-30, -8), COOL, 0.5, 2);
          }
        }
      }
      const ck = C.chargeMax > 0 ? (a.chargeT || 0) / C.chargeMax : 0;
      const full = ck >= 0.55;                     // enough of a charge to matter
      const power = heavy ? 1 + ck * 1.0 : 1;

      // the spins leave the floor; everything else stays on it
      if (spec.kind === 'spin' || spec.kind === 'rspin') {
        P.z = Math.sin(clamp(et / a.dur, 0, 1) * Math.PI) * 13;
      } else P.z = Math.max(0, (P.z || 0) - 150 * dt);

      // every swing carries the body — nobody fences flat-footed
      if (!a.charging && et > a.dur * 0.16 && et < a.dur * 0.62) {
        const step = (spec.glide || 60) * (1 + ck * 0.5);
        P.x += Math.cos(a.face) * step * dt; P.y += Math.sin(a.face) * step * dt;
      }

      const reach = spec.reach;
      const half = spec.half;
      const base = spec.dmg;

      /* the spins cut twice, once per blade */
      const cuts = spec.cuts || 1;
      for (let ci = 0; ci < cuts; ci++) {
        const cs = wStart + (wEnd - wStart) * (ci / cuts);
        const ce = cuts === 1 ? wEnd : wStart + (wEnd - wStart) * ((ci + 0.7) / cuts);
        if (!a.charging && et >= cs && et <= ce && !a['hit' + ci]) {
          const d = dist(P.x, P.y, B.x, B.y);
          const hitR = B.r + (B.phase2 ? 15 : 0);   // he is smaller in phase 2; your reach is not
          if (d < reach + hitR && Math.abs(angDiff(a.face, Math.atan2(B.y - P.y, B.x - P.x))) < half + Math.asin(clamp(hitR / Math.max(d, hitR), 0, 1))) {
            a['hit' + ci] = true; a.hitDone = true;
            let out = base / cuts * power;
            if (C.id === 'pair') {
              out *= rand(0.78, 1.3);            // a madman never swings the same cut twice
              P.frenzy = Math.min(8, P.frenzy + 1); P.frenzyT = 2.0;
            } else {
              out *= 1 + 0.012 * P.resolve;      // form, compounding quietly
              P.resolve = Math.min(10, P.resolve + 1);
            }
            damageBoss(Math.round(out));
            if (spec.poise) B.poise += CH().poisePerHit * (spec.poise - 1);   // the thrust lands like a hammer
            if (spec.bleed2) addBleed();                                      // the scissor banks its debt twice
            if (spec.kind === 'thrust' || spec.kind === 'scissor') {
              G.hitstop = Math.max(G.hitstop, 0.09);
              G.shake = Math.max(G.shake, 6);
            }
            if (heavy && full && spec.charge) {
              if (a.chargeToll) {          // held to the toll: the armor itself gives, 1% forever
                B.defBreak += 1;
                sfx.crack();
                G.dmgNums.push({ x: B.x, y: bossHeadY() - 6, v: 'SUNDERED', t: 0 });
                G.shake = Math.max(G.shake, 10);
                spawnParticles(B.x, B.y, 20, '#e8c15a', 280, 0.6);
                spawnParticles(B.x, B.y, 8, '#f6e7c0', 340, 0.4);
              }
              // the charged smash does not chip his poise, it ends it
              breakPoise();
              G.hitstop = Math.max(G.hitstop, 0.14); G.shake = Math.max(G.shake, 12);
              rumble(300, 0.8, 0.9);
              spawnParticles(B.x, B.y, 24, '#dceaff', 300, 0.6);
            }
          }
        }
        if (!a.charging && et > ce && !a['hit' + ci] && !a['whiff' + ci]) {
          a['whiff' + ci] = true;
          if (ci === cuts - 1 && !a.hitDone) sfx.whiff(heavy, C.id === 'pair');
        }
        // the whoosh lands with the arc, not with the button press
        if (!a.charging && et >= cs && !a['sl' + ci]) {
          a['sl' + ci] = true;
          sfx.swing(heavy, C.id === 'pair');
          const col = C.id === 'pair' ? '#e8ddc8' : '#dfe6f2';
          const arcHalf = spec.kind === 'thrust' ? 0.5 : half * (C.id === 'pair' ? 0.8 : 1.05);
          addSlash(P.x, P.y, a.face + (ci ? 0.5 : -0.2) * (cuts > 1 ? 1 : 0), reach, arcHalf, col, C.id === 'pair' ? 0.11 : 0.18);
          if (C.id === 'pair' && P.frenzy >= 5) {
            // flourishes that cut nothing — the madness spilling past the target
            addSlash(P.x, P.y, a.face + rand(-1.4, 1.4), reach * rand(0.5, 0.8), 0.4, 'rgba(216,101,78,0.7)', 0.09);
          }
        }
      }
      if (!a.charging && a.t >= a.dur + held) {
        P.act = null;
