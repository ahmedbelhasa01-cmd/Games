<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Ashen Gate</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060a;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;background:#0b0d12;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================================
   THE ASHEN GATE — a souls-like boss duel in one file.
   Boss: ALDRIC, WHO WAS GIVEN THE BLADE.
   ========================================================================= */

const W = 960, H = 540;
const ARENA = { x: 64, y: 64, w: W - 128, h: H - 128 };
const GATE = { x: W / 2, y: 26 };     // the threshold, beyond the top wall
const RING = { x: 336, y: 338 };      // the worn practice ring
const ACCENT = '#ff9e2c';             // ember — reserved for boss telegraphs & fire
const COOL = '#9fc7ff';               // Nomad's one cool accent
const canvas = document.getElementById('c');
const RS = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * RS; canvas.height = H * RS;
const ctx = canvas.getContext('2d');

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);
fitCanvas();

/* ---------- tiny math helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
function angDiff(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
function turnToward(cur, target, maxStep) { const d = angDiff(cur, target); return cur + clamp(d, -maxStep, maxStep); }
const rand = (a, b) => a + Math.random() * (b - a);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* =========================================================================
   AUDIO — all synthesized, created lazily, resumed on any user gesture.
   ========================================================================= */
const AudioSys = {
  ac: null, master: null, noiseBuf: null,
  ensure() {
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = 0.45;
        this.master.connect(this.ac.destination);
        const len = Math.floor(this.ac.sampleRate * 1.2);
        this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
      return this.ac;
    } catch (e) { return null; }
  },
  ready() { return this.ac && this.ac.state === 'running'; },
  duck(level, secs) {
    try {
      if (!this.ac || !this.master) return;
      const now = this.ac.currentTime;
      this.master.gain.cancelScheduledValues(now);
      this.master.gain.setValueAtTime(this.master.gain.value, now);
      this.master.gain.linearRampToValueAtTime(level, now + secs);
    } catch (e) {}
  }
};
['pointerdown', 'touchstart', 'keydown', 'mousedown'].forEach(ev =>
  window.addEventListener(ev, () => AudioSys.ensure(), { passive: true }));

function _noise(ac, dur, filterType, f0, f1, gain, t0) {
  const src = ac.createBufferSource(); src.buffer = AudioSys.noiseBuf; src.loop = true;
  const filt = ac.createBiquadFilter(); filt.type = filterType;
  filt.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) filt.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(AudioSys.master);
  src.start(t0); src.stop(t0 + dur + 0.05);
}
function _tone(ac, type, f0, f1, dur, gain, t0) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AudioSys.master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  _run(fn) { try { const ac = AudioSys.ensure(); if (!ac || ac.state !== 'running') return; fn(ac, ac.currentTime); } catch (e) {} },
  swing(heavy) { this._run((ac, t) => _noise(ac, heavy ? 0.22 : 0.15, 'bandpass', heavy ? 260 : 380, heavy ? 1500 : 1900, 0.5, t)); },
  bossSwing() { this._run((ac, t) => { _noise(ac, 0.28, 'bandpass', 180, 900, 0.65, t); _tone(ac, 'sawtooth', 110, 60, 0.22, 0.12, t); }); },
  hit() { this._run((ac, t) => { _tone(ac, 'sine', 160, 70, 0.12, 0.55, t); _noise(ac, 0.09, 'lowpass', 2400, 500, 0.4, t); }); },
  playerHit() { this._run((ac, t) => { _tone(ac, 'sine', 110, 45, 0.25, 0.8, t); _noise(ac, 0.2, 'lowpass', 1400, 250, 0.6, t); }); },
  roll() { this._run((ac, t) => _noise(ac, 0.2, 'lowpass', 600, 220, 0.3, t)); },
  gulp() { this._run((ac, t) => { _tone(ac, 'sine', 300, 170, 0.12, 0.3, t); _tone(ac, 'sine', 260, 140, 0.12, 0.3, t + 0.16); _tone(ac, 'sine', 230, 120, 0.14, 0.3, t + 0.32); }); },
  flaskEmpty() { this._run((ac, t) => _tone(ac, 'square', 220, 200, 0.07, 0.12, t)); },
  slamImpact() { this._run((ac, t) => { _tone(ac, 'sine', 80, 34, 0.4, 0.9, t); _noise(ac, 0.3, 'lowpass', 900, 120, 0.7, t); }); },
  stagger() { this._run((ac, t) => { _tone(ac, 'square', 300, 90, 0.35, 0.25, t); _noise(ac, 0.35, 'bandpass', 700, 250, 0.4, t); }); },
  roar() { this._run((ac, t) => {
    _tone(ac, 'sawtooth', 82, 44, 1.3, 0.45, t);
    _tone(ac, 'sawtooth', 61, 38, 1.3, 0.45, t + 0.03);
    _tone(ac, 'square', 41, 30, 1.3, 0.3, t);
    _noise(ac, 1.2, 'bandpass', 350, 130, 0.5, t);
  }); },
  bell() { this._run((ac, t) => {
    [98, 196, 294.3, 392.7].forEach((f, i) => _tone(ac, 'sine', f, f * 0.985, 2.8 - i * 0.4, 0.42 / (i + 1), t));
    _noise(ac, 0.06, 'highpass', 2000, 3000, 0.1, t);
  }); },
  chime() { this._run((ac, t) => {
    [659, 830, 988, 1318].forEach((f, i) => _tone(ac, 'sine', f, f, 1.0, 0.22, t + i * 0.14));
    _tone(ac, 'sine', 329, 329, 1.8, 0.15, t);
  }); },
  fog() { this._run((ac, t) => _noise(ac, 0.9, 'lowpass', 500, 150, 0.25, t)); },
  parry() { this._run((ac, t) => {
    _tone(ac, 'square', 1400, 950, 0.09, 0.28, t);
    _tone(ac, 'sine', 2300, 1750, 0.16, 0.22, t);
    _tone(ac, 'sine', 320, 150, 0.1, 0.3, t);
    _noise(ac, 0.08, 'highpass', 2600, 4200, 0.3, t);
  }); },
  block() { this._run((ac, t) => {
    _tone(ac, 'sine', 210, 90, 0.14, 0.45, t);
    _tone(ac, 'square', 360, 250, 0.05, 0.1, t);
    _noise(ac, 0.1, 'lowpass', 1300, 350, 0.3, t);
  }); },
  guardBreak() { this._run((ac, t) => {
    _tone(ac, 'sawtooth', 240, 65, 0.35, 0.4, t);
    _tone(ac, 'sine', 110, 40, 0.3, 0.5, t);
    _noise(ac, 0.3, 'bandpass', 900, 200, 0.5, t);
  }); },
  exposed() { this._run((ac, t) => {
    [660, 990, 1320].forEach((f, i) => _tone(ac, 'sine', f, f * 1.01, 0.8, 0.2, t + i * 0.11));
    _noise(ac, 0.5, 'highpass', 3000, 5000, 0.08, t);
  }); },
  scrapeOne() { this._run((ac, t) => {
    _noise(ac, 0.28, 'bandpass', 900 + Math.random() * 500, 500, 0.2, t);
    _tone(ac, 'sawtooth', 220 + Math.random() * 120, 140, 0.2, 0.05, t);
  }); },
  chargeFull() { this._run((ac, t) => { _tone(ac, 'sine', 660, 720, 0.14, 0.16, t); _tone(ac, 'sine', 990, 1020, 0.18, 0.1, t + 0.04); }); },
  read() { this._run((ac, t) => {          // a sharp intake — he has seen it
    _tone(ac, 'square', 1150, 1500, 0.07, 0.16, t);
    _noise(ac, 0.16, 'highpass', 2200, 3600, 0.22, t);
    _tone(ac, 'sawtooth', 150, 210, 0.14, 0.14, t);
  }); },
  stab() { this._run((ac, t) => {
    _tone(ac, 'sine', 190, 60, 0.2, 0.7, t);
    _noise(ac, 0.12, 'bandpass', 1800, 500, 0.5, t);
    _noise(ac, 0.3, 'lowpass', 700, 90, 0.55, t + 0.02);
  }); },
  maulSwing() { this._run((ac, t) => { _noise(ac, 0.32, 'bandpass', 140, 700, 0.7, t); _tone(ac, 'sawtooth', 90, 45, 0.28, 0.14, t); }); },
  shardSwing() { this._run((ac, t) => _noise(ac, 0.13, 'bandpass', 500, 2300, 0.5, t)); },
  maulImpact() { this._run((ac, t) => {
    _tone(ac, 'sine', 70, 28, 0.5, 1.0, t);
    _noise(ac, 0.35, 'lowpass', 800, 90, 0.8, t);
    _noise(ac, 0.08, 'highpass', 1500, 3000, 0.25, t);
  }); },
  fissure() { this._run((ac, t) => { _noise(ac, 0.5, 'bandpass', 300, 1400, 0.35, t); _tone(ac, 'sawtooth', 100, 55, 0.4, 0.12, t); }); },
  chargeWhoosh() { this._run((ac, t) => _noise(ac, 0.55, 'bandpass', 160, 620, 0.5, t)); },
  daze() { this._run((ac, t) => {
    _tone(ac, 'square', 320, 180, 0.3, 0.25, t);
    _tone(ac, 'sine', 180, 90, 0.45, 0.4, t);
    _noise(ac, 0.3, 'lowpass', 1000, 200, 0.5, t);
  }); },
  crack() { this._run((ac, t) => {
    // the haft breaking over his knee — layered snaps over a deep body
    _noise(ac, 0.05, 'highpass', 1800, 4200, 0.9, t);
    _tone(ac, 'square', 900, 220, 0.05, 0.5, t);
    _tone(ac, 'square', 700, 160, 0.06, 0.45, t + 0.03);
    _tone(ac, 'square', 500, 120, 0.08, 0.4, t + 0.07);
    _tone(ac, 'sawtooth', 130, 40, 0.5, 0.55, t + 0.02);
    _noise(ac, 0.45, 'lowpass', 900, 100, 0.7, t + 0.02);
  }); },
  mourn() { this._run((ac, t) => {
    // a slow minor swell where the swing should have been
    [[130.8, 0.3, 0], [155.6, 0.22, 0.09], [65.4, 0.26, 0.05]].forEach(([f, g, dl]) => {
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f, t + dl);
      o.frequency.linearRampToValueAtTime(f * 0.965, t + dl + 1.8);
      const gn = ac.createGain();
      gn.gain.setValueAtTime(0.0001, t + dl);
      gn.gain.linearRampToValueAtTime(g, t + dl + 0.5);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dl + 2.0);
      o.connect(gn); gn.connect(AudioSys.master);
      o.start(t + dl); o.stop(t + dl + 2.1);
    });
  }); }
};

/* =========================================================================
   RUMBLE — feature-checked everywhere.
   ========================================================================= */
function rumble(ms, strong, weak) {
  try {
    const gp = Input.pad;
    if (gp && gp.vibrationActuator && typeof gp.vibrationActuator.playEffect === 'function') {
      const p = gp.vibrationActuator.playEffect('dual-rumble',
        { startDelay: 0, duration: ms, strongMagnitude: clamp(strong, 0, 1), weakMagnitude: clamp(weak, 0, 1) });
      if (p && p.catch) p.catch(() => {});
    }
  } catch (e) {}
}

/* =========================================================================
   INPUT — controller primary, keyboard/mouse fallback, unified edges +
   a 150ms buffer for attacks/rolls/parries.
   ========================================================================= */
const BUFFER_MS = 150;
const Input = {
  device: 'kb',                 // 'kb' | 'pad'
  keys: {}, pad: null,
  prevPadB: [], prevRT: false,
  kbEdges: {},                  // one-frame edges from key/mouse events
  // unified per-frame edges:
  light: false, heavy: false, lock: false, flask: false, confirm: false, parry: false,
  moveX: 0, moveY: 0, moveMag: 0,
  sprint: false, blockHeld: false, heavyHeld: false, mouseRDown: false,
  dodgeWasDown: false, dodgeHoldT: 0, dodgeSprinted: false,
  buffer: null,                 // {act:'roll'|'light'|'heavy'|'parry', t: ms}

  setBuffer(act) { this.buffer = { act, t: performance.now() }; },
  peekBuffer() {
    if (this.buffer && performance.now() - this.buffer.t <= BUFFER_MS) return this.buffer.act;
    this.buffer = null; return null;
  },
  consumeBuffer() { const a = this.peekBuffer(); this.buffer = null; return a; },

  poll(rdt) {
    this.light = this.heavy = this.lock = this.flask = this.confirm = this.parry = false;

    /* ---- gamepad (polled; buttons are not event-driven) ---- */
    let gp = null;
    try {
      const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
      for (let i = 0; i < pads.length; i++) { if (pads[i] && pads[i].connected !== false) { gp = pads[i]; break; } }
    } catch (e) {}
    this.pad = gp;

    let padDodgeDown = false, padBlock = false;
    let sx = 0, sy = 0, smag = 0;
    if (gp) {
      const b = gp.buttons || [];
      const bd = i => !!(b[i] && (b[i].pressed || b[i].value > 0.5));
      const was = i => !!this.prevPadB[i];
      const edge = i => bd(i) && !was(i);

      // any pad activity -> controller prompts
      let anyAct = false;
      for (let i = 0; i < b.length; i++) if (bd(i)) { anyAct = true; break; }
      const rawAx = gp.axes || [];
      if (Math.abs(rawAx[0] || 0) > 0.25 || Math.abs(rawAx[1] || 0) > 0.25) anyAct = true;
      if (anyAct) { this.device = 'pad'; AudioSys.ensure(); }

      // left stick, radial deadzone 0.18, magnitude scales speed
      const ax = rawAx[0] || 0, ay = rawAx[1] || 0;
      const m = Math.sqrt(ax * ax + ay * ay);
      if (m > 0.18) {
        const scaled = Math.min(1, (m - 0.18) / (1 - 0.18));
        sx = (ax / m) * scaled; sy = (ay / m) * scaled; smag = scaled;
      }

      if (edge(5)) this.light = true;                        // RB
      const rt = bd(7);                                      // RT analog
      if (rt && !this.prevRT) this.heavy = true;
      this.prevRT = rt;
      if (edge(11)) this.lock = true;                        // R3
      if (edge(2)) this.flask = true;                        // X / Square
      if (edge(0) || edge(9)) this.confirm = true;           // A or Start
      if (edge(6)) this.parry = true;                        // L2 / LT (analog-safe)
      padBlock = bd(4);                                      // L1 / LB — hold to guard
      padDodgeDown = bd(1);                                  // B / Circle

      const nb = [];
      for (let i = 0; i < b.length; i++) nb[i] = bd(i);
      this.prevPadB = nb;
    } else {
      this.prevPadB = []; this.prevRT = false;
    }

    /* ---- keyboard/mouse ---- */
    let kx = 0, ky = 0;
    if (this.keys['KeyA'] || this.keys['ArrowLeft']) kx -= 1;
    if (this.keys['KeyD'] || this.keys['ArrowRight']) kx += 1;
    if (this.keys['KeyW'] || this.keys['ArrowUp']) ky -= 1;
    if (this.keys['KeyS'] || this.keys['ArrowDown']) ky += 1;
    if (kx || ky) { const m = Math.hypot(kx, ky); kx /= m; ky /= m; }

    if (this.kbEdges.light) this.light = true;
    if (this.kbEdges.heavy) this.heavy = true;
    if (this.kbEdges.lock) this.lock = true;
    if (this.kbEdges.flask) this.flask = true;
    if (this.kbEdges.confirm) this.confirm = true;
    if (this.kbEdges.parry) this.parry = true;
    const kbDodgeDown = !!this.keys['Space'];
    const kbBlock = !!(this.keys['ShiftLeft'] || this.keys['ShiftRight']);
    this.kbEdges = {};

    /* ---- merge movement (pad wins if it has input) ---- */
    if (smag > 0) { this.moveX = sx; this.moveY = sy; this.moveMag = smag; }
    else { this.moveX = kx; this.moveY = ky; this.moveMag = (kx || ky) ? 1 : 0; }

    /* ---- dodge/sprint: tap = roll, hold >250ms = sprint (identical paths) ---- */
    const down = padDodgeDown || kbDodgeDown;
    if (down && !this.dodgeWasDown) { this.dodgeHoldT = 0; this.dodgeSprinted = false; }
    if (down) {
      this.dodgeHoldT += rdt;
      if (this.dodgeHoldT > 0.25 && this.moveMag > 0.01) { this.sprint = true; this.dodgeSprinted = true; }
      if (this.moveMag <= 0.01) this.sprint = false;
    } else {
      if (this.dodgeWasDown && this.dodgeHoldT <= 0.25 && !this.dodgeSprinted) this.setBuffer('roll');
      this.sprint = false;
    }
    this.dodgeWasDown = down;
    this.blockHeld = padBlock || kbBlock;
    this.heavyHeld = this.prevRT || this.mouseRDown;   // for the charged heavy

    if (this.light) this.setBuffer('light');
    if (this.heavy) this.setBuffer('heavy');
    if (this.parry) this.setBuffer('parry');
  }
};

window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  Input.device = 'kb';
  if (e.repeat) { Input.keys[e.code] = true; return; }
  Input.keys[e.code] = true;
  if (e.code === 'KeyQ') Input.kbEdges.lock = true;
  if (e.code === 'KeyE') Input.kbEdges.flask = true;
  if (e.code === 'KeyF') Input.kbEdges.parry = true;
  if (e.code === 'Enter') Input.kbEdges.confirm = true;
});
window.addEventListener('keyup', e => { Input.keys[e.code] = false; });
canvas.addEventListener('mousedown', e => {
  Input.device = 'kb';
  if (e.button === 0) Input.kbEdges.light = true;
  if (e.button === 2) { Input.kbEdges.heavy = true; Input.mouseRDown = true; }
  e.preventDefault();
});
window.addEventListener('mouseup', e => { if (e.button === 2) Input.mouseRDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('gamepadconnected', () => { Input.device = 'pad'; AudioSys.ensure(); });

/* =========================================================================
   PRE-RENDERED ART — glow sprites, fog sprite, and the arena's still-life
   detail are baked ONCE at load, then blitted every frame.
   ========================================================================= */
function makeGlow(r, g, b) {
  const s = document.createElement('canvas');
  s.width = s.height = 64;
  const c = s.getContext('2d');
  const grad = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, `rgba(${r},${g},${b},0.85)`);
  grad.addColorStop(0.45, `rgba(${r},${g},${b},0.3)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = grad;
  c.fillRect(0, 0, 64, 64);
  return s;
}
const GLOW_EMBER = makeGlow(255, 158, 44);
const GLOW_BLUE = makeGlow(159, 199, 255);
const GLOW_GOLD = makeGlow(232, 193, 90);

const FOG_SPRITE = (() => {
  const s = document.createElement('canvas');
  s.width = s.height = 64;
  const c = s.getContext('2d');
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(150,165,205,1)');
  g.addColorStop(1, 'rgba(150,165,205,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, 64, 64);
  return s;
})();

const FOG_BAND = (() => {
  const s = document.createElement('canvas');
  s.width = 320; s.height = 72;
  const c = s.getContext('2d');
  const rr2 = mulberry32(77);
  for (let i = 0; i < 22; i++) {
    const x = rr2() * 320, y = 18 + rr2() * 36, r = 24 + rr2() * 34;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(120,128,150,0.10)');
    g.addColorStop(1, 'rgba(120,128,150,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  }
  return s;
})();

/* shared sword profile — Nomad's blade and the five fallen ones are the SAME sword */
function drawSwordProfile(c, len, opts) {
  opts = opts || {};
  const white = opts.white;
  c.fillStyle = white ? '#ffffff' : (opts.flat ? opts.flat : '#4a3b2c');
  c.fillRect(-8, -1.8, 8, 3.6);
  c.beginPath(); c.arc(-9, 0, 2.4, 0, Math.PI * 2); c.fill();
  c.fillStyle = white ? '#ffffff' : (opts.flat ? opts.flat : '#6e6046');
  c.fillRect(-1.5, -7, 3, 14);
  if (white) c.fillStyle = '#ffffff';
  else if (opts.flat) c.fillStyle = opts.flat;
  else {
    const g = c.createLinearGradient(0, -3.5, 0, 3.5);
    g.addColorStop(0, '#f4f7ff'); g.addColorStop(0.5, '#c3cddf'); g.addColorStop(1, '#8f9ab0');
    c.fillStyle = g;
  }
  c.beginPath();
  c.moveTo(1.5, -3.2); c.lineTo(len - 8, -2.4); c.lineTo(len, 0); c.lineTo(len - 8, 2.4); c.lineTo(1.5, 3.2);
  c.closePath(); c.fill();
  if (!white && !opts.flat) {
    c.strokeStyle = 'rgba(255,255,255,0.55)';
    c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(3, 0); c.lineTo(len - 7, 0); c.stroke();
  }
}

/* procedural dead-script glyph strokes — angular marks, never letters */
function makeGlyph(rr, size, disorder) {
  const strokes = [];
  const n = 2 + Math.floor(rr() * 3);
  const j = () => (rr() - 0.5) * size * disorder * 1.6;
  strokes.push([j(), -size / 2 + j(), j(), size / 2 + j()]);
  for (let i = 1; i < n; i++) {
    const y0 = -size / 2 + rr() * size;
    const dir = rr() < 0.5 ? 1 : -1;
    strokes.push([j(), y0 + j(), dir * size * (0.4 + rr() * 0.5) + j(), y0 + j()]);
  }
  return strokes;
}
function strokeGlyph(c, glyph, x, y, alpha, col, lw) {
  c.strokeStyle = col || `rgba(178,172,160,${alpha})`;
  c.lineWidth = lw || 1;
  for (const s of glyph) { c.beginPath(); c.moveTo(x + s[0], y + s[1]); c.lineTo(x + s[2], y + s[3]); c.stroke(); }
}

    { d: 0.10, k: 'a', w: [1.3, -1.0], L: [62, 96], hit: { s: 'arc', r0: 8, r1: 100, half: 1.0 }, dmg: 22, shake: 4 },
    { d: 0.12, k: 'g', track: 2.0, w: [-1.0, -1.3], L: [96, 62] },
    { d: 0.10, k: 'a', w: [-1.3, 1.1], L: [62, 98], hit: { s: 'arc', r0: 8, r1: 100, half: 1.0 }, dmg: 22, shake: 4 },
    { d: 0.50, k: 'r', w: [1.1, 0.35], L: [98, 58] }
  ] },
  rising: { phases: [
    { d: 0.55, k: 'w', track: 2.6, w: [0.35, 1.6], L: [58, 38] },     // drops low — unmistakable
    { d: 0.14, k: 'a', w: [1.6, -1.3], L: [38, 114], hit: { s: 'arc', r0: 6, r1: 118, half: 0.55 }, dmg: 38, shake: 8 },
    { d: 0.80, k: 'r', w: [-1.3, 0.35], L: [114, 58] }
  ] },
  // never in the random pool — only thrown when he reads a charging heavy
  punish: { phases: [
    { d: 0.20, k: 'w', track: 4.2, w: [-0.4, 0.02], L: [62, 46] },
    { d: 0.13, k: 'a', move: { sp: 330 }, w: [0.02, 0], L: [46, 110], hit: { s: 'arc', r0: 0, r1: 114, half: 0.5 }, dmg: 30, shake: 7 },
    { d: 0.60, k: 'r', w: [0, 0.35], L: [110, 58] }
  ] }
};

/* =========================================================================
   RESET / FLOW
   ========================================================================= */
function resetFight() {
  P.x = ARENA.x + 130; P.y = ARENA.y + ARENA.h / 2;
  P.hp = P.hpMax; P.hpGhost = P.hpMax; P.st = P.stMax; P.stDelay = 0; P.stFlash = 0;
  P.walkT = 0; P.trail.length = 0; P.speedNow = 0; P.blocking = false; P.parryStreak = 0;
  P.scarf = []; for (let i = 0; i < 6; i++) P.scarf.push({ x: P.x, y: P.y });
  P.flasks = P.flaskMax; P.face = 0; P.moveDirX = 1; P.moveDirY = 0;
  P.locked = false; P.act = null; P.hurtInv = 0; P.kbX = P.kbY = 0; P.flash = 0; P.dead = false;

  B.x = ARENA.x + ARENA.w - 170; B.y = ARENA.y + ARENA.h / 2;
  B.hp = B.hpMax; B.hpGhost = B.hpMax; B.face = Math.PI;
  B.phase2 = false; B.state = 'idle'; B.stateT = 0; B.cd = 1.1;
  B.atk = null; B.atkSet = 1; B.phaseIdx = 0; B.phaseT = 0; B.hitDone = false;
  B.poise = 0; B.staggerT = 0; B.exposedT = 0; B.wOff = 0.5; B.wLen = 86; B.tele = 0; B.flash = 0; B.dieT = 0;
  B.broken = false; B.breakStep = 0; B.dazeT = 0; B.chainCount = 0; B.readCd = 0;
  B.hesitated = false; B.mourned = false; B.coreDim = 0; B.guarding = false;

  G.particles.length = 0; G.slashes.length = 0; G.dmgNums.length = 0;
  G.fissures.length = 0; G.debris = null; G.barLifted = false; G.cinematic = false; G.lastAggro = -10;
  G.carve = null; G.victoryChimed = false;
  G.hitstop = 0; G.shake = 0;
  AudioSys.duck(0.45, 0.2);
}
function goto(screen) { G.screen = screen; G.screenT = 0; }

/* =========================================================================
   COMBAT HELPERS
   ========================================================================= */
function spawnParticles(x, y, n, col, sp, life) {
  for (let i = 0; i < n; i++) {
    if (G.particles.length >= PART_CAP) G.particles.shift();
    const a = rand(0, Math.PI * 2), v = rand(sp * 0.3, sp);
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(life * 0.5, life), maxLife: life, col, size: rand(1.5, 4) });
  }
}
function spawnDrift(x, y, vx, vy, col, life, size) {
  if (G.particles.length >= PART_CAP) G.particles.shift();
  G.particles.push({ x, y, vx, vy, life, maxLife: life, col, size });
}
function addSlash(x, y, ang, r, half, col, dur) {
  G.slashes.push({ x, y, ang, r, half, col, t: 0, dur });
}

function playerInvulnerable() {
  if (G.cinematic) return true;
  if (P.hurtInv > 0) return true;
  if (P.act && P.act.type === 'roll' && P.act.t < P.act.dur * 0.6) return true;
  return false;
}

/* ---------- ember fissures: race out along the ground from a slam ---------- */
function spawnFissures(ix, iy) {
  const base = Math.atan2(P.y - iy, P.x - ix);   // aimed where the player stood at impact
  const group = { hit: false };
  for (const off of [-0.55, -0.18, 0.18, 0.55]) {
    const jit = [];
    for (let i = 0; i < 12; i++) jit.push((Math.random() - 0.5) * 15);
    G.fissures.push({ x: ix, y: iy, ang: base + off, len: 0, maxLen: rand(220, 280), speed: 430, t: 0, jit, group });
  }
  sfx.fissure();
}
function updateFissures(dt) {
  for (let i = G.fissures.length - 1; i >= 0; i--) {
    const f = G.fissures[i];
    f.t += dt;
    if (f.len < f.maxLen) {
      f.len = Math.min(f.maxLen, f.len + f.speed * dt);
      if (!f.group.hit && !P.dead) {
        const dx = Math.cos(f.ang), dy = Math.sin(f.ang);
        const px = P.x - f.x, py = P.y - f.y;
        const along = px * dx + py * dy;
        if (along > 8 && along < f.len) {
          const off = Math.abs(px * -dy + py * dx);
          if (off < 15 + P.r * 0.6) {
            if (damagePlayer(22, f.x + dx * along, f.y + dy * along, false)) f.group.hit = true;
            else if (playerInvulnerable()) f.group.hit = true;   // rolled perpendicular — it's past you
          }
        }
      }
      if (Math.random() < dt * 20) {
        spawnDrift(f.x + Math.cos(f.ang) * f.len, f.y + Math.sin(f.ang) * f.len,
          rand(-14, 14), rand(-55, -20), ACCENT, rand(0.3, 0.7), rand(1.5, 3));
      }
    }
    if (f.t > 1.5) G.fissures.splice(i, 1);
  }
}

/* ---------- the discarded maul head, lying where it fell ---------- */
function updateDebris(dt) {
  const d = G.debris;
  if (!d || d.settleT <= 0) return;
  d.settleT -= dt;
  d.x += d.vx * dt; d.y += d.vy * dt;
  d.rot += d.vr * dt;
  d.vx -= d.vx * 3.2 * dt; d.vy -= d.vy * 3.2 * dt; d.vr -= d.vr * 3 * dt;
  d.x = clamp(d.x, ARENA.x + 20, ARENA.x + ARENA.w - 20);
  d.y = clamp(d.y, ARENA.y + 20, ARENA.y + ARENA.h - 20);
  if (d.settleT <= 0) { d.vx = d.vy = d.vr = 0; }
}

// A successful parry: the strike is turned, Aldric reels, clean streaks expose him.
function onParrySuccess() {
  if (P.act) P.act.success = true;
  P.act = null;                              // instant recovery — the window is the reward
  P.hurtInv = Math.max(P.hurtInv, 0.3);
  P.parryStreak++;
  const mx = (P.x + B.x) / 2, my = (P.y + B.y) / 2;
  spawnParticles(mx, my, 22, '#ffe9a8', 260, 0.5);
  spawnParticles(mx, my, 10, '#f2f6ff', 330, 0.3);
  addSlash(mx, my, Math.atan2(P.y - B.y, P.x - B.x), 44, Math.PI, '#ffe9a8', 0.12);
  G.hitstop = Math.max(G.hitstop, 0.09);
  G.shake = Math.max(G.shake, 7);
  sfx.parry();
  rumble(140, 0.5, 0.9);
  if (B.state !== 'dying' && B.state !== 'stagger' && B.state !== 'carve') {
    B.state = 'recoil'; B.stateT = 0; B.atk = null; B.tele = 0;
    B.poise += 1;
    if (B.poise >= 6) {
      B.state = 'stagger'; B.stateT = 0; B.staggerT = 1.5; B.poise = 0;
      sfx.stagger();
      G.shake = Math.max(G.shake, 8);
      spawnParticles(B.x, B.y, 24, ACCENT, 220, 0.6);
    }
  }
  if (P.parryStreak >= 5) {                  // five clean turns of the blade — he is EXPOSED
    P.parryStreak = 0;
    B.exposedT = 10;
    sfx.exposed();
    spawnParticles(B.x, B.y, 30, '#e8c15a', 250, 0.8);
    G.shake = Math.max(G.shake, 6);
    rumble(320, 0.4, 0.85);
  }
}

function damagePlayer(dmg, srcX, srcY, parryable, kbMult) {
  if (P.dead) return false;
  // parry — active window near the start of the swing turns any parryable strike
  if (parryable && P.act && P.act.type === 'parry' && P.act.t >= 0.02 && P.act.t <= 0.2) {
    onParrySuccess();
    return true;
  }
  if (playerInvulnerable()) return false;
  // block — guard held, attack from the front
  if (P.blocking && P.st > 0) {
    const toSrc = Math.atan2(srcY - P.y, srcX - P.x);
    if (Math.abs(angDiff(P.face, toSrc)) < 1.75) {
      // the shard's quick cuts are hard to catch — they eat far more stamina through a guard
      const cost = (14 + dmg * 0.45) * (B.broken ? 1.5 : 1);
      if (P.st >= cost) {                    // the guard holds — chip damage + stamina
        P.st -= cost; P.stDelay = 0.7;
        P.hp -= Math.max(1, Math.round(dmg * 0.22));
        P.hurtInv = Math.max(P.hurtInv, 0.2);
        const ba = Math.atan2(P.y - srcY, P.x - srcX);
        P.kbX = Math.cos(ba) * 130; P.kbY = Math.sin(ba) * 130;
        spawnParticles(P.x + Math.cos(toSrc) * 14, P.y + Math.sin(toSrc) * 14, 8, '#cfd6e4', 180, 0.35);
        G.hitstop = Math.max(G.hitstop, 0.035);
        G.shake = Math.max(G.shake, 4);
        sfx.block();
        rumble(90, 0.3, 0.5);
        if (P.hp <= 0) { P.hp = 0; P.dead = true; P.deathX = P.x; P.deathY = P.y; killPlayer(); }
        return true;
      }
      // not enough stamina behind the shield-arm — GUARD BREAK
      P.st = -25; P.stDelay = 0.9;
      dmg = Math.round(dmg * 0.5);
      P.hp -= dmg;
      P.flash = 0.12;
      P.hurtInv = 0.45;
      P.parryStreak = 0;
      const gba = Math.atan2(P.y - srcY, P.x - srcX);
      P.kbX = Math.cos(gba) * 330; P.kbY = Math.sin(gba) * 330;
      P.act = { type: 'hurt', t: 0, dur: 0.7 };
      G.hitstop = Math.max(G.hitstop, 0.08);
      G.shake = Math.max(G.shake, 11);
      spawnParticles(P.x, P.y, 16, '#c33b3b', 200, 0.5);
      sfx.guardBreak();
      rumble(320, 1.0, 0.6);
      if (P.hp <= 0) { P.hp = 0; P.dead = true; P.deathX = P.x; P.deathY = P.y; killPlayer(); }
      return true;
    }
  }
  P.hp -= dmg;
  P.flash = 0.12;
  P.hurtInv = 0.45;
  P.parryStreak = 0;                          // a clean hit ends the streak
  const a = Math.atan2(P.y - srcY, P.x - srcX);
  const kb = 260 * (kbMult || 1);
  P.kbX = Math.cos(a) * kb; P.kbY = Math.sin(a) * kb;
  const wasFlask = P.act && P.act.type === 'flask';
  P.act = { type: 'hurt', t: 0, dur: 0.35 };
  if (wasFlask) sfx.flaskEmpty(); // the sip is wasted
  G.hitstop = Math.max(G.hitstop, 0.07);
  G.shake = Math.max(G.shake, 9 + dmg * 0.15);
  spawnParticles(P.x, P.y, 14, '#c33b3b', 190, 0.5);
  sfx.playerHit();
  rumble(220, 0.95, 0.5);
  if (P.hp <= 0) { P.hp = 0; P.dead = true; P.deathX = P.x; P.deathY = P.y; killPlayer(); }
  return true;
}

function killPlayer() {
  P.act = null;
  sfx.bell();
  rumble(500, 0.8, 0.8);
  goto('dead');
}

function damageBoss(dmg) {
  if (B.state === 'dying' || B.state === 'carve' || G.screen !== 'fight') return;
  if (B.exposedT > 0) dmg *= 2;               // five parries left him open
  B.hp -= dmg;
  B.flash = 0.1;
  B.poise += 1;
  G.hitstop = Math.max(G.hitstop, 0.07);
  G.shake = Math.max(G.shake, 4);
  const a = Math.atan2(P.y - B.y, P.x - B.x);
  spawnParticles(B.x + Math.cos(a) * B.r, B.y + Math.sin(a) * B.r, 10, '#e8e2d0', 170, 0.4);
  G.dmgNums.push({ x: B.x + Math.cos(a) * (B.r + 10), y: B.y + Math.sin(a) * (B.r + 10) - 6, v: dmg, t: 0 });
  sfx.hit();
  rumble(70, 0.15, 0.5);

  if (B.poise >= 6 && B.state !== 'stagger' && B.state !== 'break' && B.state !== 'daze' && B.state !== 'hesitate') {
    B.state = 'stagger'; B.stateT = 0; B.staggerT = 1.5; B.poise = 0;
    B.atk = null; B.tele = 0;
    sfx.stagger();
    G.shake = Math.max(G.shake, 8);
    spawnParticles(B.x, B.y, 24, ACCENT, 220, 0.6);
  }

  // THE BREAK — at half health he makes a decision
  if (!B.phase2 && B.state !== 'break' && B.hp <= B.hpMax * 0.5 && B.hp > 0) {
    B.state = 'break'; B.stateT = 0; B.breakStep = 0;
    B.atk = null; B.tele = 0;
    G.cinematic = true;
    G.fissures.length = 0;
    AudioSys.duck(0.05, 0.5);   // the room falls near-silent
    return;
  }

  if (B.hp <= 0) {
    B.hp = 0; B.atk = null; B.tele = 0;
    startCarve();
  }
}

function spendStamina(cost) { P.st = Math.max(-25, P.st - cost); P.stDelay = 0.7; }

/* ---------- the carving (the ending) ---------- */
function startCarve() {
  P.locked = false;
  B.state = 'carve'; B.stateT = 0;
  const rr = mulberry32((Math.random() * 1e9) | 0);
  const glyphs = [];
  for (let i = 0; i < 9; i++) glyphs.push(makeGlyph(rr, 13, 0.35));
  const strokes = [];
  glyphs.forEach((g2, gi) => { g2.forEach(s => strokes.push({ g: gi, s })); });
  G.carve = { phase: 'walk', t: 0, x: RING.x, y: RING.y - 30, strokes, progress: 0, scrapeT: 0 };
}

/* =========================================================================
   PLAYER UPDATE
   ========================================================================= */
function updatePlayer(dt) {
  if (P.dead) return;
  P.hurtInv = Math.max(0, P.hurtInv - dt);
  P.flash = Math.max(0, P.flash - dt);
  P.stFlash = Math.max(0, P.stFlash - dt * 2.2);
  P.hpGhost = Math.max(P.hp, P.hpGhost - P.hpMax * 0.3 * dt);

  // scarf trails the shoulder — his one cool-blue mark
  {
    let ax = P.x + Math.cos(P.face + 2.4) * 10, ay = P.y + Math.sin(P.face + 2.4) * 10;
    for (const s2 of P.scarf) {
      s2.x += (ax - s2.x) * Math.min(1, 13 * dt);
      s2.y += (ay - s2.y) * Math.min(1, 13 * dt);
      ax = s2.x; ay = s2.y;
    }
  }

  if (G.cinematic) return;    // the break holds him still and untouchable

  // knockback decay
  P.x += P.kbX * dt; P.y += P.kbY * dt;
  P.kbX -= P.kbX * 10 * dt; P.kbY -= P.kbY * 10 * dt;

  const mvX = Input.moveX, mvY = Input.moveY, mag = Input.moveMag;
  if (mag > 0.01) { P.moveDirX = mvX / (Math.hypot(mvX, mvY) || 1); P.moveDirY = mvY / (Math.hypot(mvX, mvY) || 1); }

  // lock-on toggle
  if (Input.lock && G.screen === 'fight') {
    if (B.state !== 'dying' && B.state !== 'carve') P.locked = !P.locked;
  }
  if (B.state === 'dying' || B.state === 'carve') P.locked = false;

  // facing
  if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
  else if (mag > 0.01 && (!P.act || P.act.type === 'flask')) P.face = Math.atan2(mvY, mvX);

  // guard is a held stance, only while otherwise free
  P.blocking = Input.blockHeld && !P.act && G.screen === 'fight';

  const busy = P.act && P.act.type !== 'flask';
  const sprinting = Input.sprint && !busy && !P.blocking && mag > 0.01 && P.st > 0;

  /* ---- start buffered actions ---- */
  // the tail of a roll can flow straight into a lunging cut
  const rollTail = P.act && P.act.type === 'roll' && P.act.t > P.act.dur * 0.55;
  if (rollTail && G.screen === 'fight' && Input.peekBuffer() === 'light' && P.st > 0) {
    Input.consumeBuffer();
    spendStamina(15);
    if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
    else P.face = Math.atan2(P.act.dirY, P.act.dirX);
    P.act = { type: 'lunge', t: 0, dur: 0.42, hitDone: false, face: P.face };
    G.lastAggro = G.time;
    sfx.swing(false);
  }

  const canAct = !P.act || (P.act.type === 'flask'); // roll may cancel flask (wastes rest of the sip)
  if (canAct && G.screen === 'fight') {
    const want = Input.peekBuffer();
    // RIPOSTE — he's reeling off a parry, and you're close, facing him
    if (want === 'light' && !P.act && P.st > 0 && B.state === 'recoil' &&
        dist(P.x, P.y, B.x, B.y) < B.r + 64 &&
        Math.abs(angDiff(P.face, Math.atan2(B.y - P.y, B.x - P.x))) < 1.0) {
      Input.consumeBuffer();
      spendStamina(20);
      P.face = Math.atan2(B.y - P.y, B.x - P.x);
      P.act = { type: 'riposte', t: 0, dur: 0.66, hitDone: false, face: P.face };
      G.lastAggro = G.time;
      sfx.swing(true);
    } else if (want === 'light' && !P.act && P.st > 0 && sprinting) {
      // a sprint flows into the same lunging cut
      Input.consumeBuffer();
      spendStamina(15);
      if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
      else P.face = Math.atan2(P.moveDirY, P.moveDirX);
      P.act = { type: 'lunge', t: 0, dur: 0.42, hitDone: false, face: P.face };
      G.lastAggro = G.time;
      sfx.swing(false);
    } else if (want === 'roll' && P.st > 0) {
      Input.consumeBuffer();
      spendStamina(25);
      let dx = P.moveDirX, dy = P.moveDirY;
      if (mag <= 0.01) {
        if (P.locked) { const a = Math.atan2(P.y - B.y, P.x - B.x); dx = Math.cos(a); dy = Math.sin(a); }
        else { dx = Math.cos(P.face); dy = Math.sin(P.face); }
      } else { dx = mvX / (Math.hypot(mvX, mvY) || 1); dy = mvY / (Math.hypot(mvX, mvY) || 1); }
      P.act = { type: 'roll', t: 0, dur: 0.45, dirX: dx, dirY: dy };
      sfx.roll();
    } else if ((want === 'light' || want === 'heavy') && (!P.act) && P.st > 0) {
      Input.consumeBuffer();
      const heavy = want === 'heavy';
      spendStamina(heavy ? 35 : 20);
      if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
      P.swingAlt = !P.swingAlt;              // alternate the cut's direction
      P.act = { type: want, t: 0, dur: heavy ? 0.8 : 0.45, hitDone: false, face: P.face,
                alt: P.swingAlt ? -1 : 1, charging: heavy, chargeT: 0, chargeToll: false };
      G.lastAggro = G.time;                  // swinging reads as aggression
      sfx.swing(heavy);
    } else if (want === 'parry' && !P.act && P.st > 0) {
      Input.consumeBuffer();
      spendStamina(10);
      if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
      P.act = { type: 'parry', t: 0, dur: 0.45, success: false };
      sfx.swing(false);
    } else if ((want === 'light' || want === 'heavy' || want === 'roll' || want === 'parry') && P.st <= 0) {
      // not enough stamina — drop it and flash the stamina bar
      Input.consumeBuffer();
      P.stFlash = 0.4;
    }
  }
  // flask (not buffered; explicit press)
  if (Input.flask && !P.act && G.screen === 'fight') {
    if (P.flasks > 0) {
      P.flasks -= 1;
      P.act = { type: 'flask', t: 0, dur: 1.0 };
      sfx.gulp();
    } else sfx.flaskEmpty();
  }

  /* ---- run current action ---- */
  let speedMul = 1;
  if (P.act) {
    P.act.t += dt;
    const a = P.act;
    if (a.type === 'roll') {
      const k = a.t / a.dur;
      const sp = 470 * (1 - k * 0.75);
      P.x += a.dirX * sp * dt; P.y += a.dirY * sp * dt;
      P.trail.push({ x: P.x, y: P.y, rot: Math.atan2(a.dirY, a.dirX), a: 0.9 });
      if (a.dirX * (B.x - P.x) + a.dirY * (B.y - P.y) > 0) G.lastAggro = G.time;   // rolling in counts
      speedMul = 0;
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'light' || a.type === 'heavy') {
      speedMul = 0;
      const heavy = a.type === 'heavy';
      const wStart = heavy ? 0.34 : 0.14, wEnd = heavy ? 0.5 : 0.27;
      // CHARGED HEAVY: keep the trigger held and he holds the wind-up,
      // the blade gathering light — release (or 0.8s) lets it fall harder.
      if (heavy && a.charging) {
        if (a.t >= 0.30) {
          a.t = 0.30;                         // held at the top of the wind-up
          if (!Input.heavyHeld) {             // released: a tap is exactly the old heavy
            a.charging = false;
            if (a.chargeT > 0.1) sfx.swing(true);
          } else {
            a.chargeT = Math.min(0.8, a.chargeT + dt);
            if (a.chargeT >= 0.8) {
              if (!a.chargeToll) { a.chargeToll = true; sfx.chargeFull(); }
              a.charging = false;
              sfx.swing(true);
            }
          }
        }
      }
      const power = heavy ? (1 + (a.chargeT || 0) * 0.6) : 1;   // 58 -> up to ~86
      if (heavy && !a.charging && a.t > 0.15 && a.t < 0.45) {
        const step = 150 * (1 + (a.chargeT || 0) * 0.5);
        P.x += Math.cos(a.face) * step * dt; P.y += Math.sin(a.face) * step * dt;
      }
      if (!a.hitDone && !a.charging && a.t >= wStart && a.t <= wEnd) {
        const r1 = heavy ? 94 : 80, half = heavy ? 1.35 : 1.2;
        const d = dist(P.x, P.y, B.x, B.y);
        if (d < r1 + B.r && Math.abs(angDiff(a.face, Math.atan2(B.y - P.y, B.x - P.x))) < half + Math.asin(clamp(B.r / Math.max(d, B.r), 0, 1))) {
          a.hitDone = true;
          damageBoss(Math.round((heavy ? 58 : 30) * power));
          if (heavy && a.chargeT > 0.4) { G.hitstop = Math.max(G.hitstop, 0.1); G.shake = Math.max(G.shake, 8); }
        }
      }
      if (!a.charging && a.t >= wStart && !a.slashed) { a.slashed = true; addSlash(P.x, P.y, a.face, heavy ? 94 : 80, heavy ? 1.3 : 1.1, '#dfe6f2', 0.16); }
      if (!a.charging && a.t >= a.dur) P.act = null;
    } else if (a.type === 'lunge') {
      // out of a roll or sprint: a fast forward-lunging cut
      speedMul = 0;
      const k = a.t / a.dur;
      if (a.t < 0.18) { P.x += Math.cos(a.face) * 300 * (1 - k) * dt; P.y += Math.sin(a.face) * 300 * (1 - k) * dt; }
      if (!a.hitDone && a.t >= 0.08 && a.t <= 0.22) {
        const d = dist(P.x, P.y, B.x, B.y);
        if (d < 88 + B.r && Math.abs(angDiff(a.face, Math.atan2(B.y - P.y, B.x - P.x))) < 0.9 + Math.asin(clamp(B.r / Math.max(d, B.r), 0, 1))) {
          a.hitDone = true;
          damageBoss(26);
        }
      }
      if (a.t >= 0.08 && !a.slashed) { a.slashed = true; addSlash(P.x, P.y, a.face, 88, 0.8, '#dfe6f2', 0.14); }
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'riposte') {
      // the parry's true payoff: a step-in critical stab
      speedMul = 0;
      if (a.t < 0.12) { P.x += Math.cos(a.face) * 260 * dt; P.y += Math.sin(a.face) * 260 * dt; }
      if (!a.hitDone && a.t >= 0.16) {
        a.hitDone = true;
        damageBoss(70);
        sfx.stab();
        G.hitstop = Math.max(G.hitstop, 0.13);
        G.shake = Math.max(G.shake, 10);
        rumble(220, 0.7, 0.9);
        const hx = B.x - Math.cos(a.face) * B.r * 0.5, hy = B.y - Math.sin(a.face) * B.r * 0.5;
        spawnParticles(hx, hy, 26, '#ffe9a8', 280, 0.6);
        spawnParticles(hx, hy, 10, '#f2f6ff', 340, 0.35);
        // driven back off the blade
        if (B.state === 'recoil') {
          B.stateT = Math.min(B.stateT, 0.15);
          B.x += Math.cos(a.face) * 20; B.y += Math.sin(a.face) * 20;
          B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
          B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
        }
      }
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'parry') {
      speedMul = 0;
      if (a.t >= a.dur) {
        if (!a.success) P.parryStreak = 0;   // a whiffed parry breaks the streak
        P.act = null;
      }
    } else if (a.type === 'flask') {
      speedMul = 0.42;
      P.hp = Math.min(P.hpMax, P.hp + 45 * dt / 1.0);
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'hurt') {
      speedMul = 0;
      if (a.t >= a.dur) P.act = null;
    }
  }

  /* ---- movement ---- */
  P.speedNow = 0;
  if (speedMul > 0 || !P.act) {
    const base = sprinting ? 265 : (P.blocking ? 96 : 175);
    const sp = base * mag * (P.act ? speedMul : 1);
    P.x += mvX * sp * dt; P.y += mvY * sp * dt;
    P.walkT += sp * dt * 0.05;
    P.speedNow = sp;
    // closing distance reads as aggression
    if (mag > 0.01) {
      const ux = B.x - P.x, uy = B.y - P.y, ul = Math.hypot(ux, uy) || 1;
      if ((mvX * ux + mvY * uy) / ul * sp > 70) G.lastAggro = G.time;
    }
  }

  /* ---- stamina regen: delayed, never while sprinting or mid-action ---- */
  P.stDelay = Math.max(0, P.stDelay - dt);
  if (P.stDelay <= 0 && !sprinting && !P.act) P.st = Math.min(P.stMax, P.st + 25 * (P.blocking ? 0.4 : 1) * dt);

  // clamp to arena
  P.x = clamp(P.x, ARENA.x + P.r, ARENA.x + ARENA.w - P.r);
  P.y = clamp(P.y, ARENA.y + P.r, ARENA.y + ARENA.h - P.r);

  // body separation vs boss
  if (B.state !== 'dying' && B.state !== 'carve') {
    const d = dist(P.x, P.y, B.x, B.y), minD = P.r + B.r - 4;
    if (d < minD && d > 0.001) {
      const a = Math.atan2(P.y - B.y, P.x - B.x);
      P.x = B.x + Math.cos(a) * minD; P.y = B.y + Math.sin(a) * minD;
      P.x = clamp(P.x, ARENA.x + P.r, ARENA.x + ARENA.w - P.r);
      P.y = clamp(P.y, ARENA.y + P.r, ARENA.y + ARENA.h - P.r);
    }
  }
}

/* =========================================================================
   BOSS UPDATE
   ========================================================================= */
function currentSet() { return B.phase2 ? ATK2 : ATK1; }
function bossStartAttack(name) {
  const set = currentSet();
  B.atk = name; B.atkSet = B.phase2 ? 2 : 1;
  B.phaseIdx = 0; B.phaseT = 0; B.hitDone = false;
  B.phaseStarted = false; B.impacted = false;
  B.state = 'attack'; B.stateT = 0;
  B.phaseDur = set[name].phases[0].d;   // no blanket multipliers — each moveset owns its pacing
}
function pickWeighted(pool) {
  let tot = 0; for (const p of pool) tot += p[1];
  let r = Math.random() * tot;
  for (const p of pool) { r -= p[1]; if (r <= 0) return p[0]; }
  return pool[0][0];
}
function chooseAttack1(d) {
  if (d > 280 && Math.random() < 0.75) return 'charge';
  return pickWeighted([
    ['slam', 1.0], ['buried', 0.7], ['spin', 0.9],
    ['sweep', d < 150 ? 1.2 : 0.35],
    ['charge', d > 200 ? 0.5 : 0.05]
  ]);
}
function chooseAttack2(d) {
  // out of his reach = you're backpedaling, and the step-through hunts backpedalers
  if (d > 170 && Math.random() < 0.55) return 'step';
  return pickWeighted([
    ['thrust', 1.0],
    ['step', d > 150 ? 1.6 : (d > 110 ? 1.0 : 0.4)],
    ['feint', 0.8],                      // the hard read stays rare — roughly 1 in 5
    ['flurry', 0.8],
    ['rising', 0.6]
  ]);
}

function updateBoss(dt) {
  B.flash = Math.max(0, B.flash - dt);
  B.hpGhost = Math.max(B.hp, B.hpGhost - B.hpMax * 0.35 * dt);
  B.poise = Math.max(0, B.poise - 0.85 * dt);
  B.exposedT = Math.max(0, B.exposedT - dt);
  B.readCd = Math.max(0, B.readCd - dt);
  B.stateT += dt;

  // phase-2 embers drift off him
  if (B.phase2 && B.state !== 'dying' && B.state !== 'carve' && Math.random() < dt * 8) {
    spawnDrift(B.x + rand(-26, 26), B.y + rand(-26, 26), rand(-10, 10), rand(-48, -22), ACCENT, rand(0.4, 0.9), rand(1.5, 3));
  }
  // ash sloughs off his shoulders while he stands
  if ((B.state === 'idle' || B.state === 'chainPause') && Math.random() < dt * 3) {
    const sa = B.face + (Math.random() < 0.5 ? 1 : -1) * 1.5;
    spawnDrift(B.x + Math.cos(sa) * 26, B.y + Math.sin(sa) * 26, rand(-6, 6), rand(12, 32), 'rgba(150,146,138,0.5)', rand(0.5, 1.1), rand(1.4, 2.4));
  }

  /* ---- THE CARVING — the ending ---- */
  if (B.state === 'carve') {
    const cv = G.carve;
    if (!cv) return;
    cv.t += dt;
    if (cv.phase === 'walk') {
      const d = dist(B.x, B.y, RING.x, RING.y);
      if (d > 8 && cv.t < 3.0) {
        const a = Math.atan2(RING.y - B.y, RING.x - B.x);
        B.face = turnToward(B.face, a, 3 * dt);
        B.x += Math.cos(a) * 62 * dt; B.y += Math.sin(a) * 62 * dt;
      } else { cv.phase = 'kneel'; cv.t = 0; }
      B.wOff = lerp(B.wOff, 0.9, 3 * dt); B.wLen = lerp(B.wLen, 52, 3 * dt);
    } else if (cv.phase === 'kneel') {
      B.face = turnToward(B.face, -Math.PI / 2, 2.5 * dt);
      B.wOff = lerp(B.wOff, 1.2, 4 * dt); B.wLen = lerp(B.wLen, 46, 4 * dt);
      if (cv.t > 0.8) { cv.phase = 'carving'; cv.t = 0; }
    } else if (cv.phase === 'carving') {
      cv.progress = Math.min(0.93, cv.t / 3.6);      // the final glyph is never finished
      cv.scrapeT -= dt;
      if (cv.scrapeT <= 0 && cv.progress < 0.93) { cv.scrapeT = rand(0.3, 0.45); sfx.scrapeOne(); }
      if (cv.progress < 0.93 && Math.random() < dt * 18) {
        const si = Math.floor(cv.progress * cv.strokes.length);
        const st2 = cv.strokes[Math.min(si, cv.strokes.length - 1)];
        const gx = cv.x - 64 + st2.g * 16;
        spawnDrift(gx + st2.s[2], cv.y + 26 + st2.s[3], rand(-20, 20), rand(-30, -6), ACCENT, rand(0.15, 0.4), 1.5);
        spawnDrift(gx + st2.s[2], cv.y + 26 + st2.s[3], rand(-12, 12), rand(-16, -2), 'rgba(170,164,152,0.6)', rand(0.3, 0.6), 1.5);
      }
      if (cv.t > 4.4) { cv.phase = 'drop'; cv.t = 0; }
    } else if (cv.phase === 'drop') {
      B.wOff = lerp(B.wOff, 1.7, 3 * dt); B.wLen = lerp(B.wLen, 40, 3 * dt);
      if (cv.t > 0.8) { cv.phase = 'still'; cv.t = 0; }
    } else if (cv.phase === 'still') {
      if (cv.t > 2.0 && G.screen === 'fight') goto('victory');
    }
    return;
  }

  if (B.state === 'dying') {
    B.dieT += dt;
    B.tele = 0;
    if (B.dieT > 1.35 && G.screen === 'fight') { goto('victory'); }
    return;
  }

  const angToP = Math.atan2(P.y - B.y, P.x - B.x);

  /* ---- THE BREAK — a decision, not an injury ---- */
  if (B.state === 'break') {
    const t = B.stateT;
    if (t < 0.9) {                       // staggers back, plants the hammer head-down, goes still
      if (t < 0.4) { B.x -= Math.cos(angToP) * 55 * dt; B.y -= Math.sin(angToP) * 55 * dt; }
      B.wOff = lerp(B.wOff, 1.45, 5 * dt); B.wLen = lerp(B.wLen, 86, 5 * dt);
      B.breakStep = 0;
    } else if (t < 1.55) {               // down on one knee, haft across the thigh
      B.breakStep = 1;
      B.wOff = lerp(B.wOff, 0.1, 7 * dt); B.wLen = lerp(B.wLen, 70, 7 * dt);
    } else {
      if (B.breakStep < 2) {             // the CRACK
        B.breakStep = 2;
        B.broken = true;
        AudioSys.duck(0.45, 0.05);
        sfx.crack();
        G.shake = Math.max(G.shake, 16);
        rumble(900, 1.0, 1.0);
        const da = angToP + rand(1.8, 2.6) * (Math.random() < 0.5 ? 1 : -1);
        G.debris = {
          x: B.x + Math.cos(B.face) * 20, y: B.y + Math.sin(B.face) * 20,
          vx: Math.cos(da) * 260, vy: Math.sin(da) * 260,
          rot: rand(0, Math.PI * 2), vr: rand(-9, 9), settleT: 0.7
        };
        spawnParticles(B.x, B.y, 26, '#8a7a62', 240, 0.7);
        spawnParticles(B.x, B.y, 16, ACCENT, 200, 0.8);
      }
      if (t < 2.35) {                    // core flares to maximum; cracks spread
        B.wOff = lerp(B.wOff, 0.3, 6 * dt); B.wLen = lerp(B.wLen, 34, 6 * dt);
      } else if (t < 3.05) {             // he rises differently: low, blade forward and level
        B.breakStep = 3;
        B.wOff = lerp(B.wOff, 0.12, 6 * dt); B.wLen = lerp(B.wLen, 58, 6 * dt);
      } else {
        B.phase2 = true;
        G.barLifted = true;              // the bar rests against the frame from here on
        G.cinematic = false;
        B.state = 'idle'; B.cd = 0.7; B.chainCount = 0;
      }
    }
    B.tele = 0;
    return;
  }

  if (B.state === 'daze') {              // he hit the wall at a full charge
    B.dazeT -= dt;
    B.tele = 0;
    B.wOff = lerp(B.wOff, 1.4, 4 * dt); B.wLen = lerp(B.wLen, 86, 4 * dt);
    if (B.dazeT <= 0) { B.state = 'idle'; B.cd = 0.8; }
    return;
  }

  /* ---- THE HESITATION — exactly once; nothing speeds up afterward ---- */
  if (B.state === 'hesitate') {
    const t = B.stateT;
    if (t < 0.5) {
      const k = t / 0.5;
      B.wOff = lerp(0.35, 0.05, k); B.wLen = lerp(58, 34, k);
      B.tele = k * 0.85;
      B.face = turnToward(B.face, angToP, 1.6 * dt);
    } else if (t < 1.15) {               // held at the top — and nothing comes
      B.tele = 0;
      B.coreDim = Math.min(1, B.coreDim + 4 * dt);
      if (!B.mourned) { B.mourned = true; sfx.mourn(); }
    } else if (t < 2.45) {               // the blade comes down, unswung
      const k = (t - 1.15) / 1.3;
      B.wOff = lerp(0.05, 1.35, k); B.wLen = lerp(34, 58, k);
      B.coreDim = 1;
    } else {
      B.hesitated = true;
      B.state = 'idle'; B.cd = 0.7;
    }
    return;
  }

  /* ---- THE READ — he sees the charge coming ---- */
  if (B.state === 'read') {
    B.tele = 0.55 + 0.45 * Math.sin(G.time * 34);   // a sharp, unmistakable flicker
    B.face = turnToward(B.face, angToP, 6 * dt);
    B.wOff = lerp(B.wOff, -0.4, 11 * dt); B.wLen = lerp(B.wLen, 62, 11 * dt);
    // he closes the last of the gap as he commits, so the charge is never safe
    if (dist(B.x, B.y, P.x, P.y) > 120) {
      B.x += Math.cos(angToP) * 190 * dt; B.y += Math.sin(angToP) * 190 * dt;
    }
    if (B.stateT >= 0.22) { B.chainCount = 1; bossStartAttack('punish'); }
    return;
  }

  if (B.state === 'chainPause') {        // the beat between chained cuts — a real window
    B.tele = 0;
    B.wOff = lerp(B.wOff, 1.1, 6 * dt); B.wLen = lerp(B.wLen, 52, 6 * dt);
    B.face = turnToward(B.face, angToP, 1.0 * dt);
    if (B.stateT >= B.pauseDur) { B.chainCount++; bossStartAttack(chooseAttack2(dist(B.x, B.y, P.x, P.y))); }
    return;
  }

  if (B.state === 'recoil') {                // knocked off-balance by a parry
    B.tele = 0;
    B.wOff = lerp(B.wOff, -1.45, 7 * dt); B.wLen = lerp(B.wLen, 82, 7 * dt);
    if (B.stateT < 0.2) {
      B.x -= Math.cos(B.face) * 55 * dt; B.y -= Math.sin(B.face) * 55 * dt;
      B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
      B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
    }
    if (B.stateT >= 0.85) { B.state = 'idle'; B.cd = 0.75; }
    return;
  }

  if (B.state === 'stagger') {
    B.staggerT -= dt;
    B.tele = 0;
    B.wOff = lerp(B.wOff, 1.6, 5 * dt); B.wLen = lerp(B.wLen, 60, 5 * dt);
    if (B.staggerT <= 0) { B.state = 'idle'; B.cd = 0.6; }
    return;
  }

  if (B.state === 'idle') {
    B.tele = Math.max(0, B.tele - 4 * dt);
    const d = dist(B.x, B.y, P.x, P.y);

    if (!B.phase2) {
      /* REACTIVE STANCE — phase 1 only. No aggression, no fight. */
      const passive = G.time - G.lastAggro > 1.4;
      B.guarding = passive;
      B.wOff = lerp(B.wOff, passive ? 1.05 : 0.5, 4 * dt);
      B.wLen = lerp(B.wLen, 86, 4 * dt);
      B.face = turnToward(B.face, angToP, 3.0 * dt);
      if (d > (passive ? 250 : 165)) {
        const sp = d > 300 ? 150 : 100;
        B.x += Math.cos(angToP) * sp * dt; B.y += Math.sin(angToP) * sp * dt;
      } else {
        B.strafeT -= dt;
        if (B.strafeT <= 0) { B.strafeDir = Math.random() < 0.5 ? -1 : 1; B.strafeT = rand(0.8, 1.8); }
        const sa = angToP + Math.PI / 2 * B.strafeDir;
        B.x += Math.cos(sa) * (passive ? 68 : 52) * dt; B.y += Math.sin(sa) * (passive ? 68 : 52) * dt;
      }
      B.cd -= dt * (passive ? 0.15 : 1);
      if (B.cd <= 0) {
        if (passive && Math.random() < 0.6) B.cd = rand(0.9, 1.6);   // he shifts his guard and keeps waiting
        else { B.chainCount = 1; bossStartAttack(chooseAttack1(d)); }
      }
    } else {
      B.guarding = false;
      B.wOff = lerp(B.wOff, 0.35, 5 * dt);   // low stance, blade forward and level
      B.wLen = lerp(B.wLen, 58, 5 * dt);
      B.face = turnToward(B.face, angToP, 4.2 * dt);
      if (d > 140) {
        B.x += Math.cos(angToP) * 175 * dt; B.y += Math.sin(angToP) * 175 * dt;
      } else {
        B.strafeT -= dt;
        if (B.strafeT <= 0) { B.strafeDir = Math.random() < 0.5 ? -1 : 1; B.strafeT = rand(0.6, 1.4); }
        const sa = angToP + Math.PI / 2 * B.strafeDir;
        B.x += Math.cos(sa) * 80 * dt; B.y += Math.sin(sa) * 80 * dt;
      }
      // he reads a heavy being wound up and refuses to stand there for it
      const charging = P.act && P.act.type === 'heavy' && P.act.charging && P.act.chargeT > 0.35;
      if (charging && B.readCd <= 0 && !P.dead) {
        B.state = 'read'; B.stateT = 0; B.readCd = 5.0;
        B.atk = null;
        sfx.read();
        return;
      }
      B.cd -= dt;
      if (B.cd <= 0) {
        if (!B.hesitated && P.hp <= 35) { B.state = 'hesitate'; B.stateT = 0; B.mourned = false; }
        else { B.chainCount = 1; bossStartAttack(chooseAttack2(d)); }
      }
    }
  } else if (B.state === 'attack' && B.atk) {
    const atk = (B.atkSet === 2 ? ATK2 : ATK1)[B.atk];
    const ph = atk.phases[B.phaseIdx];
    const pdur = B.phaseDur;
    B.phaseT += dt;
    const k = clamp(B.phaseT / pdur, 0, 1);

    // pose interpolation
    B.wOff = lerp(ph.w[0], ph.w[1], k);
    B.wLen = lerp(ph.L[0], ph.L[1], k);

    // telegraph intensity: ramps during windups only
    if (ph.k === 'w') B.tele = k;
    else if (ph.k === 'a') B.tele = Math.max(0, B.tele - 8 * dt);
    else B.tele = Math.max(0, B.tele - 6 * dt);

    // tracking during windups/gaps only — active phases are committed
    if ((ph.k === 'w' || ph.k === 'g') && ph.track) {
      B.face = turnToward(B.face, angToP, ph.track * dt);
    }

    // movement within a phase
    if (ph.move) {
      B.x += Math.cos(B.face) * ph.move.sp * dt;
      B.y += Math.sin(B.face) * ph.move.sp * dt;
    }

    // CHARGING RUSH: committed, and the wall punishes him for it
    if (ph.charge) {
      B.x += Math.cos(B.face) * ph.charge * dt;
      B.y += Math.sin(B.face) * ph.charge * dt;
      if (Math.random() < dt * 30) {
        spawnDrift(B.x - Math.cos(B.face) * 30 + rand(-12, 12), B.y - Math.sin(B.face) * 30 + rand(-12, 12),
          -Math.cos(B.face) * 60, -Math.sin(B.face) * 60, 'rgba(150,146,138,0.5)', 0.4, 2);
      }
      const hitWall = B.x <= ARENA.x + B.r || B.x >= ARENA.x + ARENA.w - B.r ||
                      B.y <= ARENA.y + B.r || B.y >= ARENA.y + ARENA.h - B.r;
      if (hitWall) {
        B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
        B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
        B.atk = null;
        B.state = 'daze'; B.stateT = 0; B.dazeT = 1.4;
        sfx.daze();
        G.shake = Math.max(G.shake, 13);
        rumble(400, 0.8, 0.5);
        spawnParticles(B.x + Math.cos(B.face) * B.r, B.y + Math.sin(B.face) * B.r, 22, '#8a8478', 230, 0.7);
        return;
      }
    }

    // entering active: the swing sound + arc
    if (ph.k === 'a' && !B.phaseStarted) {
      B.phaseStarted = true; B.hitDone = false;
      if (B.atkSet === 1) { if (ph.charge) sfx.chargeWhoosh(); else sfx.maulSwing(); }
      else sfx.shardSwing();
      if (ph.hit && ph.hit.s === 'arc' && !ph.charge) {
        addSlash(B.x, B.y, B.face + (ph.w[0] + ph.w[1]) / 2, ph.hit.r1, Math.min(ph.hit.half, 2.2), ACCENT, 0.18);
      }
    }

    // active hit check — every boss hit is parryable
    if (ph.k === 'a' && ph.hit && !B.hitDone) {
      let hit = false;
      if (ph.hit.s === 'arc') {
        const d = dist(B.x, B.y, P.x, P.y);
        if (d > ph.hit.r0 - P.r && d < ph.hit.r1 + P.r) {
          const rel = Math.abs(angDiff(B.face, Math.atan2(P.y - B.y, P.x - B.x)));
          if (rel < ph.hit.half + Math.asin(clamp(P.r / Math.max(d, P.r), 0, 1))) hit = true;
        }
      } else if (ph.hit.s === 'c') {
        const cx = B.x + Math.cos(B.face) * ph.hit.dist, cy = B.y + Math.sin(B.face) * ph.hit.dist;
        if (dist(cx, cy, P.x, P.y) < ph.hit.r + P.r) hit = true;
      }
      if (hit) {
        const connected = damagePlayer(ph.dmg, B.x, B.y, true, ph.kb || 1);
        B.hitDone = connected || B.hitDone;
        if (B.state !== 'attack') { B.phaseStarted = false; return; } // a parry knocked him out of the swing
        if (connected && ph.charge) B.phaseT = pdur;                  // the rush stops on a body
      }
      // ground impact feedback once, at start of active
      if (ph.impact && !B.impacted) {
        B.impacted = true;
        sfx.maulImpact();
        G.shake = Math.max(G.shake, ph.shake || 8);
        rumble(260, 0.7, 0.35);
        const cx = B.x + Math.cos(B.face) * (ph.hit.dist || 70), cy = B.y + Math.sin(B.face) * (ph.hit.dist || 70);
        spawnParticles(cx, cy, 18, '#8a7f6a', 200, 0.55);
        addSlash(cx, cy, 0, 40, Math.PI, ACCENT, 0.22);
        if (ph.fissures) spawnFissures(cx, cy);
      }
    }

    // advance phase
    if (B.phaseT >= pdur) {
      B.phaseIdx++;
      B.phaseT = 0; B.phaseStarted = false; B.impacted = false;
      if (B.phaseIdx >= atk.phases.length) {
        B.atk = null;
        // phase 2 chains into short strings, each link separated by a readable beat
        if (B.phase2 && B.chainCount < 3 && Math.random() < 0.7) {
          B.state = 'chainPause'; B.stateT = 0; B.pauseDur = rand(0.40, 0.60);
        } else {
          B.chainCount = 0;
          B.state = 'idle'; B.stateT = 0;
          B.cd = B.phase2 ? rand(0.25, 0.65) : rand(0.9, 1.6);
        }
      } else {
        B.phaseDur = atk.phases[B.phaseIdx].d;
      }
    }
  }

  // clamp boss to arena
  B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
  B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
}

/* =========================================================================
   UPDATE DISPATCH
   ========================================================================= */
function update(dt) {
  G.time += dt;
  G.screenT += dt;
  G.shake = Math.max(0, G.shake - G.shake * 7 * dt - 2 * dt);

  // particles & slashes always tick
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 4 * dt); p.vy *= (1 - 4 * dt);
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.slashes.length - 1; i >= 0; i--) {
    G.slashes[i].t += dt;
    if (G.slashes[i].t > G.slashes[i].dur) G.slashes.splice(i, 1);
  }
  for (let i = G.dmgNums.length - 1; i >= 0; i--) {
    G.dmgNums[i].t += dt;
    if (G.dmgNums[i].t > 0.7) G.dmgNums.splice(i, 1);
  }
  for (let i = P.trail.length - 1; i >= 0; i--) {
    P.trail[i].a -= 4.5 * dt;
    if (P.trail[i].a <= 0) P.trail.splice(i, 1);
  }

  switch (G.screen) {
    case 'title':
      if (Input.confirm) {
        resetFight();
        sfx.fog();
        goto(G.firstFight ? 'intro' : 'refade');
      }
      break;
    case 'intro': {
      // fog-gate walk-in
      const t = G.screenT;
      P.x = lerp(ARENA.x + 60, ARENA.x + 130, clamp(t / 1.5, 0, 1));
      P.face = 0;
      if (t >= 1.6 || Input.confirm) { G.firstFight = false; goto('fight'); }
      break;
    }
    case 'refade':
      if (G.screenT >= 0.45) goto('fight');
      break;
    case 'fight':
      updatePlayer(dt);
      updateBoss(dt);
      updateFissures(dt);
      updateDebris(dt);
      break;
    case 'dead':
      // world freezes behind the overlay; boss finishes its swing cosmetically
      B.tele = Math.max(0, B.tele - dt);
      if (G.screenT > 2.1 && Input.confirm) {
        resetFight();
        goto('refade');
      }
      break;
    case 'victory':
      if (!G.victoryChimed && G.screenT > 0.4) { G.victoryChimed = true; sfx.chime(); }
      if (G.screenT > 2.3 && Input.confirm) {
        G.victoryChimed = false;
        resetFight();
        goto('refade');
      }
      break;
  }
}

/* =========================================================================
   RENDERING
   ========================================================================= */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTracked(text, x, y, spacing) {
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  let total = 0;
  const ws = [];
  for (const ch of text) { const w = ctx.measureText(ch).width; ws.push(w); total += w + spacing; }
  total -= spacing;
  let cx = x - total / 2;
  let i = 0;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ws[i] + spacing; i++; }
  ctx.textAlign = prevAlign;
}

function drawFloor() {
  ctx.drawImage(ARENA_BAKE, 0, 0, W, H);

  // dynamic ritual-glow overlay (phase 2 lights the pentacle brighter — cheap, small)
  if (B.phase2) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.strokeStyle = `rgba(255,158,44,${0.14 - 0.07})`;
    ctx.restore();
  }

  // corner braziers — the arena's only warm light (flicker is dynamic, drawn per frame)
  for (const c of BRAZIERS) {
    const fl = 0.75 + 0.25 * Math.sin(G.time * 7 + c[0] * 0.1);
    ctx.globalAlpha = 0.16 * fl;
    ctx.drawImage(GLOW_EMBER, c[0] - 90 * fl, c[1] - 90 * fl, 180 * fl, 180 * fl);
    ctx.globalAlpha = 1;
    ctx.fillStyle = `rgba(255,${150 + Math.floor(60 * fl)},60,${0.85 * fl})`;
    ctx.beginPath();
    ctx.moveTo(c[0], c[1] - 12 - 5 * fl);
    ctx.quadraticCurveTo(c[0] + 6, c[1] - 4, c[0], c[1] - 3);
    ctx.quadraticCurveTo(c[0] - 6, c[1] - 4, c[0], c[1] - 12 - 5 * fl);
    ctx.fill();
    // a steady column of embers rising off each flame
    if (Math.random() < 0.25) spawnDrift(c[0] + rand(-4, 4), c[1] - 10, rand(-7, 7), rand(-52, -26), ACCENT, rand(0.6, 1.3), rand(1.2, 2.4));
    if (Math.random() < 0.1) spawnDrift(c[0] + rand(-7, 7), c[1] - 6, rand(-5, 5), rand(-30, -16), 'rgba(255,190,120,0.5)', rand(0.8, 1.5), 1.4);
  }

  // the gate bar, once he has lifted it: resting against the frame. Never remarked on.
  if (G.barLifted) {
    ctx.save();
    // paint over the baked-in barred version
    ctx.fillStyle = '#131015';
    ctx.fillRect(GATE.x - 62, 30, 124, 16);
    const og2 = ctx.createLinearGradient(0, 30, 0, 46);
    og2.addColorStop(0, '#171310'); og2.addColorStop(1, '#0e0c0c');
    ctx.fillStyle = og2;
    ctx.fillRect(GATE.x - 62, 30, 124, 16);
    ctx.translate(GATE.x + 52, 34);
    ctx.rotate(-1.22);
    ctx.fillStyle = '#1b1c24';
    ctx.fillRect(-70, -6, 140, 12);
    ctx.strokeStyle = '#0a0b10'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-70, -6, 140, 12);
    ctx.fillStyle = '#3c3f4d';
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * 28, 0, 1.8, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  // the dying ember light inside the gate's opening
  const gf = 0.7 + 0.3 * Math.sin(G.time * 1.3);
  ctx.globalAlpha = 0.14 * gf;
  ctx.drawImage(GLOW_EMBER, GATE.x - 44 * gf, 24 - 34 * gf, 88 * gf, 68 * gf);
  ctx.globalAlpha = 1;

  // drifting ash motes
  ctx.fillStyle = 'rgba(200,190,170,0.16)';
  for (let i = 0; i < 30; i++) {
    const sx = (i * 137.5) % ARENA.w;
    const sy = ((i * 71.3) + G.time * (12 + (i % 5) * 6)) % ARENA.h;
    const wob = Math.sin(G.time * 0.8 + i) * 6;
    ctx.fillRect(ARENA.x + sx + wob, ARENA.y + ARENA.h - sy, 1.6, 1.6);
  }

  // a low fog band, drifting slowly across the floor
  const fx1 = ((G.time * 7) % (W + 340)) - 340;
  ctx.globalAlpha = 0.5;
  ctx.drawImage(FOG_BAND, fx1, 348, 430, 96);
  ctx.drawImage(FOG_BAND, W - fx1 - 460, 236, 460, 100);
  ctx.globalAlpha = 1;
}

function drawFogWall() {
  const t = G.time;
  ctx.save();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(130,148,190,0.4)';
  roundRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h, 10);
  ctx.stroke();
  ctx.globalAlpha = 1;
  for (let i = 0; i < 42; i++) {
    const u = (i / 42 + t * 0.014 * (i % 3 === 0 ? 1.6 : 1)) % 1;
    const per = 2 * (ARENA.w + ARENA.h);
    let p = u * per, x, y;
    if (p < ARENA.w) { x = ARENA.x + p; y = ARENA.y; }
    else if (p < ARENA.w + ARENA.h) { x = ARENA.x + ARENA.w; y = ARENA.y + (p - ARENA.w); }
    else if (p < 2 * ARENA.w + ARENA.h) { x = ARENA.x + ARENA.w - (p - ARENA.w - ARENA.h); y = ARENA.y + ARENA.h; }
    else { x = ARENA.x; y = ARENA.y + ARENA.h - (p - 2 * ARENA.w - ARENA.h); }
    const s = Math.abs(10 + 9 * Math.sin(t * 0.8 + i * 2.1)) + 8;
    ctx.globalAlpha = 0.09 + 0.06 * Math.sin(t * 1.3 + i);
    ctx.drawImage(FOG_SPRITE, x - s, y - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(4,5,8,0.72)';
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  roundRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h, 10);
  ctx.fill('evenodd');
  ctx.restore();
}

function drawFissures() {
  for (const f of G.fissures) {
    const fade = f.len < f.maxLen ? 1 : clamp(1 - (f.t - f.maxLen / f.speed) / 0.9, 0, 1);
    const dx = Math.cos(f.ang), dy = Math.sin(f.ang);
    const nx = -dy, ny = dx;
    const segs = Math.max(2, Math.floor(f.len / 24));
    ctx.strokeStyle = `rgba(10,8,6,${0.8 * fade})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    for (let i = 1; i <= segs; i++) {
      const along = (i / segs) * f.len;
      const off = f.jit[i % f.jit.length] * (i === segs ? 0.4 : 1);
      ctx.lineTo(f.x + dx * along + nx * off, f.y + dy * along + ny * off);
    }
    ctx.stroke();
    ctx.strokeStyle = `rgba(255,158,44,${0.75 * fade})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    if (f.len < f.maxLen) {
      const tx = f.x + dx * f.len, ty = f.y + dy * f.len;
      ctx.globalAlpha = 0.6;
      ctx.drawImage(GLOW_EMBER, tx - 14, ty - 14, 28, 28);
      ctx.globalAlpha = 1;
    }
  }
}

function drawDebris() {
  const d = G.debris;
  if (!d) return;
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 4, 22, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(d.rot);
  const g = ctx.createLinearGradient(0, -16, 0, 16);
  g.addColorStop(0, '#3a3d49'); g.addColorStop(1, '#20222b');
  ctx.fillStyle = g;
  ctx.fillRect(-11, -17, 22, 34);
  ctx.strokeStyle = '#0a0b10';
  ctx.lineWidth = 2;
  ctx.strokeRect(-11, -17, 22, 34);
  ctx.fillStyle = '#767e90';
  ctx.fillRect(7, -17, 4, 34);           // the striking edge, still bright
  ctx.fillStyle = '#14161d';
  ctx.beginPath(); ctx.arc(-4, 0, 3, 0, Math.PI * 2); ctx.fill();  // the socket, empty
  ctx.strokeStyle = '#4a3b2c';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-14, 5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-12, -4); ctx.stroke();
  ctx.restore();
}

function drawCarving() {
  const cv = G.carve;
  if (!cv || B.state !== 'carve') return;
  const total = cv.strokes.length;
  const shown = cv.progress * total;
  const full = Math.floor(shown);
  ctx.save();
  for (let i = 0; i < Math.min(full + 1, total); i++) {
    const st2 = cv.strokes[i];
    const gx = cv.x - 64 + st2.g * 16, gy = cv.y + 26;
    let frac = 1;
    if (i === full) frac = shown - full;
    if (frac <= 0) continue;
    const x2 = st2.s[0] + (st2.s[2] - st2.s[0]) * frac;
    const y2 = st2.s[1] + (st2.s[3] - st2.s[1]) * frac;
    ctx.strokeStyle = 'rgba(20,17,14,0.9)'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(gx + st2.s[0], gy + st2.s[1]); ctx.lineTo(gx + x2, gy + y2); ctx.stroke();
    ctx.strokeStyle = i >= full - 3 ? 'rgba(255,158,44,0.5)' : 'rgba(196,188,172,0.32)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(gx + st2.s[0], gy + st2.s[1]); ctx.lineTo(gx + x2, gy + y2); ctx.stroke();
  }
  if (cv.phase !== 'walk' && cv.phase !== 'kneel') {
    const reveal = clamp(cv.progress / 0.93, 0, 1);
    const text = 'NOMAD, NOWHERE TO —';
    const chars = Math.floor(reveal * text.length);
    if (chars > 0) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#c9c2b2';
      ctx.font = '600 13px Georgia, "Times New Roman", serif';
      drawTracked(text.slice(0, chars), cv.x, cv.y + 54, 3.2);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function drawSlashes() {
  for (const s of G.slashes) {
    const k = s.t / s.dur;
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.5;
    ctx.fillStyle = s.col;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.r * (0.85 + 0.15 * k), s.ang - s.half, s.ang + s.half);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawSword(len, white) { drawSwordProfile(ctx, len, { white }); }

function drawPlayer() {
  if (P.dead) {
    // crumple + a soul-wisp drifting up and away
    const t = G.screenT;
    if (t < 4) {
      ctx.save();
      ctx.translate(P.deathX, P.deathY);
      ctx.globalAlpha = clamp(1 - t / 4, 0.2, 1);
      ctx.rotate(1.35);
      ctx.fillStyle = '#8d97ad';
      ctx.beginPath(); ctx.ellipse(0, 0, 15, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#aab5cc';
      ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(4, -5); ctx.lineTo(4, 5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    const wt = clamp(t - 0.5, 0, 3.2);
    if (wt > 0 && wt < 3.2) {
      const wy = P.deathY - 14 - wt * 24;
      const wa = clamp(1 - wt / 3.2, 0, 0.85);
      const wx = P.deathX + Math.sin(t * 2.2) * 8;
      ctx.globalAlpha = wa;
      ctx.drawImage(GLOW_BLUE, wx - 12, wy - 12, 24, 24);
      ctx.globalAlpha = wa * 0.9;
      ctx.fillStyle = '#dceaff';
      ctx.beginPath(); ctx.arc(wx, wy, 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    return;
  }

  // roll afterimages
  for (const t of P.trail) {
    ctx.save();
    ctx.globalAlpha = clamp(t.a, 0, 1) * 0.3;
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rot);
    ctx.fillStyle = '#9fb2d4';
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // the scarf — trailing off the shoulder, pale blue
  if (P.scarf.length) {
    ctx.strokeStyle = COOL;
    ctx.lineCap = 'round';
    for (let i = 0; i < P.scarf.length - 1; i++) {
      ctx.globalAlpha = 0.7 * (1 - i / P.scarf.length);
      ctx.lineWidth = 3 - i * 0.35;
      ctx.beginPath();
      ctx.moveTo(P.scarf[i].x, P.scarf[i].y);
      ctx.lineTo(P.scarf[i + 1].x, P.scarf[i + 1].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineCap = 'butt';
  }

  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(0, 6, 14, 6, 0, 0, Math.PI * 2); ctx.fill();

  const rolling = P.act && P.act.type === 'roll';
  const flasking = P.act && P.act.type === 'flask';
  const white = P.flash > 0;
  ctx.rotate(rolling ? Math.atan2(P.act.dirY, P.act.dirX) : P.face);

  if (rolling) {
    const k = P.act.t / P.act.dur;
    const rx = 16 + 5 * Math.sin(k * Math.PI);
    ctx.fillStyle = white ? '#ffffff' : '#c7d1e4';
    ctx.beginPath(); ctx.ellipse(0, 0, rx, 9.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#3a4152';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.strokeStyle = white ? '#ffffff' : 'rgba(58,65,82,0.8)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const a0 = k * 9 + i * 2.1;
      ctx.beginPath(); ctx.arc(0, 0, 6.5, a0, a0 + 1.1); ctx.stroke();
    }
  } else {
    const sprintingNow = P.speedNow > 220;
    const idleBob = P.speedNow < 5 ? Math.sin(G.time * 2.1) * 0.8 : 0;   // breathing
    const sway = Math.sin(P.walkT) * 1.4 + idleBob;
    ctx.translate(0, sway);
    if (sprintingNow) ctx.rotate(0.08);                                  // the lean

    // cape — flutters harder with speed
    const flut = 3 + Math.min(6, P.speedNow * 0.02);
    const cs = Math.sin(G.time * (2.6 + P.speedNow * 0.015) + P.walkT) * flut;
    const cg = ctx.createLinearGradient(-22, 0, -2, 0);
    cg.addColorStop(0, '#2d3a63'); cg.addColorStop(1, '#5265a0');
    ctx.fillStyle = white ? '#ffffff' : cg;
    ctx.beginPath();
    ctx.moveTo(-2, -9);
    ctx.quadraticCurveTo(-15, -8 + cs, -23 - flut * 0.5, -3 + cs);
    ctx.lineTo(-23 - flut * 0.5, 4 + cs);
    ctx.quadraticCurveTo(-15, 8 + cs, -2, 9);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#1a2138';
    ctx.lineWidth = 1.2; ctx.stroke();

    // sprint speed lines
    if (sprintingNow) {
      ctx.strokeStyle = 'rgba(200,212,236,0.3)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(-18 - i * 6, -7 + i * 7);
        ctx.lineTo(-29 - i * 7, -7 + i * 7);
        ctx.stroke();
      }
    }

    // armored torso
    const bg = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
    bg.addColorStop(0, '#eef2fa'); bg.addColorStop(0.55, '#b7c1d6'); bg.addColorStop(1, '#7d87a1');
    ctx.fillStyle = white ? '#ffffff' : bg;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#333a4b';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (!white) {
      ctx.strokeStyle = 'rgba(51,58,75,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, 8, -1.2, 1.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 4.5, -1.4, 1.4); ctx.stroke();
    }

    // pauldrons
    ctx.fillStyle = white ? '#ffffff' : '#98a3ba';
    ctx.strokeStyle = white ? '#ffffff' : '#333a4b';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(-1, -10.5, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-1, 10.5, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // pointed helm
    const hg = ctx.createLinearGradient(2, 0, 16, 0);
    hg.addColorStop(0, '#aab5cc'); hg.addColorStop(1, '#f2f6ff');
    ctx.fillStyle = white ? '#ffffff' : hg;
    ctx.beginPath(); ctx.moveTo(19, 0); ctx.lineTo(2, -8.5); ctx.lineTo(6, 0); ctx.lineTo(2, 8.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#252c3c';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // glowing visor slit — pale blue, his one warm sign of life
    if (!white) {
      ctx.globalAlpha = 0.55;
      ctx.drawImage(GLOW_BLUE, 3, -7, 14, 14);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = COOL;
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(10, -3.6); ctx.lineTo(14, 0); ctx.lineTo(10, 3.6); ctx.stroke();
    }

    // sword — held low; swings across on attacks, raised flat when guarding
    let swordAng = 0.75, swordLen = 30;
    let trailFrom = null;   // when set, ghost blades sweep behind the cut
    if (P.act && (P.act.type === 'light' || P.act.type === 'heavy')) {
      const heavy = P.act.type === 'heavy';
      const alt = P.act.alt || 1;
      if (heavy && P.act.charging) {
        // held at the top of the wind-up; trembles as the charge builds
        const ch = P.act.chargeT || 0;
        swordAng = -1.7 * alt + Math.sin(G.time * (20 + ch * 30)) * 0.03 * ch;
        swordLen = 36;
      } else {
        const wEnd = heavy ? 0.5 : 0.27;
        const k = clamp(P.act.t / wEnd, 0, 1);
        swordAng = lerp(-1.6 * alt, 1.3 * alt, k);
        swordLen = heavy ? 36 : 32;
        if (k > 0.3 && k < 1) trailFrom = { ang: swordAng, step: -0.38 * alt, len: swordLen };
      }
    } else if (P.act && P.act.type === 'lunge') {
      const k = clamp(P.act.t / 0.22, 0, 1);
      swordAng = lerp(-0.9, 0.05, k);          // whips forward into a thrust
      swordLen = 36;
      if (k > 0.4 && k < 1) trailFrom = { ang: swordAng, step: -0.3, len: 36 };
    } else if (P.act && P.act.type === 'riposte') {
      const k = P.act.t;
      if (k < 0.16) { swordAng = lerp(-1.9, 0.02, k / 0.16); swordLen = 34; }   // raised high, driven down and in
      else if (k < 0.4) { swordAng = 0.02; swordLen = 40; }                     // buried to the guard
      else { swordAng = lerp(0.02, 0.75, (k - 0.4) / 0.26); swordLen = 34; }    // dragged back out
    } else if (P.act && P.act.type === 'parry') {
      swordAng = lerp(0.4, -1.7, clamp(P.act.t / 0.2, 0, 1));
      swordLen = 32;
    } else if (P.blocking) {
      swordAng = -1.15;
      swordLen = 32;
    }
    // ghost blades trailing the arc
    if (trailFrom) {
      for (let i = 1; i <= 3; i++) {
        ctx.save();
        ctx.globalAlpha = 0.26 - i * 0.07;
        ctx.translate(3, 9);
        ctx.rotate(trailFrom.ang + trailFrom.step * i);
        drawSword(trailFrom.len, false);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(3, 9);
    ctx.rotate(swordAng);
    drawSword(swordLen, white);
    // the charge gathers pale-blue light along the blade
    if (P.act && P.act.type === 'heavy' && P.act.charging && P.act.chargeT > 0.05) {
      const ch = P.act.chargeT / 0.8;
      ctx.globalAlpha = 0.35 + ch * 0.45;
      ctx.drawImage(GLOW_BLUE, swordLen - 12, -12, 24 + ch * 10, 24 + ch * 10);
      ctx.globalAlpha = 1;
      if (ch >= 1) {
        ctx.strokeStyle = 'rgba(220,235,255,0.8)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(swordLen - 2, 0); ctx.stroke();
      }
    }
    ctx.restore();

    // guard shimmer — a ward of steel across the facing arc
    if (P.blocking) {
      ctx.strokeStyle = `rgba(180,200,240,${0.3 + 0.12 * Math.sin(G.time * 6)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(5, 0, 17, -1.2, 1.2); ctx.stroke();
    }
    // the glint of an active parry window
    if (P.act && P.act.type === 'parry' && P.act.t <= 0.2) {
