  ctx.lineWidth = 2.5;
  ctx.stroke();
  if (!white) {
    ctx.strokeStyle = 'rgba(190,205,240,0.5)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(18, -24); ctx.lineTo(30, 0); ctx.lineTo(18, 24);
    ctx.stroke();
  }

  // ---- portcullis-bar ribs across the torso, with an ember core glowing through ----
  if (!white) {
    let core = B.broken ? 1.0 : 0.5;
    core *= (1 - 0.85 * B.coreDim);        // it gutters out when he falters
    if (stag) core = 1.3;                  // stance broken: exposed and flaring
    const cr = stag ? 40 : 26;
    ctx.globalAlpha = alpha * clamp(core, 0, 1);
    ctx.drawImage(GLOW_EMBER, -2 - cr / 2, -cr / 2, cr, cr);
    ctx.globalAlpha = alpha;
    // cracks spread wider once the haft is broken
    ctx.strokeStyle = `rgba(255,158,44,${0.4 * clamp(core, 0, 1)})`;
    ctx.lineWidth = B.broken ? 2 : 1.2;
    const cracks = B.broken
      ? [[-2, -4, -13, -16], [-2, 4, -15, 15], [2, -2, 13, -12], [-4, 0, -20, 3], [2, 4, 12, 16], [0, -5, 4, -20]]
      : [[-2, -4, -11, -13], [-2, 4, -12, 12], [1, 0, 11, -6]];
    for (const c2 of cracks) {
      ctx.beginPath();
      ctx.moveTo(c2[0], c2[1]);
      ctx.lineTo((c2[0] + c2[2]) / 2 + 2, (c2[1] + c2[3]) / 2 - 1);
      ctx.lineTo(c2[2], c2[3]);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = white ? '#ffffff' : '#14111c';
  ctx.lineWidth = 3.5;
  for (const rx of [-18, -6, 6, 18]) {
    ctx.beginPath(); ctx.moveTo(rx, -22 + Math.abs(rx) * 0.15); ctx.lineTo(rx, 22 - Math.abs(rx) * 0.15); ctx.stroke();
  }
  if (!white) {
    ctx.fillStyle = mix('#6d5f78', ACCENT, pulse * 0.4);
    for (const rx of [-18, -6, 6, 18]) {
      ctx.beginPath(); ctx.arc(rx, -18 + Math.abs(rx) * 0.15, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(rx, 18 - Math.abs(rx) * 0.15, 1.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  // chest plate + ashen sigil
  ctx.fillStyle = plateCol;
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(8, -15); ctx.lineTo(-8, -12);
  ctx.lineTo(-8, 12); ctx.lineTo(8, 15);
  ctx.closePath(); ctx.fill();
  if (!white) {
    ctx.strokeStyle = mix('#c9a34a', ACCENT, pulse);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-2, -7); ctx.lineTo(-2, 7); ctx.closePath(); ctx.stroke();
  }

  // ---- hinge pauldrons with rivets — the same steel the knight wears, made huge ----
  const drawPauldron = (sy) => {
    ctx.save();
    ctx.translate(-6, sy * 27);
    const pg = ctx.createRadialGradient(-3, -3, 2, 0, 0, 15);
    pg.addColorStop(0, '#c3cddf'); pg.addColorStop(0.55, '#98a3ba'); pg.addColorStop(1, '#5f6981');
    ctx.fillStyle = white ? '#ffffff' : (pulse > 0.02 ? trimCol : pg);
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 12, sy * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#0d0a14';
    ctx.lineWidth = 1.8; ctx.stroke();
    ctx.fillStyle = white ? '#ffffff' : mix('#c3cddf', ACCENT, pulse);
    ctx.strokeStyle = white ? '#ffffff' : '#0b0810';
    ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
      ctx.save();
      ctx.rotate((sy > 0 ? 0 : Math.PI) + i * 0.44);
      ctx.beginPath(); ctx.moveTo(-4, 2); ctx.lineTo(4, 2); ctx.lineTo(0, 17); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    if (!white) {
      ctx.fillStyle = '#3a3540';
      for (const rx of [-8, 0, 8]) { ctx.beginPath(); ctx.arc(rx, sy * -8, 1.3, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  };
  const shouldersShed = B.phase2 || (B.state === 'break' && B.stateT >= 2.35);
  if (!shouldersShed) { drawPauldron(-1); drawPauldron(1); }

  // ---- horned helm ----
  ctx.save();
  ctx.translate(24, 0);
  const hornCol = white ? '#ffffff' : mix('#e6d8c2', ACCENT, pulse);
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(1, s * 3);
    ctx.quadraticCurveTo(20, s * 9, 32, s * 23);
    ctx.quadraticCurveTo(15, s * 17, 1, s * 12);
    ctx.closePath();
    ctx.fillStyle = hornCol;
    ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#0b0810';
    ctx.lineWidth = 1.3; ctx.stroke();
    if (!white) {
      ctx.strokeStyle = 'rgba(120,96,70,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(4, s * 7); ctx.quadraticCurveTo(18, s * 12, 29, s * 21); ctx.stroke();
    }
  }
  const hgr = ctx.createLinearGradient(-9, 0, 20, 0);
  hgr.addColorStop(0, '#3a2f43'); hgr.addColorStop(1, '#7c6989');
  ctx.fillStyle = white ? '#ffffff' : (pulse > 0.02 ? mix('#54465e', ACCENT, pulse * 0.6) : hgr);
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(6, -12); ctx.lineTo(-9, -10);
  ctx.lineTo(-9, 10); ctx.lineTo(6, 12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#0b0810';
  ctx.lineWidth = 1.8; ctx.stroke();
  if (!white) {
    ctx.strokeStyle = mix('#c9a34a', ACCENT, pulse);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-6, 0); ctx.stroke();
  }
  if (!white) {
    let eg = B.broken ? 1 : 0.62;
    eg *= (1 - 0.8 * B.coreDim);
    if (B.state === 'learn') eg = 1.5 + 0.5 * Math.sin(G.time * 9);   // the ember eyes flare: he is reading you
    const flick = eg * (0.85 + 0.15 * Math.sin(G.time * 13));
    ctx.globalAlpha = alpha * 0.6 * flick;
    ctx.drawImage(GLOW_EMBER, -6, -16, 32, 32);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `rgba(255,232,190,${flick})`;
    ctx.beginPath(); ctx.ellipse(6, -4.6, 3.8, 2, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, 4.6, 3.8, 2, -0.3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // ---- the weapon: a two-handed maul, until he breaks it ----
  ctx.save();
  ctx.scale(1 / shr, 1 / shr);   // the shard does not shrink with the man — it only looks longer now
  ctx.rotate(B.wOff);
  const L = B.wLen;
  if (!B.broken) {
    // thick haft
    ctx.strokeStyle = white ? '#ffffff' : '#4a3b2c';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(10 + L, 0); ctx.stroke();
    ctx.strokeStyle = white ? '#ffffff' : '#31271d';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(10 + L, 0); ctx.stroke();
    // rectangular slab head
    ctx.save();
    ctx.translate(10 + L, 0);
    const hg2 = ctx.createLinearGradient(0, -18, 0, 18);
    hg2.addColorStop(0, '#40434f'); hg2.addColorStop(1, '#23252e');
    ctx.fillStyle = white ? '#ffffff' : hg2;
    ctx.fillRect(-10, -18, 22, 36);
    ctx.strokeStyle = white ? '#ffffff' : '#0a0b10';
    ctx.lineWidth = 2;
    ctx.strokeRect(-10, -18, 22, 36);
    ctx.fillStyle = white ? '#ffffff' : mix('#8f97ab', ACCENT, pulse);
    ctx.fillRect(8, -18, 4.5, 36);       // the bright striking edge
    ctx.fillStyle = white ? '#ffffff' : '#171921';
    ctx.beginPath(); ctx.arc(-4, -9, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-4, 9, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (tele > 0.05) {
      ctx.globalAlpha = alpha * tele * 0.7;
      ctx.drawImage(GLOW_EMBER, 10 + L - 34, -34, 68, 68);
      ctx.globalAlpha = alpha;
    }
  } else {
    // what's left: a splintered haft ending in a long jagged shard
    const hend = 10 + L * 0.45;
    ctx.strokeStyle = white ? '#ffffff' : '#4a3b2c';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(hend, 0); ctx.stroke();
    ctx.strokeStyle = white ? '#ffffff' : '#6b5638';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hend - 2, -2); ctx.lineTo(hend + 7, -6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hend - 1, 2); ctx.lineTo(hend + 5, 6); ctx.stroke();
    ctx.fillStyle = white ? '#ffffff' : mix('#8b8272', ACCENT, pulse * 0.9);
    ctx.beginPath();
    ctx.moveTo(hend, -4);
    ctx.lineTo(hend + L * 0.3, -5);
    ctx.lineTo(10 + L, 0);
    ctx.lineTo(hend + L * 0.34, 4.5);
    ctx.lineTo(hend, 3.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#14110c';
    ctx.lineWidth = 1.3; ctx.stroke();
    if (tele > 0.05) {
      ctx.globalAlpha = alpha * tele * 0.8;
      ctx.drawImage(GLOW_EMBER, 10 + L - 24, -24, 48, 48);
      ctx.globalAlpha = alpha;
    }
  }
  ctx.restore();

  // outline flare while telegraphing
  if (tele > 0.05 && !white) {
    ctx.globalAlpha = alpha * tele * 0.85;
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(30, 0); ctx.lineTo(18, -24); ctx.lineTo(-16, -31);
    ctx.lineTo(-32, -12); ctx.lineTo(-32, 12); ctx.lineTo(-16, 31);
    ctx.lineTo(18, 24);
    ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = alpha;
  }
  // BLEEDING — the scavenged cuts are adding up; a dull red seam
  if (B.bleed > 4 && !white) {
    ctx.globalAlpha = alpha * clamp(B.bleed / (B.hpMax * 0.06), 0.2, 1) * (0.4 + 0.28 * Math.sin(G.time * 8));
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(30, 0); ctx.lineTo(18, -24); ctx.lineTo(-16, -31);
    ctx.lineTo(-32, -12); ctx.lineTo(-32, 12); ctx.lineTo(-16, 31);
    ctx.lineTo(18, 24);
    ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = alpha;
  }
  ctx.restore();

  // THE READ — his eyes flare and a chevron snaps shut over him: he has seen the charge
  if (B.state === 'read') {
    const k = clamp(B.stateT / 0.22, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha * (0.5 + 0.5 * Math.sin(G.time * 34));
    ctx.drawImage(GLOW_EMBER, B.x - 30, B.y - 30, 60, 60);
    ctx.globalAlpha = alpha * (1 - k * 0.4);
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 3;
    const rr2 = 62 - k * 26;                 // a bracket closing in on him
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(B.x + s * rr2, B.y - 20);
      ctx.lineTo(B.x + s * (rr2 - 9), B.y);
      ctx.lineTo(B.x + s * rr2, B.y + 20);
      ctx.stroke();
    }
    ctx.restore();
  }


  // stagger — "STANCE BROKEN" cue, drawn unrotated so it stays readable
  if (stag) {
    ctx.save();
    ctx.globalAlpha = alpha * (0.55 + 0.45 * Math.sin(G.time * 9));
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe9a8';
    ctx.font = '600 13px Georgia, serif';
    ctx.fillText('STANCE BROKEN', B.x, bossHeadY() - 12);
    ctx.globalAlpha = alpha;
    for (let i = 0; i < 3; i++) {
      const a = G.time * 4 + i * 2.1;
      ctx.beginPath(); ctx.arc(B.x + Math.cos(a) * 22, B.y + Math.sin(a) * 10 - B.r - 16, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textAlign = 'left';
    ctx.restore();
  }

  // the break: a burst of light at the moment the haft gives
  if (B.state === 'break' && B.breakStep >= 2) {
    const k = clamp((B.stateT - 1.55) / 0.8, 0, 1);
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.5;
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 5 - 3 * k;
    ctx.beginPath(); ctx.arc(B.x, B.y, 30 + k * 250, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = (1 - k) * 0.4;
    ctx.drawImage(GLOW_EMBER, B.x - 120, B.y - 120, 240, 240);
    ctx.restore();
  }
  // dazed after running into the wall
  if (dazed) {
    ctx.save();
    ctx.fillStyle = '#e6e9f0';
    for (let i = 0; i < 3; i++) {
      const a = G.time * 4 + i * 2.1;
      ctx.globalAlpha = alpha * 0.85;
      ctx.beginPath(); ctx.arc(B.x + Math.cos(a) * 22, bossHeadY() + Math.sin(a) * 9 - 8, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // reeling from a parry — a gold glint marks the opening
  if (B.state === 'recoil' && !dying && !carving) {
    const pu = 0.6 + 0.4 * Math.sin(G.time * 11);
    ctx.save();
    ctx.globalAlpha = alpha * pu;
    ctx.drawImage(GLOW_GOLD, B.x - 14, B.y - 14, 28, 28);
    ctx.translate(B.x, bossHeadY());
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillRect(-3.5, -3.5, 7, 7);
    ctx.restore();
  }

  // BLEEDING floating cue — only once he is close to opening up
  if (B.bleed > 12 && !stag && !dying && !carving) {
    ctx.save();
    ctx.globalAlpha = alpha * (0.5 + 0.4 * Math.sin(G.time * 7));
    ctx.textAlign = 'center';
    ctx.fillStyle = '#d8654e';
    ctx.font = '600 13px Georgia, serif';
    ctx.fillText('BLEEDING', B.x, bossHeadY() - 12);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

function drawDamageNumbers() {
  for (const d of G.dmgNums) {
    const k = d.t / 0.7;
    ctx.save();
    ctx.globalAlpha = (1 - k) * (1 - k);
    ctx.textAlign = 'center';
    ctx.font = '600 ' + (17 - k * 3).toFixed(1) + 'px Georgia, serif';
    const word = typeof d.v === 'string';
    const label = word ? d.v : Math.round(d.v);
    if (word) ctx.font = '600 ' + (14 - k * 2).toFixed(1) + 'px Georgia, serif';
    ctx.fillStyle = '#0a0a0e';
    ctx.fillText(label, d.x + 1, d.y - k * 26 + 1);
    ctx.fillStyle = word ? '#e8c15a' : (d.v >= 50 ? '#ffd98a' : '#f0f3fa');
    ctx.fillText(label, d.x, d.y - k * 26);
    ctx.restore();
  }
  ctx.textAlign = 'left';
}

/* ---------- UI ---------- */
function drawBar(x, y, w, h, frac, col, colTop, ghostFrac, opts) {
  opts = opts || {};
  frac = clamp(frac, 0, 1);
  ctx.fillStyle = 'rgba(6,7,11,0.9)';
  ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  ctx.strokeStyle = opts.frame || 'rgba(148,138,116,0.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 3.5, y - 3.5, w + 7, h + 7);
  ctx.fillStyle = 'rgba(24,22,26,0.95)';
  ctx.fillRect(x, y, w, h);
  if (ghostFrac !== undefined && ghostFrac > frac) {
    ctx.fillStyle = opts.ghostCol || 'rgba(201,163,74,0.75)';
    ctx.fillRect(x + w * frac, y, w * (clamp(ghostFrac, 0, 1) - frac), h);
  }
  if (frac > 0) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, colTop || col); g.addColorStop(0.5, col); g.addColorStop(1, colTop || col);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w * frac, h);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(x, y, w * frac, Math.max(1, h * 0.28));
  }
}

function drawFlask(x, y, s, filled, glow) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (filled && glow) {
    ctx.globalAlpha = 0.55;
    ctx.drawImage(GLOW_GOLD, -16, -16, 32, 32);
    ctx.globalAlpha = 1;
  }
  ctx.beginPath();
  ctx.moveTo(-4, -6); ctx.lineTo(4, -6);
  ctx.quadraticCurveTo(9, 2, 6, 8);
  ctx.lineTo(-6, 8);
  ctx.quadraticCurveTo(-9, 2, -4, -6);
  ctx.closePath();
  if (filled) {
    const g = ctx.createLinearGradient(0, -6, 0, 8);
    g.addColorStop(0, '#ffe08a'); g.addColorStop(1, '#c78d1c');
    ctx.fillStyle = g;
  } else ctx.fillStyle = 'rgba(58,52,40,0.65)';
  ctx.fill();
  ctx.strokeStyle = filled ? 'rgba(70,52,16,0.9)' : 'rgba(90,82,64,0.7)';
  ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = filled ? '#9a7a2a' : 'rgba(58,52,40,0.65)';
  ctx.fillRect(-2.6, -10, 5.2, 4.5);
  ctx.fillStyle = filled ? '#6d4f22' : 'rgba(70,64,50,0.65)';
  ctx.fillRect(-3.2, -13, 6.4, 3.2);
  ctx.restore();
}

function drawHUD() {
  const lowHP = P.hp / P.hpMax < 0.3 && !P.dead && G.screen === 'fight';

  // ---- player vitals ----
  const hpFlash = P.flash > 0 ? 'rgba(255,255,255,0.9)' : null;
  drawBar(26, 26, 268, 15, P.hp / P.hpMax, hpFlash || '#b3202a', hpFlash || '#7a151c', P.hpGhost / P.hpMax);
  const stLow = P.st < 25;
  const stCol = P.stFlash > 0 ? '#e2c14a' : (stLow ? '#7c8f3a' : '#3f9e4d');
  drawBar(26, 48, 214, 11, Math.max(0, P.st) / P.stMax, stCol, P.stFlash > 0 ? '#b89a2c' : '#2c7538');

  // the answering blow — a slow gold seam; lit means a parry buys more than breath
  {
    const k = clamp(P.spGauge / SP_MAX, 0, 1);
    const full = k >= 1;
    ctx.fillStyle = 'rgba(6,7,11,0.8)';
    ctx.fillRect(26, 62, 150, 3);
    ctx.fillStyle = full ? `rgba(255,233,168,${0.8 + 0.2 * Math.sin(G.time * 5)})` : 'rgba(148,120,58,0.8)';
    ctx.fillRect(26, 62, 150 * k, 3);
    if (full) {
      ctx.save();
      ctx.translate(182, 63.5); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#ffe9a8'; ctx.fillRect(-2.8, -2.8, 5.6, 5.6);
      ctx.restore();
    }
  }

  // the blood ritual — a red seam: filling while the blood is unwilling,
  // burning bright while the coat is on the steel
  if (CH().bleed) {
    const ready = P.ritualCd <= 0;
    const k = ready ? 1 : clamp(1 - P.ritualCd / 60, 0, 1);
    ctx.fillStyle = 'rgba(6,7,11,0.8)';
    ctx.fillRect(26, 68, 150, 3);
    if (P.coatT > 0) {
      ctx.fillStyle = `rgba(216,101,78,${0.75 + 0.25 * Math.sin(G.time * 8)})`;
      ctx.fillRect(26, 68, 150 * clamp(P.coatT / 30, 0, 1), 3);
    } else {
      ctx.fillStyle = ready ? `rgba(216,101,78,${0.75 + 0.25 * Math.sin(G.time * 5)})` : 'rgba(120,52,40,0.8)';
      ctx.fillRect(26, 68, 150 * k, 3);
    }
    if (ready && P.coatT <= 0) {
      ctx.save();
      ctx.translate(182, 69.5); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#d8654e'; ctx.fillRect(-2.8, -2.8, 5.6, 5.6);
      ctx.restore();
    }
    // FRENZY — eight small teeth, lighting up as the madness rises
    for (let i = 0; i < 8; i++) {
      const lit = i < P.frenzy;
      const fy2 = 66 + (lit && P.frenzy >= 6 ? Math.sin(G.time * 16 + i * 2) * 1.2 : 0);
      ctx.fillStyle = lit
        ? (P.frenzy >= 8 ? `rgba(240,80,58,${0.7 + 0.3 * Math.sin(G.time * 12 + i)})` : 'rgba(216,101,78,0.9)')
        : 'rgba(90,52,44,0.45)';
      ctx.fillRect(196 + i * 8, fy2, 4, 7);
    }
  } else {
    // RESOLVE — the same slot, but a still, pale seam: discipline holds the line
    const k = clamp(P.resolve / 10, 0, 1);
    ctx.fillStyle = 'rgba(6,7,11,0.8)';
    ctx.fillRect(26, 68, 150, 3);
    if (k > 0) {
      ctx.fillStyle = k >= 1 ? `rgba(200,224,255,${0.8 + 0.2 * Math.sin(G.time * 4)})` : 'rgba(140,172,220,0.85)';
      ctx.fillRect(26, 68, 150 * k, 3);
    }
    if (k >= 1) {
      ctx.save();
      ctx.translate(182, 69.5); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#c8e0ff'; ctx.fillRect(-2.8, -2.8, 5.6, 5.6);
      ctx.restore();
    }
  }

  // flasks
  for (let i = 0; i < P.flaskMax; i++) {
    drawFlask(38 + i * 26, 82, 1, i < P.flasks, i < P.flasks && P.hp / P.hpMax < 0.6);
  }
  ctx.fillStyle = 'rgba(214,207,194,0.75)';
  ctx.font = '11px Georgia, serif';
  ctx.fillText('x' + P.flasks, 38 + P.flaskMax * 26 - 6, 86);

  // low-health pulse vignette
  if (lowHP) {
    const a = 0.16 + 0.1 * Math.sin(G.time * 4.5);
    const v = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 560);
    v.addColorStop(0, 'rgba(150,20,20,0)');
    v.addColorStop(1, `rgba(150,20,20,${a})`);
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- boss banner ----
  if ((B.hp > 0 || B.state === 'dying' || B.state === 'carve')) {
    const bw = W * 0.62, bx = (W - bw) / 2, by = H - 44;
    ctx.textAlign = 'center';
    ctx.font = '600 18px Georgia, "Times New Roman", serif';
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    drawTracked(BD().name, W / 2 + 1, by - 11, 4);
    ctx.fillStyle = B.phase2 ? '#e6b45c' : '#d6cfc2';
    drawTracked(BD().name, W / 2, by - 12, 4);

    drawBar(bx, by, bw, 11, B.hp / B.hpMax, B.phase2 ? '#c02a24' : '#a8242c', '#6d161c', B.hpGhost / B.hpMax,
      { frame: B.phase2 ? 'rgba(230,180,92,0.7)' : 'rgba(148,138,116,0.55)' });

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(bx + bw * 0.5, by - 2, 1, 15);

    if (B.poise > 0.4 && B.state !== 'stagger') {
      const pw = bw * 0.32, px = W / 2 - pw / 2;
      ctx.fillStyle = 'rgba(6,7,11,0.8)';
      ctx.fillRect(px, by + 15, pw, 3);
      ctx.fillStyle = 'rgba(255,233,168,0.85)';
      ctx.fillRect(px, by + 15, pw * clamp(B.poise / BD().poiseMax, 0, 1), 3);
    }
    // the bleed seam — a thin red accent under his health, the pair's only pressure
    if (CH().bleed) {
      ctx.fillStyle = 'rgba(52,26,22,0.85)';
      ctx.fillRect(bx, by + 13, bw, 2.5);
      const k = clamp(B.bleed / (B.hpMax * 0.1), 0, 1);   // full seam = a tenth of his life still owed
      if (k > 0) {
        ctx.fillStyle = `rgba(232,101,78,${0.65 + 0.3 * Math.sin(G.time * 9)})`;
        ctx.fillRect(bx, by + 13, bw * k, 2.5);
      }
    }
    // armor sundered — one gold notch per full-charged blow, kept for the whole fight
    if (B.defBreak > 0) {
      ctx.save();
      const n = Math.min(B.defBreak, 24);
      for (let i = 0; i < n; i++) {
        ctx.fillStyle = 'rgba(232,193,90,0.9)';
        ctx.fillRect(bx + bw - 8 - i * 9, by + 18, 5.5, 7);
      }
      if (B.defBreak > 24) {
        ctx.fillStyle = 'rgba(232,193,90,0.85)';
        ctx.font = '600 10px Georgia, serif';
        ctx.textAlign = 'right';
        ctx.fillText('+' + (B.defBreak - 24), bx + bw - 6 - 24 * 7, by + 26);
      }
      ctx.restore();
    }
    ctx.textAlign = 'left';
  }
}

/* ---------- prompts ---------- */
function promptText(kind) {
  const pad = Input.device === 'pad';
  if (kind === 'confirm') return pad ? 'Press  A / START' : 'Press  ENTER';
  return '';
}

// Both control schemes side by side; the active device's column is lit.
function drawControls(y) {
  const pad = Input.device === 'pad';
  const rows = [
    ['Move', 'Left Stick', 'W A S D'],
    ['Roll', 'B  (tap)', 'Space (tap)'],
    ['Sprint', 'B  (hold)', 'Space (hold)'],
    ['Light attack', 'RB', 'Left Mouse'],
    ['Heavy attack', 'RT', 'Right Mouse'],
    ['Charge it', 'RT  (hold)', 'RMB (hold)'],
    [CH().canBlock ? 'Block (hold)' : 'Blood rite', 'L1', 'Shift'],
    ['Parry', 'L2', 'F'],
    ['Lock-on', 'R3', 'Q'],
    ['Flask', 'X', 'E'],
    ['Pause', 'Start', 'Esc'],
    ['Confirm', 'A / Start', 'Enter'],
    ['Choose', 'Stick / D-pad', 'A   D']
  ];
  const col = pad ? 1 : 2;

  ctx.textAlign = 'center';
  ctx.font = '600 11px Georgia, serif';
  ctx.fillStyle = 'rgba(201,163,74,0.75)';
  ctx.fillText(pad ? 'CONTROLLER' : 'KEYBOARD', W / 2, y - 12);
  ctx.strokeStyle = 'rgba(148,138,116,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - 250, y - 5); ctx.lineTo(W / 2 + 250, y - 5); ctx.stroke();

  const half = Math.ceil(rows.length / 2);
  rows.forEach((r, i) => {
    const g = i < half ? 0 : 1;
    const cx = g === 0 ? W / 2 - 118 : W / 2 + 148;
    const ry = y + 10 + (i - g * half) * 17;
    ctx.textAlign = 'right';
    ctx.font = '12px Georgia, serif';
    ctx.fillStyle = 'rgba(214,207,194,0.6)';
    ctx.fillText(r[0], cx, ry);
    ctx.textAlign = 'left';
    ctx.font = '600 12px Georgia, serif';
    ctx.fillStyle = 'rgba(232,226,208,0.9)';
    ctx.fillText(r[col], cx + 12, ry);
  });
  ctx.textAlign = 'left';
}

/* ---------- who walks through the fog ----------
   The same man arrives by two different roads. Neither is a better version of the
   other; they are simply not the same problem for Aldric to solve. */
function drawCharSelect(y) {
  for (let i = 0; i < CHARS.length; i++) {
    const c = CHARS[i];
    const sel = i === G.charIdx;
    const cx = W / 2 + (i === 0 ? -180 : 180);
    const cw = 300, chh = 168;
    const x0 = cx - cw / 2;

    ctx.save();
    ctx.fillStyle = sel ? 'rgba(14,16,22,0.8)' : 'rgba(9,10,14,0.55)';
    ctx.fillRect(x0, y, cw, chh);
    ctx.strokeStyle = sel ? c.accent : 'rgba(120,116,106,0.28)';
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(x0 + 0.5, y + 0.5, cw - 1, chh - 1);
    if (sel) {
      ctx.globalAlpha = 0.16 + 0.06 * Math.sin(G.time * 3);
      ctx.drawImage(c.id === 'pair' ? GLOW_RED : GLOW_BLUE, cx - 110, y + 6, 220, 130);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // the figure, at the scale you will actually see them
    ctx.save();
    ctx.translate(cx, y + 62);
    ctx.rotate(-Math.PI / 2);         // seen from above, facing up out of the card
    ctx.scale(2.15, 2.15);
    ctx.globalAlpha = sel ? 1 : 0.5;
    if (!sel) {                       // unchosen, they are only a shape in the fog
      ctx.filter = 'grayscale(1) brightness(0.5)';
    }
    if (c.id === 'pair') drawPairBody(false); else drawBladeBody(false);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '600 15px Georgia, serif';
    ctx.fillStyle = sel ? '#f2ece0' : 'rgba(180,174,162,0.45)';
    drawTracked(c.name, cx, y + 122, 2.5);
    ctx.font = 'italic 12.5px Georgia, serif';
    ctx.fillStyle = sel ? 'rgba(214,207,194,0.8)' : 'rgba(160,154,144,0.35)';
    wrapText(c.line, cx, y + 143, cw - 34, 15);
    ctx.restore();

    if (sel) {                        // the chevrons point at the one you have
      ctx.save();
      const bob = Math.sin(G.time * 4) * 2;
      ctx.fillStyle = c.accent;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(x0 - 12 - bob, y + chh / 2); ctx.lineTo(x0 - 22 - bob, y + chh / 2 - 7);
      ctx.lineTo(x0 - 22 - bob, y + chh / 2 + 7); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x0 + cw + 12 + bob, y + chh / 2); ctx.lineTo(x0 + cw + 22 + bob, y + chh / 2 - 7);
      ctx.lineTo(x0 + cw + 22 + bob, y + chh / 2 + 7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  ctx.textAlign = 'left';
}

function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' ');
  let line = '', ly = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, cx, ly); line = w; ly += lh; }
    else line = t;
  }
  if (line) ctx.fillText(line, cx, ly);
}

function drawTitle() {
  // the same room, seen the same way, behind the name of the place
  ctx.drawImage(WALL_BAKE, 0, 0);
  ctx.save();
  ctx.translate(0, HORIZON); ctx.scale(1, SQUASH); ctx.translate(0, -HORIZON);
  drawFloor(); drawFogWall();
  ctx.restore();
  ctx.fillStyle = 'rgba(5,6,10,0.74)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  const tg = ctx.createRadialGradient(W / 2, 96, 10, W / 2, 96, 300);
  tg.addColorStop(0, 'rgba(255,158,44,0.13)');
  tg.addColorStop(1, 'rgba(255,158,44,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, 220);

  ctx.font = '600 50px Georgia, "Times New Roman", serif';
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillText('THE  ASHEN  GATE', W / 2 + 2, 98);
  const tgrad = ctx.createLinearGradient(0, 68, 0, 108);
  tgrad.addColorStop(0, '#f2ece0'); tgrad.addColorStop(1, '#a2916f');
  ctx.fillStyle = tgrad;
  ctx.fillText('THE  ASHEN  GATE', W / 2, 96);

  ctx.strokeStyle = 'rgba(201,163,74,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - 190, 114); ctx.lineTo(W / 2 - 14, 114); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2 + 14, 114); ctx.lineTo(W / 2 + 190, 114); ctx.stroke();
  ctx.fillStyle = 'rgba(201,163,74,0.8)';
  ctx.save(); ctx.translate(W / 2, 114); ctx.rotate(Math.PI / 4); ctx.fillRect(-4, -4, 8, 8); ctx.restore();

  ctx.font = 'italic 16px Georgia, serif';
  ctx.fillStyle = 'rgba(214,207,194,0.72)';
  ctx.fillText('a boss duel', W / 2, 136);

  drawCharSelect(156);
  drawControls(360);

  const blink = 0.55 + 0.45 * Math.sin(G.time * 3);
  ctx.textAlign = 'center';
  ctx.globalAlpha = blink;
  ctx.fillStyle = '#e8e2d0';
  ctx.font = '600 18px Georgia, serif';
  ctx.fillText(promptText('confirm') + '  to traverse the fog', W / 2, 508);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawIntro() {
  drawWorld();
  const k = clamp(G.screenT / 1.5, 0, 1);
  ctx.fillStyle = `rgba(150,165,205,${0.55 * (1 - k)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(5,6,10,${0.5 * (1 - k)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.globalAlpha = clamp((G.screenT - 0.3) / 0.7, 0, 1);
  ctx.fillStyle = '#d6cfc2';
  ctx.font = '600 34px Georgia, "Times New Roman", serif';
  drawTracked(BD().name, W / 2, H / 2 - 12, 10);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawDead() {
  drawWorld();
  const t = G.screenT;
  // let him actually fall before the dark takes the screen
  ctx.fillStyle = `rgba(0,0,0,${clamp((t - 1.7) / 1.5, 0, 0.8)})`;
  ctx.fillRect(0, 0, W, H);
  const a = clamp((t - 2.0) / 1.4, 0, 1);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.translate(W / 2, H / 2);
  const grow = 1 + 0.05 * clamp(t / 2, 0, 1);
  ctx.scale(grow, grow);
  ctx.globalAlpha = a * 0.75;
  const band = ctx.createLinearGradient(-W / 2, 0, W / 2, 0);
  band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(0.5, 'rgba(0,0,0,0.85)'); band.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = band;
  ctx.fillRect(-W / 2, -46, W, 92);
  ctx.globalAlpha = a;
  ctx.font = '600 74px Georgia, "Times New Roman", serif';
  const dg = ctx.createLinearGradient(0, -34, 0, 26);
  dg.addColorStop(0, '#a81c1c'); dg.addColorStop(1, '#5e0d0d');
  ctx.fillStyle = dg;
  ctx.fillText('YOU DIED', 0, 14);
  ctx.restore();
  if (t > 3.0) {          // he can be skipped from 2.1s; the prompt waits for the ash
    const blink = 0.5 + 0.5 * Math.sin(G.time * 3);
    ctx.textAlign = 'center';
    ctx.globalAlpha = blink;
    ctx.fillStyle = '#cfc8ba';
    ctx.font = '18px Georgia, serif';
    ctx.fillText(promptText('confirm') + '  to try again', W / 2, H / 2 + 90);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

function drawVictory() {
  drawWorld();
  const t = G.screenT;
  ctx.fillStyle = `rgba(0,0,0,${clamp(t / 1.4, 0, 0.7)})`;
  ctx.fillRect(0, 0, W, H);
  const a = clamp((t - 0.3) / 1.4, 0, 1);
  ctx.textAlign = 'center';
  ctx.globalAlpha = a * 0.55;
  const bloom = ctx.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, 420);
  bloom.addColorStop(0, 'rgba(232,193,90,0.5)');
  bloom.addColorStop(0.4, 'rgba(232,193,90,0.12)');
  bloom.addColorStop(1, 'rgba(232,193,90,0)');
  ctx.fillStyle = bloom;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(255,226,150,0.7)';
  for (let i = 0; i < 26; i++) {
    const ph = (G.time * (26 + (i % 4) * 9) + i * 53) % 340;
    ctx.globalAlpha = a * clamp(1 - ph / 340, 0, 1) * 0.8;
    ctx.fillRect(W / 2 - 220 + ((i * 97) % 440) + Math.sin(G.time + i) * 8, H / 2 + 150 - ph, 2, 2);
  }
  ctx.globalAlpha = a;
  ctx.font = '600 54px Georgia, "Times New Roman", serif';
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillText('GREAT ENEMY FELLED', W / 2 + 2, H / 2 + 14);
  const vg = ctx.createLinearGradient(0, H / 2 - 26, 0, H / 2 + 22);
  vg.addColorStop(0, '#f7e2a2'); vg.addColorStop(0.5, '#e8c15a'); vg.addColorStop(1, '#b8862c');
  ctx.fillStyle = vg;
  ctx.fillText('GREAT ENEMY FELLED', W / 2, H / 2 + 12);
  ctx.globalAlpha = 1;
  if (t > 2.3) {
    const blink = 0.5 + 0.5 * Math.sin(G.time * 3);
    ctx.globalAlpha = blink;
    ctx.fillStyle = '#cfc8ba';
    ctx.font = '18px Georgia, serif';
    ctx.fillText(promptText('confirm') + '  to challenge ' + BD().name + ' again', W / 2, H / 2 + 84);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function drawWorld() {
  // the camera lives here; the HUD is drawn afterwards in screen space
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(G.cam.zoom, G.cam.zoom);
  ctx.translate(-G.cam.x, -G.cam.y);
  // the ground lies down; whatever stands on it will push back up
  // the far wall, standing straight up — and still ringing if he ran into it
  const wj = (G.wallHit || 0);
  if (wj > 0) {
    ctx.save();
    ctx.translate(Math.sin(G.time * 70) * wj * 7, Math.sin(G.time * 53) * wj * 4);
    ctx.drawImage(WALL_BAKE, 0, 0);
    ctx.restore();
  } else ctx.drawImage(WALL_BAKE, 0, 0);

  ctx.save();
  ctx.translate(0, HORIZON); ctx.scale(1, SQUASH); ctx.translate(0, -HORIZON);

  drawFloor();
  drawDebris();
  drawShedPlates();
  drawFissures();
  drawCarving();
  drawSlashes();
  drawRings();
  // draw whichever is further "back" first, so overlap reads correctly
  if (B.y <= P.y) { drawBoss(); drawPlayer(); } else { drawPlayer(); drawBoss(); }
  drawParticles();
  drawDamageNumbers();
  drawFogWall();
  ctx.restore();                           // done with the floor plane

  // the slab has a thickness — the lip of it, standing up at the near edge
  {
    const fy = projY(ARENA.y + ARENA.h);
    const kg = ctx.createLinearGradient(0, fy, 0, fy + 14);
    kg.addColorStop(0, '#23262f'); kg.addColorStop(1, '#0a0b10');
    ctx.fillStyle = kg;
    ctx.fillRect(ARENA.x - 6, fy, ARENA.w + 12, 14);
    ctx.fillStyle = 'rgba(255,158,44,0.07)';        // the braziers just reach it
    ctx.fillRect(ARENA.x - 6, fy, ARENA.w + 12, 2);
  }

  // the near edge of the room, falling away into the dark under your feet
  const ne = ctx.createLinearGradient(0, projY(ARENA.y + ARENA.h) + 12, 0, H);
  ne.addColorStop(0, 'rgba(0,0,0,0)'); ne.addColorStop(1, 'rgba(0,0,0,0.92)');
  ctx.fillStyle = ne;
  ctx.fillRect(-40, projY(ARENA.y + ARENA.h) + 12, W + 80, H);

  const v = ctx.createRadialGradient(W / 2, H / 2, 220, W / 2, H / 2, 560);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.34)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();

  // at full frenzy the edges of the world breathe red — he is barely in it
  if (CH().id === 'pair' && P.frenzy >= 7 && G.screen === 'fight' && !P.dead) {
    const hz = (P.frenzy >= 8 ? 0.1 : 0.05) * (0.75 + 0.25 * Math.sin(G.time * 5.2));
    const rg = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 560);
    rg.addColorStop(0, 'rgba(160,30,20,0)');
    rg.addColorStop(1, `rgba(160,30,20,${hz})`);
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }

  // the world slows and desaturates on the killing blow
  if (G.slowmo > 0) {
    ctx.fillStyle = `rgba(10,8,14,${0.22 * clamp(G.slowmo / 0.55, 0, 1)})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
}

function render() {
  // shake offset applies to the world transform
  let ox = 0, oy = 0;
  if (G.shake > 0.2) { ox = rand(-G.shake, G.shake); oy = rand(-G.shake, G.shake); }
  ctx.setTransform(RS, 0, 0, RS, ox * RS, oy * RS);
  ctx.clearRect(-20, -20, W + 40, H + 40);

  switch (G.screen) {
    case 'title': drawTitle(); break;
    case 'intro': drawIntro(); break;
    case 'refade': {
      drawWorld();
      const k = 1 - clamp(G.screenT / 0.45, 0, 1);
      ctx.fillStyle = `rgba(5,6,10,${k})`;
      ctx.fillRect(0, 0, W, H);
      break;
    }
    case 'fight': drawWorld(); if (G.paused) drawPause(); break;
    case 'dead': drawDead(); break;
    case 'victory': drawVictory(); break;
  }
  drawAudioNotice();
}

// A demo must never be silently silent: browsers refuse to start audio
// until a key, click or tap — a gamepad press does not count.
function drawAudioNotice() {
  if (AudioSys.ready()) return;
  if (G.screen === 'title') {
    const bl = 0.6 + 0.4 * Math.sin(G.time * 3.4);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = bl;
    ctx.fillStyle = '#e8c15a';
    ctx.font = '600 14px Georgia, serif';
    ctx.fillText('press a key or click once to wake the sound', W / 2, 531);
    ctx.restore();
  } else {
    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.translate(W - 34, 30);
    ctx.fillStyle = '#cfc8ba';
    ctx.beginPath();
    ctx.moveTo(-8, -3); ctx.lineTo(-4, -3); ctx.lineTo(0, -8);
    ctx.lineTo(0, 8); ctx.lineTo(-4, 3); ctx.lineTo(-8, 3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#c0503a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(4, -6); ctx.lineTo(12, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -6); ctx.lineTo(4, 6); ctx.stroke();
    ctx.restore();
  }
}

function drawPause() {
  ctx.save();
  ctx.fillStyle = 'rgba(4,5,8,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const lost = G.padLost && !Input.pad;
  ctx.fillStyle = '#e6e0d0';
  ctx.font = '600 34px Georgia, "Times New Roman", serif';
  drawTracked(lost ? 'CONTROLLER LOST' : 'PAUSED', W / 2, H / 2 - 6, 9);
  ctx.font = '15px Georgia, serif';
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(G.time * 3);
  ctx.fillStyle = '#cfc8ba';
  ctx.fillText(lost ? 'reconnect it to continue'
    : (Input.device === 'pad' ? 'START to resume' : 'ESC to resume'), W / 2, H / 2 + 30);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  ctx.restore();
}

/* =========================================================================
   MAIN LOOP — requestAnimationFrame + delta time (framerate independent)
   ========================================================================= */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - lastT) / 1000;
  lastT = now;
  if (rdt > 0.05) rdt = 0.05;
  if (rdt <= 0) return;

  Input.poll(rdt);

  // pause — only in the fight, and a lost controller pauses on your behalf
  if (G.screen === 'fight' && Input.pause) {
    if (!(G.paused && G.padLost && !Input.pad)) G.paused = !G.paused;
  }
  if (G.padLost && Input.pad) G.padLost = 0;
  if (G.screen !== 'fight') G.paused = false;
  if (G.paused) { G.time += rdt; render(); return; }   // time advances so the overlay animates
  if (G.hitstop > 0) {           // hitstop: freeze the world, keep rendering
    G.hitstop -= rdt;
    updateCamera(rdt);
    render();
    return;
  }
  // the killing blow dilates time — the camera and the fade keep real time
  let dt = rdt;
  if (G.slowmo > 0) {
    G.slowmo = Math.max(0, G.slowmo - rdt);
    dt = rdt * 0.22;
    if (G.slowmo <= 0) AudioSys.duck(0.45, 0.5);
  }
  update(dt);
  updateCamera(rdt);
  render();
}
requestAnimationFrame(frame);

/* test/debug hook (harmless in normal play) */
window.__game = { G, P, B, Input, sfx, AudioSys, resetFight, damagePlayer, damageBoss, breakPoise, addBleed, camKick, onParrySuccess, bossStartAttack, ATK1, ATK2, BOSSES, BD, BPH, CHARS, CH, SP_MAX, HABITS, SQUASH, HORIZON, projY, startCarve };
</script>
