        // the follow-up window opens when the swing ENDS — a long smash must
        // still be answerable by its own reap
        if (heavy) P.hchainT = 0.75; else P.chainT = 0.6;
        if (P.actQueue) { Input.setBuffer(P.actQueue); P.actQueue = null; }
      }
    } else if (a.type === 'parry') {
      speedMul = 0;
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'special') {
      speedMul = 0;
      if (CH().id === 'pair') {
        /* he goes THROUGH him — eight stabs, alternating hands, and out */
        if (a.t < 0.3) { P.x += Math.cos(a.face) * 300 * dt; P.y += Math.sin(a.face) * 300 * dt; }
        const due = Math.min(8, Math.floor((a.t - 0.08) / 0.065) + 1);
        while (a.stabs < due && a.t >= 0.08) {
          a.stabs++;
          const last = a.stabs === 8;
          damageBoss(last ? 19 : 13, true);             // 7×13 + 19 = 110
          G.hitstop = Math.max(G.hitstop, last ? 0.09 : 0.018);
          const hx = B.x + rand(-14, 14), hy = B.y + rand(-14, 14);
          spawnParticles(hx, hy, last ? 16 : 4, last ? '#ffe9a8' : '#e8ddc8', last ? 300 : 220, last ? 0.5 : 0.25);
          if (last) { sfx.stab(); rumble(200, 0.7, 0.9); }
          else if (a.stabs % 2) sfx.swing(false, true);
          if (B.state === 'recoil') B.stateT = Math.min(B.stateT, 0.15);
        }
      } else {
        /* he steps in and drives the given blade down through the opening */
        if (a.t < 0.12) { P.x += Math.cos(a.face) * 260 * dt; P.y += Math.sin(a.face) * 260 * dt; }
        if (!a.hitDone && a.t >= 0.16) {
          a.hitDone = true;
          damageBoss(110, true);
          sfx.stab();
          G.hitstop = Math.max(G.hitstop, 0.13);
          G.shake = Math.max(G.shake, 10);
          rumble(220, 0.7, 0.9);
          const hx = B.x - Math.cos(a.face) * B.r * 0.5, hy = B.y - Math.sin(a.face) * B.r * 0.5;
          spawnParticles(hx, hy, 26, '#ffe9a8', 280, 0.6);
          spawnParticles(hx, hy, 10, '#dceaff', 340, 0.35);
          if (B.state === 'recoil') {
            B.stateT = Math.min(B.stateT, 0.15);
            B.x += Math.cos(a.face) * 20; B.y += Math.sin(a.face) * 20;
            B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
            B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
          }
        }
      }
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'clashed' || a.type === 'deflected') {
      // knocked off the bind — nothing cancels this, not even the dash
      speedMul = 0;
      P.z = Math.max(0, (P.z || 0) - 90 * dt);   // and comes back down through the recovery
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'flask') {
      speedMul = 0.42;
      P.hp = Math.min(P.hpMax, P.hp + 45 * dt / 1.0);
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'hurt') {
      speedMul = 0;
      if (a.t >= a.dur) P.act = null;
    }
  }

  /* ---- movement ---- */
  P.speedNow = 0;
  if (speedMul > 0 || !P.act) {
    const quick = C.id === 'pair' ? 1 + 0.02 * P.frenzy : 1;
    const base = (sprinting ? C.speed * 1.5 : (P.blocking ? C.speed * 0.55 : C.speed)) * quick;
    const sp = base * mag * (P.act ? speedMul : 1);
    P.x += mvX * sp * dt; P.y += mvY * sp * dt;
    P.walkT += sp * dt * 0.05;
    P.speedNow = sp;
    if (sp > 220 && Math.random() < dt * 9) {
      spawnDrift(P.x - mvX * 10, P.y - mvY * 10 + 6, -mvX * rand(14, 34), rand(-14, -3), 'rgba(150,146,138,0.4)', rand(0.3, 0.5), rand(1.4, 2.2));
    }
    // closing distance reads as aggression
    if (mag > 0.01) {
      const ux = B.x - P.x, uy = B.y - P.y, ul = Math.hypot(ux, uy) || 1;
      if ((mvX * ux + mvY * uy) / ul * sp > 70) G.lastAggro = G.time;
    }
  }

  P.blockStun = Math.max(0, P.blockStun - dt);
  P.chainT = Math.max(0, P.chainT - dt);
  P.hchainT = Math.max(0, P.hchainT - dt);
  P.spGauge = Math.min(SP_MAX, P.spGauge + dt);   // the answering blow, slowly owed again      // the chain lapses if you stop swinging

  /* ---- stamina regen: delayed, never while sprinting or mid-action ---- */
  P.stDelay = Math.max(0, P.stDelay - dt);
  const regen = 25 * (1 + (CH().id === 'blade' ? 0.035 * P.resolve : 0));
  if (P.stDelay <= 0 && !sprinting && !P.act) P.st = Math.min(P.stMax, P.st + regen * (P.blocking ? 0.4 : 1) * dt);

  // clamp to arena
  P.x = clamp(P.x, ARENA.x + P.r, ARENA.x + ARENA.w - P.r);
  P.y = clamp(P.y, ARENA.y + P.r, ARENA.y + ARENA.h - P.r);

  // body separation vs boss
  if (B.state !== 'dying' && B.state !== 'carve') {
    const d = dist(P.x, P.y, B.x, B.y), minD = P.r + B.r - 4;
    if (d < minD && d > 0.001) {
      const a = Math.atan2(P.y - B.y, P.x - B.x);
      P.x = B.x + Math.cos(a) * minD; P.y = B.y + Math.sin(a) * minD;
      P.x = clamp(P.x, ARENA.x + P.r, ARENA.x + ARENA.w - P.r);
      P.y = clamp(P.y, ARENA.y + P.r, ARENA.y + ARENA.h - P.r);
    }
  }
}

/* =========================================================================
   BOSS UPDATE
   ========================================================================= */
function currentSet() { return BPH().set; }
function bossStartAttack(name) {
  // he has seen you dive at the stuck maul five times; sometimes now the struggle is theatre
  B.buriedFake = name === 'buried' && HABITS.has('punish') && Math.random() < 0.45;
  const set = currentSet();
  B.atk = name; B.atkSet = B.phase2 ? 2 : 1;
  B.setRef = set;                       // the swing belongs to the set it was drawn from
  B.phaseIdx = 0; B.phaseT = 0; B.hitDone = false;
  B.phaseStarted = false; B.impacted = false;
  B.state = 'attack'; B.stateT = 0;
  B.phaseDur = set[name].phases[0].d;   // no blanket multipliers — each moveset owns its pacing
}
function pickWeighted(pool) {
  let tot = 0; for (const p of pool) tot += p[1];
  let r = Math.random() * tot;
  for (const p of pool) { r -= p[1]; if (r <= 0) return p[0]; }
  return pool[0][0];
}
/* He fights the person in front of him, and he does not fight them the same way.
   Against the one carrying his own sword he plays the distance and punishes the
   commitment; against the two knives he stops trying to catch him and simply
   fills the ground he wants to stand on. Nothing in the game says so out loud. */
function chooseAttack1(d) {
  const pair = CH().id === 'pair';
  if (!pair && d > 260 && Math.random() < 0.8) return 'charge';
  if (pair && d > 300 && Math.random() < 0.6) return 'charge';
  // what he has learned bends the odds — the attacks themselves never change
  const spc = HABITS.has('spacing') ? HABITS.spacingKind() : null;
  const guard = HABITS.has('block');
  return pickWeighted([
    ['slam',   (pair ? 1.9 : 0.7) * (spc === 'near' ? 1.6 : 1) * (guard ? 1.3 : 1)],
    ['buried', (pair ? 1.1 : 0.6) * (spc === 'near' ? 1.4 : 1)],
    ['spin',   pair ? 1.6 : 0.7],                       // he likes standing beside him; the spin says no
    ['sweep',  (pair ? (d < 170 ? 1.0 : 0.3) : (d < 150 ? 1.5 : 0.55)) * (guard ? 1.8 : 1)],
    ['charge', (pair ? 0.05 : (d > 190 ? 0.9 : 0.15)) * (spc === 'far' ? 2.2 : 1)]
  ]);
}
function chooseAttack2(d) {
  const pair = CH().id === 'pair';
  // out of his reach = you're backpedaling, and the step-through hunts backpedalers
  if (!pair && d > 160 && Math.random() < 0.65) return 'step';
  if (pair && d > 200 && Math.random() < 0.4) return 'step';
  return pickWeighted([
    ['thrust', 1.0],
    ['step',   pair ? (d > 170 ? 0.9 : 0.35) : (d > 150 ? 2.0 : 1.1)],
    ['feint',  (pair ? 1.3 : 0.6) * (P.frenzy >= 6 ? 1.8 : 1)],   // and a frenzied man falls for anything
    ['flurry', pair ? 1.7 : 0.5],                       // three cuts cover three places at once
    ['rising', (pair ? 0.4 : 1.4) * (HABITS.has('block') ? 1.7 : 1)]   // the rising tear catches a slow guard
  ]);
}

/* how close he wants to stand: right on top of the knives, at arm's length of the sword */
function preferredGap() { return CH().id === 'pair' ? 0.82 : 1.18; }


/* =========================================================================
   ALDRIC — the beats that are his alone. The driver in updateBoss() knows
   nothing about any of this; it only knows to ask the definition whether
   the current state belongs to the boss rather than to the engine.
   ========================================================================= */

/* ---- THE CARVING — the ending ---- */
function aldricCarve(dt, angToP) {
  const cv = G.carve;
  if (!cv) return;
  cv.t += dt;
  if (cv.phase === 'fall') {
    // he goes down where he stood: knees, then forward onto the stone
    B.wOff = lerp(B.wOff, 1.5, 3 * dt); B.wLen = lerp(B.wLen, 44, 3 * dt);
    if (!cv.thudDone && cv.t >= 0.95) {
      cv.thudDone = true;
      sfx.bodyFall();
      G.shake = Math.max(G.shake, 9);
      rumble(300, 0.8, 0.4);
      spawnParticles(B.x, B.y + 8, 26, 'rgba(150,146,138,0.6)', 150, 0.9);
    }
    if (cv.t > 1.9) { cv.phase = 'carving'; cv.t = 0; }
  } else if (cv.phase === 'carving') {
    cv.progress = Math.min(0.93, cv.t / 3.6);      // the final glyph is never finished
    cv.scrapeT -= dt;
    if (cv.scrapeT <= 0 && cv.progress < 0.93) { cv.scrapeT = rand(0.3, 0.45); sfx.scrapeOne(); }
    if (cv.progress < 0.93 && Math.random() < dt * 18) {
      const si = Math.floor(cv.progress * cv.strokes.length);
      const st2 = cv.strokes[Math.min(si, cv.strokes.length - 1)];
      const gx = cv.x - 64 + st2.g * 16;
      spawnDrift(gx + st2.s[2], cv.y + 26 + st2.s[3], rand(-20, 20), rand(-30, -6), ACCENT, rand(0.15, 0.4), 1.5);
      spawnDrift(gx + st2.s[2], cv.y + 26 + st2.s[3], rand(-12, 12), rand(-16, -2), 'rgba(170,164,152,0.6)', rand(0.3, 0.6), 1.5);
    }
    if (cv.t > 4.4) { cv.phase = 'drop'; cv.t = 0; }
  } else if (cv.phase === 'drop') {
    B.wOff = lerp(B.wOff, 1.7, 3 * dt); B.wLen = lerp(B.wLen, 40, 3 * dt);   // the shard drags off
    if (cv.t > 0.8) { cv.phase = 'still'; cv.t = 0; }
  } else if (cv.phase === 'still') {
    if (cv.t > 1.4) { cv.phase = 'dissolve'; cv.t = 0; AudioSys.duck(0.45, 2.0); }
  } else if (cv.phase === 'dissolve') {
    // and then there is no one there
    if (Math.random() < dt * 46) {
      spawnDrift(B.x + rand(-30, 30), B.y + rand(-24, 24), rand(-14, 14), rand(-52, -20),
        Math.random() < 0.5 ? ACCENT : 'rgba(196,190,176,0.55)', rand(0.6, 1.4), rand(1.4, 2.8));
    }
    if (cv.t > 2.2 && G.screen === 'fight') goto('victory');
  }
  return;
}

/* ---- THE BREAK — a decision, not an injury ---- */
function aldricBreak(dt, angToP) {
  const t = B.stateT;
  if (t < 0.9) {                       // staggers back, plants the hammer head-down, goes still
    if (t < 0.4) { B.x -= Math.cos(angToP) * 55 * dt; B.y -= Math.sin(angToP) * 55 * dt; }
    B.wOff = lerp(B.wOff, 1.45, 5 * dt); B.wLen = lerp(B.wLen, 86, 5 * dt);
    B.breakStep = 0;
  } else if (t < 1.55) {               // down on one knee, haft across the thigh
    B.breakStep = 1;
    B.wOff = lerp(B.wOff, 0.1, 7 * dt); B.wLen = lerp(B.wLen, 70, 7 * dt);
  } else {
    if (B.breakStep < 2) {             // the CRACK
      B.breakStep = 2;
      B.broken = true;
      AudioSys.duck(0.45, 0.05);
      sfx.crack();
      G.shake = Math.max(G.shake, 16);
      rumble(900, 1.0, 1.0);
      const da = angToP + rand(1.8, 2.6) * (Math.random() < 0.5 ? 1 : -1);
      G.debris = {
        x: B.x + Math.cos(B.face) * 20, y: B.y + Math.sin(B.face) * 20,
        vx: Math.cos(da) * 260, vy: Math.sin(da) * 260,
        rot: rand(0, Math.PI * 2), vr: rand(-9, 9), settleT: 0.7
      };
      spawnParticles(B.x, B.y, 26, '#8a7a62', 240, 0.7);
      spawnParticles(B.x, B.y, 16, ACCENT, 200, 0.8);
    }
    if (t < 2.35) {                    // core flares to maximum; cracks spread
      B.wOff = lerp(B.wOff, 0.3, 6 * dt); B.wLen = lerp(B.wLen, 34, 6 * dt);
    } else if (t < 3.05) {             // he rises differently: low, blade forward and level
      if (B.breakStep < 3) {
        B.breakStep = 3;
        // the pauldrons come off — unbuckled, not torn. Nothing that heavy is
        // coming with him into the second half of this.
        for (const sy of [-1, 1]) {
          G.shedPlates.push({
            x: B.x + Math.cos(B.face + sy * 1.9) * 34 + rand(-6, 6),
            y: B.y + Math.sin(B.face + sy * 1.9) * 34 + rand(2, 12),
            rot: rand(0, Math.PI * 2)
          });
        }
        sfx.swordDrop();               // steel meeting stone
        G.shake = Math.max(G.shake, 6);
        spawnParticles(B.x, B.y, 18, '#98a3ba', 190, 0.6);
        spawnParticles(B.x, B.y, 10, 'rgba(150,146,138,0.6)', 130, 0.8);
      }
      B.wOff = lerp(B.wOff, 0.12, 6 * dt); B.wLen = lerp(B.wLen, 58, 6 * dt);
    } else {
      B.phase2 = true;
      B.r = BD().phases[1].r;          // out of the armor he is barely bigger than you are
      G.barLifted = true;              // the bar rests against the frame from here on
      G.cinematic = false;
      B.state = 'idle'; B.cd = 0.7; B.chainCount = 0;
    }
  }
  B.tele = 0;
  return;
}

/* ---- THE HESITATION — exactly once; nothing speeds up afterward ---- */
function aldricHesitate(dt, angToP) {
  const t = B.stateT;
  if (t < 0.5) {
    const k = t / 0.5;
    B.wOff = lerp(0.35, 0.05, k); B.wLen = lerp(58, 34, k);
    B.tele = k * 0.85;
    B.face = turnToward(B.face, angToP, 1.6 * dt);
  } else if (t < 1.15) {               // held at the top — and nothing comes
    B.tele = 0;
    B.coreDim = Math.min(1, B.coreDim + 4 * dt);
    if (!B.mourned) { B.mourned = true; sfx.mourn(); }
  } else if (t < 2.45) {               // the blade comes down, unswung
    const k = (t - 1.15) / 1.3;
    B.wOff = lerp(0.05, 1.35, k); B.wLen = lerp(34, 58, k);
    B.coreDim = 1;
  } else {
    B.hesitated = true;
    B.state = 'idle'; B.cd = 0.7;
  }
  return;
}

/* ---- THE READ — he sees the charge coming ---- */
function aldricRead(dt, angToP) {
  B.tele = 0.55 + 0.45 * Math.sin(G.time * 34);   // a sharp, unmistakable flicker
  B.face = turnToward(B.face, angToP, 6 * dt);
  B.wOff = lerp(B.wOff, -0.4, 11 * dt); B.wLen = lerp(B.wLen, 62, 11 * dt);
  // he closes the last of the gap as he commits, so the charge is never safe
  if (dist(B.x, B.y, P.x, P.y) > 120) {
    B.x += Math.cos(angToP) * 190 * dt; B.y += Math.sin(angToP) * 190 * dt;
  }
  if (B.stateT >= 0.22) { B.chainCount = 1; bossStartAttack('punish'); }
  return;
}

/* ---- PHASE ONE: the reactive stance. He will not start this fight. ---- */
function aldricIdleMaul(dt, angToP, d) {
  /* REACTIVE STANCE — phase 1 only. No aggression, no fight. */
  const passive = G.time - G.lastAggro > 1.4;
  B.guarding = passive;
  B.wOff = lerp(B.wOff, passive ? 1.05 : 0.5, 4 * dt);
  B.wLen = lerp(B.wLen, 86, 4 * dt);
  B.face = turnToward(B.face, angToP, 3.0 * dt);
  /* he knows when you drink: as your health nears the number he has
     memorized, he stops waiting — the same feet, pointed at you sooner */
  const thirsty = HABITS.has('flask') && P.hp / P.hpMax < HABITS.flaskAt() + 0.05;
  if (HABITS.has('flask') && P.act && P.act.type === 'flask' && d < 260) B.cd = Math.min(B.cd, 0.05);
  if (HABITS.has('charge') && P.act && P.act.charging && P.act.chargeT > 0.2) B.cd = Math.min(B.cd, 0.3);
  if (B.hopT > 0) {                    // the disengaging step
    B.hopT -= dt;
    B.x -= Math.cos(angToP) * 240 * dt; B.y -= Math.sin(angToP) * 240 * dt;
    if (Math.random() < dt * 20) spawnDrift(B.x - Math.cos(angToP) * 20, B.y + 8, rand(-8, 8), rand(-14, -4), 'rgba(150,146,138,0.4)', 0.4, 2);
  }
  const gap = preferredGap() * (thirsty ? 0.55 : 1);
  if (d > (passive ? 250 : 165) * gap) {
    const sp = d > 300 ? 162 : 112;
    const weave = Math.sin(G.time * 1.4 + B.weaveSeed) * 0.5;   // he closes at an angle, not on rails
    B.x += Math.cos(angToP + weave) * sp * dt; B.y += Math.sin(angToP + weave) * sp * dt;
  } else {
    B.strafeT -= dt;
    if (B.strafeT <= 0) { B.strafeDir = Math.random() < 0.5 ? -1 : 1; B.strafeT = rand(0.8, 1.8); }
    const sa = angToP + Math.PI / 2 * B.strafeDir;
    B.x += Math.cos(sa) * (passive ? 68 : 52) * dt; B.y += Math.sin(sa) * (passive ? 68 : 52) * dt;
  }
  // a lesson waits for a quiet beat — never inside the break's shadow
  if (HABITS.pending && B.hp > B.hpMax * 0.56 && !G.cinematic) {
    B.state = 'learn'; B.stateT = 0;
    sfx.learn();
    return;
  }
  B.cd -= dt * (passive ? 0.15 : 1);
  if (B.cd <= 0) {
    if (passive && Math.random() < 0.6) B.cd = rand(0.9, 1.6);   // he shifts his guard and keeps waiting
    else { B.chainCount = 1; bossStartAttack(BPH().choose(d)); }
  }
}

/* ---- PHASE TWO: low, forward, and no longer waiting ---- */
function aldricIdleShard(dt, angToP, d) {
  B.guarding = false;
  B.wOff = lerp(B.wOff, 0.35, 5 * dt);   // low stance, blade forward and level
  B.wLen = lerp(B.wLen, 58, 5 * dt);
  B.face = turnToward(B.face, angToP, 4.2 * dt);
  const thirsty2 = HABITS.has('flask') && P.hp / P.hpMax < HABITS.flaskAt() + 0.05;
  if (HABITS.has('flask') && P.act && P.act.type === 'flask' && d < 260) B.cd = Math.min(B.cd, 0.05);
  if (B.hopT > 0) {
    B.hopT -= dt;
    B.x -= Math.cos(angToP) * 300 * dt; B.y -= Math.sin(angToP) * 300 * dt;
    if (Math.random() < dt * 24) spawnDrift(B.x - Math.cos(angToP) * 16, B.y + 6, rand(-8, 8), rand(-14, -4), 'rgba(150,146,138,0.4)', 0.35, 2);
  }
  if (d > 140 * preferredGap() * (thirsty2 ? 0.55 : 1)) {
    const weave = Math.sin(G.time * 2.1 + B.weaveSeed) * 0.55;
    B.x += Math.cos(angToP + weave) * 175 * dt; B.y += Math.sin(angToP + weave) * 175 * dt;
  } else {
    B.strafeT -= dt;
    if (B.strafeT <= 0) { B.strafeDir = Math.random() < 0.5 ? -1 : 1; B.strafeT = rand(0.6, 1.4); }
    const sa = angToP + Math.PI / 2 * B.strafeDir;
    B.x += Math.cos(sa) * 80 * dt; B.y += Math.sin(sa) * 80 * dt;
  }
  // he reads a heavy being wound up and refuses to stand there for it
  const charging = P.act && P.act.type === 'heavy' && P.act.charging && P.act.chargeT > 0.35;
  if (charging && B.readCd <= 0 && !P.dead) {
    B.state = 'read'; B.stateT = 0; B.readCd = 5.0;
    B.atk = null;
    sfx.read();
    return;
  }
  // a lesson waits its turn — never while the hesitation is owed or near
  if (HABITS.pending && (B.hesitated || P.hp > P.hpMax * 0.45) && !G.cinematic) {
    B.state = 'learn'; B.stateT = 0;
    sfx.learn();
    return;
  }
  B.cd -= dt;
  if (B.cd <= 0) {
    if (!B.hesitated && P.hp <= 35) { B.state = 'hesitate'; B.stateT = 0; B.mourned = false; }
    else { B.chainCount = 1; bossStartAttack(BPH().choose(d)); }
  }
}

function updateBoss(dt) {
  B.flash = Math.max(0, B.flash - dt);
  B.hpGhost = Math.max(B.hp, B.hpGhost - B.hpMax * 0.35 * dt);
  B.poise = Math.max(0, B.poise - 0.85 * dt);
  // the blood debt pays itself out, a steady seep — never a spike, never a pause
  if (B.bleed > 0 && B.state !== 'carve' && B.hp > 0 && !G.cinematic) {
    const seep = Math.min(B.bleed, Math.max(6, B.bleed * 0.6) * dt);
    B.bleed -= seep;
    B.dotAcc = (B.dotAcc || 0) + seep;
    B.hp -= seep;
    if (B.dotAcc > 6) {                    // a visible drip every few points paid
      B.dotAcc = 0;
      spawnDrift(B.x + rand(-16, 16), B.y + rand(-10, 14), rand(-8, 8), rand(10, 26), '#c0392b', 0.6, 2);
    }
    if (B.hp <= 0) { B.hp = 1; damageBoss(2, true); }   // the last drop goes through the front door
  }
  B.readCd = Math.max(0, B.readCd - dt);
  B.stateT += dt;

  /* ---- he watches: spacing and orbit, sampled every half second ---- */
  if (HABITS.data && G.screen === 'fight' && !P.dead && !G.cinematic) {
    B.obsT = (B.obsT || 0) - dt;
    if (B.obsT <= 0) {
      B.obsT = 0.5;
      const d0 = dist(P.x, P.y, B.x, B.y);
      if (d0 < 150) HABITS.data.near++; else if (d0 > 210) HABITS.data.far++;
      const angNow = Math.atan2(P.y - B.y, P.x - B.x);
      if (B.lastPAng !== undefined && P.speedNow > 40) {
        const dAng = angDiff(angNow, B.lastPAng);
        if (Math.abs(dAng) > 0.02) { if (dAng > 0) HABITS.data.orbit.cw++; else HABITS.data.orbit.ccw++; }
      }
      B.lastPAng = angNow;
    }
    HABITS.glance(dt);
  }

  // phase-2 embers drift off him
  if (B.phase2 && B.state !== 'dying' && B.state !== 'carve' && Math.random() < dt * 8) {
    spawnDrift(B.x + rand(-16, 16), B.y + rand(-16, 16), rand(-10, 10), rand(-48, -22), ACCENT, rand(0.4, 0.9), rand(1.5, 3));
  }
  // and an ember wind crosses the arena — after the break, even the air is different
  if (B.phase2 && B.state !== 'carve' && Math.random() < dt * 2.4) {
    const fromLeft = Math.random() < 0.5;
    spawnDrift(fromLeft ? ARENA.x + 6 : ARENA.x + ARENA.w - 6, rand(ARENA.y + 30, ARENA.y + ARENA.h - 30),
      (fromLeft ? 1 : -1) * rand(45, 90), rand(-16, 4), 'rgba(255,158,44,0.35)', rand(2.2, 3.6), rand(1.2, 2));
  }
  // his own footwork stirs the ash
  if ((B.state === 'idle' || B.state === 'chainPause') && !G.cinematic && Math.random() < dt * (B.phase2 ? 5 : 2.5)) {
    spawnDrift(B.x + rand(-14, 14), B.y + rand(4, 12), rand(-10, 10), rand(-12, -3), 'rgba(150,146,138,0.35)', rand(0.3, 0.6), rand(1.4, 2.2));
  }
  // ash sloughs off his shoulders while he stands
  if ((B.state === 'idle' || B.state === 'chainPause') && Math.random() < dt * 3) {
    const sa = B.face + (Math.random() < 0.5 ? 1 : -1) * 1.5;
    spawnDrift(B.x + Math.cos(sa) * 26, B.y + Math.sin(sa) * 26, rand(-6, 6), rand(12, 32), 'rgba(150,146,138,0.5)', rand(0.5, 1.1), rand(1.4, 2.4));
  }

  const angToP = Math.atan2(P.y - B.y, P.x - B.x);

  /* ---- the beats that belong to this boss alone ---- */
  const ownBeat = BD().states[B.state];
  if (ownBeat) { ownBeat(dt, angToP); return; }

  if (B.state === 'dying') {
    B.dieT += dt;
    B.tele = 0;
    if (B.dieT > 1.35 && G.screen === 'fight') { goto('victory'); }
    return;
  }


  if (B.state === 'learn') {             // he has seen enough of you
    B.tele = 0;
    B.wOff = lerp(B.wOff, 1.25, 5 * dt);                     // the weapon comes down
    B.wLen = lerp(B.wLen, B.broken ? 50 : 74, 5 * dt);
    B.face = turnToward(B.face, angToP, 7 * dt);             // and the head follows you, wherever you go
    if (B.stateT >= 0.8) {
      if (HABITS.pending) { HABITS.adopted.push(HABITS.pending); HABITS.pending = null; HABITS.save(); }
      B.state = 'idle'; B.cd = 0.6;
    }
    return;
  }

  if (B.state === 'clashed') {           // steel met steel; both arms are still ringing
    B.tele = 0;
    B.wOff = lerp(B.wOff, -1.7, 10 * dt);              // the weapon thrown wide off the bind
    B.wLen = lerp(B.wLen, B.broken ? 58 : 86, 6 * dt);
    if (B.stateT < 0.16) {
      B.x += Math.cos(B.pushA || 0) * 200 * dt; B.y += Math.sin(B.pushA || 0) * 200 * dt;
      B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
      B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
    }
    if (B.stateT >= 0.5) { B.state = 'idle'; B.cd = 0.55; }   // he recovers a beat behind you
    return;
  }

  if (B.state === 'daze') {              // he hit the wall at a full charge
    B.dazeT -= dt;
    B.tele = 0;
    B.wOff = lerp(B.wOff, 1.4, 4 * dt); B.wLen = lerp(B.wLen, 86, 4 * dt);
    if (B.dazeT <= 0) { B.state = 'idle'; B.cd = 0.8; }
    return;
  }


  if (B.state === 'chainPause') {        // the beat between chained cuts — a real window
    B.tele = 0;
    B.wOff = lerp(B.wOff, 1.1, 6 * dt); B.wLen = lerp(B.wLen, 52, 6 * dt);
    B.face = turnToward(B.face, angToP, 1.0 * dt);
    if (B.stateT >= B.pauseDur) { B.chainCount++; bossStartAttack(BPH().choose(dist(B.x, B.y, P.x, P.y))); }
    return;
  }

  if (B.state === 'stagger') {
    B.staggerT -= dt;
    B.tele = 0;
    B.wOff = lerp(B.wOff, 1.6, 5 * dt); B.wLen = lerp(B.wLen, 60, 5 * dt);
    if (B.staggerT <= 0) { B.state = 'idle'; B.cd = 0.6; }
    return;
  }

  if (B.state === 'idle') {
    B.tele = Math.max(0, B.tele - 4 * dt);
    const d = dist(B.x, B.y, P.x, P.y);
    BPH().idle(dt, angToP, d);
  } else if (B.state === 'recoil') {         // knocked off-balance by a parry
    B.tele = 0;
    B.wOff = lerp(B.wOff, -1.45, 7 * dt); B.wLen = lerp(B.wLen, 82, 7 * dt);
    if (B.stateT < 0.2) {
      B.x -= Math.cos(B.face) * 55 * dt; B.y -= Math.sin(B.face) * 55 * dt;
      B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
      B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
    }
    if (B.stateT >= 0.85) { B.state = 'idle'; B.cd = 0.75; }
  } else if (B.state === 'attack' && B.atk) {
    const atk = (B.setRef || currentSet())[B.atk];
    const ph = atk.phases[B.phaseIdx];
    const pdur = B.phaseDur;
    B.phaseT += dt;
    const k = clamp(B.phaseT / pdur, 0, 1);

    // pose interpolation
    B.wOff = lerp(ph.w[0], ph.w[1], k);
    B.wLen = lerp(ph.L[0], ph.L[1], k);

    // telegraph intensity: ramps during windups only
    if (ph.k === 'w') B.tele = k;
    else if (ph.k === 'a') B.tele = Math.max(0, B.tele - 8 * dt);
    else B.tele = Math.max(0, B.tele - 6 * dt);

    // tracking during windups/gaps only — active phases are committed.
    // what he has learned leans the point of aim toward where you will be.
    if ((ph.k === 'w' || ph.k === 'g') && ph.track) {
      let lead = 0;
      if (HABITS.has('rollDir') && (B.atk === 'sweep' || B.atk === 'spin')) lead += HABITS.rollLead();
      if (HABITS.has('orbit')) lead += HABITS.orbitSign() * 0.35;
      B.face = turnToward(B.face, angToP + lead, ph.track * dt);
    }

    // he has learned when you wind the charge: his recovery ends the moment it starts
    if (ph.k === 'r' && HABITS.has('charge') && P.act && P.act.charging && P.act.chargeT > 0.2) {
      B.phaseT = pdur;
    }

    // the blows that end on the stone rise off it first
    const airborne = ph.k === 'w' && atk.phases.some(p2 => p2.impact);
    B.z = airborne ? 26 * Math.pow(k, 1.7) : Math.max(0, (B.z || 0) - 620 * dt);

    // movement within a phase
    if (ph.move) {
      B.x += Math.cos(B.face) * ph.move.sp * dt;
      B.y += Math.sin(B.face) * ph.move.sp * dt;
    }

    // CHARGING RUSH: committed, and the wall punishes him for it
    if (ph.charge) {
      B.x += Math.cos(B.face) * ph.charge * dt;
      B.y += Math.sin(B.face) * ph.charge * dt;
      if (Math.random() < dt * 30) {
        spawnDrift(B.x - Math.cos(B.face) * 30 + rand(-12, 12), B.y - Math.sin(B.face) * 30 + rand(-12, 12),
          -Math.cos(B.face) * 60, -Math.sin(B.face) * 60, 'rgba(150,146,138,0.5)', 0.4, 2);
      }
      const hitWall = B.x <= ARENA.x + B.r || B.x >= ARENA.x + ARENA.w - B.r ||
                      B.y <= ARENA.y + B.r || B.y >= ARENA.y + ARENA.h - B.r;
      if (hitWall) {
        // dust comes off the stone where he struck it
        const upWall = B.y <= ARENA.y + B.r + 1;
        for (let i = 0; i < 16; i++) {
          spawnDrift(B.x + rand(-46, 46), (upWall ? ARENA.y - 6 : B.y) + rand(-8, 8),
            rand(-26, 26), upWall ? rand(20, 70) : rand(-20, 20),
            'rgba(150,146,138,0.55)', rand(0.5, 1.2), rand(1.4, 2.8));
        }
        if (upWall) G.wallHit = 0.5;
        B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
        B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
        B.atk = null;
        B.state = 'daze'; B.stateT = 0; B.dazeT = 1.4;
        sfx.daze();
        G.shake = Math.max(G.shake, 13);
        rumble(400, 0.8, 0.5);
        spawnParticles(B.x + Math.cos(B.face) * B.r, B.y + Math.sin(B.face) * B.r, 22, '#8a8478', 230, 0.7);
        return;
      }
    }

    // entering active: the swing sound + arc
    if (ph.k === 'a' && !B.phaseStarted) {
      B.phaseStarted = true; B.hitDone = false;
      if (B.atkSet === 1) {
        if (ph.charge) sfx.chargeWhoosh(); else sfx.maulSwing();
        sfx.effort(true);                        // he has to throw his weight into the maul
      } else {
        sfx.shardSwing();
        if (B.atk === 'rising' || B.atk === 'step') sfx.effort(false);   // only the committed cuts
      }
      if (ph.hit && ph.hit.s === 'arc' && !ph.charge) {
        addSlash(B.x, B.y, B.face + (ph.w[0] + ph.w[1]) / 2, ph.hit.r1, Math.min(ph.hit.half, 2.2), ACCENT, 0.18);
      }
    }

    // active hit check — every boss hit is parryable
    if (ph.k === 'a' && ph.hit && !B.hitDone) {
      let hit = false;
      if (ph.hit.s === 'arc') {
        const d = dist(B.x, B.y, P.x, P.y);
        if (d > ph.hit.r0 - P.r && d < ph.hit.r1 + P.r) {
          const rel = Math.abs(angDiff(B.face, Math.atan2(P.y - B.y, P.x - B.x)));
          if (rel < ph.hit.half + Math.asin(clamp(P.r / Math.max(d, P.r), 0, 1))) hit = true;
        }
      } else if (ph.hit.s === 'c') {
        const cx = B.x + Math.cos(B.face) * ph.hit.dist, cy = B.y + Math.sin(B.face) * ph.hit.dist;
        if (dist(cx, cy, P.x, P.y) < ph.hit.r + P.r) hit = true;
      }
      if (hit) {
        // steel may meet steel before it meets flesh
        let connected = false;
        const met = tryClash();
        if (met) {
          B.hitDone = true;
        } else {
          // the maul carries his whole first argument; the shard trades weight for speed
          const scaled = Math.round(ph.dmg * (B.phase2 ? 0.85 : 1.15));
          connected = damagePlayer(scaled, B.x, B.y, true, ph.kb || 1);
          B.hitDone = connected || B.hitDone;
        }
        if (B.state !== 'attack') { B.phaseStarted = false; return; } // a parry or a clash ended the swing
        if (connected && ph.charge) B.phaseT = pdur;                  // the rush stops on a body
      }
      // ground impact feedback once, at start of active
      if (ph.impact && !B.impacted) {
        B.impacted = true;
        B.z = 0;                        // he arrives; all of him at once
        sfx.maulImpact();
        G.shake = Math.max(G.shake, ph.shake || 8);
        rumble(260, 0.7, 0.35);
        const cx = B.x + Math.cos(B.face) * (ph.hit.dist || 70), cy = B.y + Math.sin(B.face) * (ph.hit.dist || 70);
        spawnParticles(cx, cy, 18, '#8a7f6a', 200, 0.55);
        addSlash(cx, cy, 0, 40, Math.PI, ACCENT, 0.22);
        if (ph.fissures) spawnFissures(cx, cy);
      }
    }

    // advance phase
    if (B.phaseT >= pdur) {
      /* Resolution for the swing we are leaving. Ground-slam attacks are excluded:
         they strike stone whether or not you are there, and already sound it. A
         parry or a wall-daze returns before reaching here, so neither whiffs. */
      if (ph.k === 'a' && ph.hit && !ph.impact && !B.hitDone) sfx.bossWhiff(B.atkSet === 1);
      B.phaseIdx++;
      B.phaseT = 0; B.phaseStarted = false; B.impacted = false;
      if (B.phaseIdx >= atk.phases.length) {
        B.atk = null;
        // phase 2 chains into short strings, each link separated by a readable beat
        if (B.phase2 && B.chainCount < 3 && Math.random() < 0.7) {
          B.state = 'chainPause'; B.stateT = 0; B.pauseDur = rand(0.40, 0.60);
        } else {
          B.chainCount = 0;
          B.state = 'idle'; B.stateT = 0;
          B.cd = B.phase2 ? rand(0.25, 0.65) : rand(0.8, 1.35);
          // a third of the time he disengages a step — resets the spacing, reads alive
          const shy = P.frenzy >= 6 ? 0.6 : 0.35;   // he will not trade with a man who has stopped caring
          if (Math.random() < shy) B.hopT = B.phase2 ? 0.24 : 0.18;
        }
      } else {
        B.phaseDur = atk.phases[B.phaseIdx].d;
        if (B.buriedFake && atk.phases[B.phaseIdx].buried) B.phaseDur *= 0.3;   // the struggle was theatre
      }
    }
  }

  // clamp boss to arena
  B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
  B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
}

/* =========================================================================
   UPDATE DISPATCH
   ========================================================================= */
function update(dt) {
  G.time += dt;
  G.screenT += dt;
  G.shake = Math.max(0, G.shake - G.shake * 7 * dt - 2 * dt);
  G.wallHit = Math.max(0, (G.wallHit || 0) - dt * 1.6);

  // particles & slashes always tick
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.grav) p.vy += p.grav * dt;          // clash sparks fall like real sparks
    else { p.vx *= (1 - 4 * dt); p.vy *= (1 - 4 * dt); }
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.rings.length - 1; i >= 0; i--) {
    G.rings[i].t += dt;
    if (G.rings[i].t > G.rings[i].dur) G.rings.splice(i, 1);
  }
  for (let i = G.slashes.length - 1; i >= 0; i--) {
    G.slashes[i].t += dt;
    if (G.slashes[i].t > G.slashes[i].dur) G.slashes.splice(i, 1);
  }
  for (let i = G.dmgNums.length - 1; i >= 0; i--) {
    G.dmgNums[i].t += dt;
    if (G.dmgNums[i].t > 0.7) G.dmgNums.splice(i, 1);
  }
  for (let i = P.trail.length - 1; i >= 0; i--) {
    P.trail[i].a -= 4.5 * dt;
    if (P.trail[i].a <= 0) P.trail.splice(i, 1);
  }

  switch (G.screen) {
    case 'title':
      if (Input.menuL && G.charIdx > 0) { G.charIdx--; sfx.chime(); }
      if (Input.menuR && G.charIdx < CHARS.length - 1) { G.charIdx++; sfx.chime(); }
      if (Input.confirm) {
        resetFight();
        sfx.fog();
        goto(G.firstFight ? 'intro' : 'refade');
      }
      break;
    case 'intro': {
      // fog-gate walk-in
      const t = G.screenT;
      P.x = lerp(ARENA.x + 60, ARENA.x + 130, clamp(t / 1.5, 0, 1));
      P.face = 0;
      if (t >= 1.6 || Input.confirm) { G.firstFight = false; goto('fight'); }
      break;
    }
    case 'refade':
      if (G.screenT >= 0.45) goto('fight');
      break;
    case 'fight':
      updatePlayer(dt);
      updateBoss(dt);
      updateFissures(dt);
      updateDebris(dt);
      break;
    case 'dead': {
      // world freezes behind the overlay; boss finishes its swing cosmetically
      B.tele = Math.max(0, B.tele - dt);
      // he hits the stone
      // the steel reaches the stone before he does — one sword, or two knives in turn
      if (CH().id === 'pair') {
        if (!P.dagger1Done && G.screenT >= 0.55) { P.dagger1Done = true; sfx.swordDrop(true); }
        if (!P.swordDropDone && G.screenT >= 0.8) { P.swordDropDone = true; sfx.swordDrop(true); }
      } else if (!P.swordDropDone && G.screenT >= 1.0) {
        P.swordDropDone = true;
        sfx.swordDrop();
      }
      if (!P.fellDone && G.screenT >= 1.5) {
        P.fellDone = true;
        sfx.bodyFall();
        G.shake = Math.max(G.shake, 7);
        spawnParticles(P.deathX + Math.cos(P.deathFace) * 8, P.deathY + 5, 22, 'rgba(150,146,138,0.6)', 120, 0.85);
      }
      // and then goes to ash
      if (G.screenT > 1.75 && G.screenT < 3.6 && Math.random() < dt * 34) {
        spawnDrift(P.deathX + rand(-15, 15), P.deathY + rand(-7, 9),
          rand(-12, 12), rand(-46, -18), 'rgba(196,204,224,0.5)', rand(0.5, 1.2), rand(1.2, 2.4));
      }
      if (G.screenT > 2.1 && Input.confirm) {
        resetFight();
        goto('refade');
      }
      break;
    }
    case 'victory':
      // no chime — the cry was the sound of this ending
      if (G.screenT > 2.3 && Input.confirm) {
        G.victoryChimed = false;
        resetFight();
        goto('refade');
      }
      break;
  }
}

/* =========================================================================
   RENDERING
   ========================================================================= */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTracked(text, x, y, spacing) {
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  let total = 0;
  const ws = [];
  for (const ch of text) { const w = ctx.measureText(ch).width; ws.push(w); total += w + spacing; }
  total -= spacing;
  let cx = x - total / 2;
  let i = 0;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ws[i] + spacing; i++; }
  ctx.textAlign = prevAlign;
}

function drawFloor() {
  ctx.drawImage(ARENA_BAKE, 0, 0, W, H);
  // distance is darkness here — the back of the room barely catches the fire
  const dep = ctx.createLinearGradient(0, ARENA.y - 10, 0, ARENA.y + ARENA.h * 0.62);
  dep.addColorStop(0, 'rgba(0,0,0,0.58)');
  dep.addColorStop(0.5, 'rgba(0,0,0,0.2)');
  dep.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = dep;
  ctx.fillRect(ARENA.x - 40, ARENA.y - 40, ARENA.w + 80, ARENA.h);

  // dynamic ritual-glow overlay (phase 2 lights the pentacle brighter — cheap, small)
  if (B.phase2) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.strokeStyle = `rgba(255,158,44,${0.14 - 0.07})`;
    ctx.restore();
  }

  // corner braziers — the arena's only warm light (flicker is dynamic, drawn per frame)
  for (const c of BRAZIERS) {
    let fl = 0.75 + 0.25 * Math.sin(G.time * 7 + c[0] * 0.1);
    // a body rushing past drags the flame with it
    const dp = dist(P.x, P.y, c[0], c[1]), db = dist(B.x, B.y, c[0], c[1]);
    const rush = (dp < 90 && P.speedNow > 160) || (db < 110 && (B.state === 'attack' || B.hopT > 0));
    if (rush) fl *= 0.55 + 0.25 * Math.sin(G.time * 26 + c[1]);
    ctx.globalAlpha = 0.24 * fl;
    ctx.drawImage(GLOW_EMBER, c[0] - 115 * fl, c[1] - 115 * fl, 230 * fl, 230 * fl);
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(c[0], c[1]); ctx.scale(1, 1 / SQUASH);      // fire climbs; it does not lie down
    ctx.fillStyle = `rgba(255,${150 + Math.floor(60 * fl)},60,${0.85 * fl})`;
    ctx.beginPath();
    ctx.moveTo(0, -14 - 7 * fl);
    ctx.quadraticCurveTo(6, -4, 0, -3);
    ctx.quadraticCurveTo(-6, -4, 0, -14 - 7 * fl);
    ctx.fill();
    ctx.restore();
    // a steady column of embers rising off each flame
    if (Math.random() < 0.25) spawnDrift(c[0] + rand(-4, 4), c[1] - 10, rand(-7, 7), rand(-52, -26), ACCENT, rand(0.6, 1.3), rand(1.2, 2.4));
    if (Math.random() < 0.1) spawnDrift(c[0] + rand(-7, 7), c[1] - 6, rand(-5, 5), rand(-30, -16), 'rgba(255,190,120,0.5)', rand(0.8, 1.5), 1.4);
  }

  // the gate bar, once he has lifted it: resting against the frame. Never remarked on.
  if (G.barLifted) {
    ctx.save();
    // paint over the baked-in barred version
    ctx.fillStyle = '#131015';
    ctx.fillRect(GATE.x - 62, 30, 124, 16);
    const og2 = ctx.createLinearGradient(0, 30, 0, 46);
    og2.addColorStop(0, '#171310'); og2.addColorStop(1, '#0e0c0c');
    ctx.fillStyle = og2;
    ctx.fillRect(GATE.x - 62, 30, 124, 16);
    ctx.translate(GATE.x + 52, 34);
    ctx.rotate(-1.22);
    ctx.fillStyle = '#1b1c24';
    ctx.fillRect(-70, -6, 140, 12);
    ctx.strokeStyle = '#0a0b10'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-70, -6, 140, 12);
    ctx.fillStyle = '#3c3f4d';
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * 28, 0, 1.8, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  // the dying ember light inside the gate's opening
  const gf = 0.7 + 0.3 * Math.sin(G.time * 1.3);
  ctx.globalAlpha = 0.14 * gf;
  ctx.drawImage(GLOW_EMBER, GATE.x - 44 * gf, 24 - 34 * gf, 88 * gf, 68 * gf);
  ctx.globalAlpha = 1;

  // drifting ash motes
  ctx.fillStyle = 'rgba(200,190,170,0.16)';
  for (let i = 0; i < 30; i++) {
    const sx = (i * 137.5) % ARENA.w;
    const sy = ((i * 71.3) + G.time * (12 + (i % 5) * 6)) % ARENA.h;
    const wob = Math.sin(G.time * 0.8 + i) * 6;
    ctx.fillRect(ARENA.x + sx + wob, ARENA.y + ARENA.h - sy, 1.6, 1.6);
  }

  // a low fog band, drifting slowly across the floor
  const fx1 = ((G.time * 7) % (W + 340)) - 340;
  ctx.globalAlpha = 0.5;
  ctx.drawImage(FOG_BAND, fx1, 348, 430, 96);
  ctx.drawImage(FOG_BAND, W - fx1 - 460, 236, 460, 100);
  ctx.globalAlpha = 1;
}

function drawFogWall() {
  const t = G.time;
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(130,148,190,0.13)';
  roundRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h, 10);
  ctx.stroke();
  ctx.globalAlpha = 1;
  for (let i = 0; i < 42; i++) {
    const u = (i / 42 + t * 0.014 * (i % 3 === 0 ? 1.6 : 1)) % 1;
    const per = 2 * (ARENA.w + ARENA.h);
    let p = u * per, x, y;
    if (p < ARENA.w) { x = ARENA.x + p; y = ARENA.y; }
    else if (p < ARENA.w + ARENA.h) { x = ARENA.x + ARENA.w; y = ARENA.y + (p - ARENA.w); }
    else if (p < 2 * ARENA.w + ARENA.h) { x = ARENA.x + ARENA.w - (p - ARENA.w - ARENA.h); y = ARENA.y + ARENA.h; }
    else { x = ARENA.x; y = ARENA.y + ARENA.h - (p - 2 * ARENA.w - ARENA.h); }
    const s = Math.abs(10 + 9 * Math.sin(t * 0.8 + i * 2.1)) + 8;
    ctx.globalAlpha = 0.11 + 0.07 * Math.sin(t * 1.3 + i);
    ctx.save();
    ctx.translate(x, y); ctx.scale(1, 1 / SQUASH);      // mist stands in the air
    ctx.drawImage(FOG_SPRITE, -s, -s * 1.35, s * 2, s * 2.7);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(4,5,8,0.72)';
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  roundRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h, 10);
  ctx.fill('evenodd');
  ctx.restore();
}

function drawFissures() {
  for (const f of G.fissures) {
    const fade = f.len < f.maxLen ? 1 : clamp(1 - (f.t - f.maxLen / f.speed) / 0.9, 0, 1);
    const dx = Math.cos(f.ang), dy = Math.sin(f.ang);
    const nx = -dy, ny = dx;
    const segs = Math.max(2, Math.floor(f.len / 24));
    ctx.strokeStyle = `rgba(10,8,6,${0.8 * fade})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    for (let i = 1; i <= segs; i++) {
      const along = (i / segs) * f.len;
      const off = f.jit[i % f.jit.length] * (i === segs ? 0.4 : 1);
      ctx.lineTo(f.x + dx * along + nx * off, f.y + dy * along + ny * off);
    }
    ctx.stroke();
    ctx.strokeStyle = `rgba(255,158,44,${0.75 * fade})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    if (f.len < f.maxLen) {
      const tx = f.x + dx * f.len, ty = f.y + dy * f.len;
      ctx.globalAlpha = 0.6;
      ctx.drawImage(GLOW_EMBER, tx - 14, ty - 14, 28, 28);
      ctx.globalAlpha = 1;
    }
  }
}

function drawShedPlates() {
  if (!G.shedPlates || !G.shedPlates.length) return;
  for (const p of G.shedPlates) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(0, 3, 15, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(p.rot);
    ctx.scale(1, 0.8);                     // a dome, face down on the stone
    const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
    g.addColorStop(0, '#c3cddf'); g.addColorStop(0.55, '#98a3ba'); g.addColorStop(1, '#5f6981');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#333a4b'; ctx.lineWidth = 1.6; ctx.stroke();
    // the overlapping plates, same make as the one the knight still wears
    ctx.strokeStyle = 'rgba(51,58,75,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 8, -2.4, 1.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 4.5, -2.6, 1.3); ctx.stroke();
    ctx.fillStyle = '#3a3540';
    for (const rx of [-6, 0, 6]) { ctx.beginPath(); ctx.arc(rx, -6, 1.1, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
}

function drawDebris() {
  const d = G.debris;
  if (!d) return;
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 4, 22, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(d.rot);
  const g = ctx.createLinearGradient(0, -16, 0, 16);
  g.addColorStop(0, '#3a3d49'); g.addColorStop(1, '#20222b');
  ctx.fillStyle = g;
  ctx.fillRect(-11, -17, 22, 34);
  ctx.strokeStyle = '#0a0b10';
  ctx.lineWidth = 2;
  ctx.strokeRect(-11, -17, 22, 34);
  ctx.fillStyle = '#767e90';
  ctx.fillRect(7, -17, 4, 34);           // the striking edge, still bright
  ctx.fillStyle = '#14161d';
  ctx.beginPath(); ctx.arc(-4, 0, 3, 0, Math.PI * 2); ctx.fill();  // the socket, empty
  ctx.strokeStyle = '#4a3b2c';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-14, 5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-12, -4); ctx.stroke();
  ctx.restore();
}

function drawCarving() {
  const cv = G.carve;
  if (!cv || B.state !== 'carve') return;
  const total = cv.strokes.length;
  const shown = cv.progress * total;
  const full = Math.floor(shown);
  ctx.save();
  for (let i = 0; i < Math.min(full + 1, total); i++) {
    const st2 = cv.strokes[i];
    const gx = cv.x - 64 + st2.g * 16, gy = cv.y + 26;
    let frac = 1;
    if (i === full) frac = shown - full;
    if (frac <= 0) continue;
    const x2 = st2.s[0] + (st2.s[2] - st2.s[0]) * frac;
    const y2 = st2.s[1] + (st2.s[3] - st2.s[1]) * frac;
    ctx.strokeStyle = 'rgba(20,17,14,0.9)'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(gx + st2.s[0], gy + st2.s[1]); ctx.lineTo(gx + x2, gy + y2); ctx.stroke();
    ctx.strokeStyle = i >= full - 3 ? 'rgba(255,158,44,0.5)' : 'rgba(196,188,172,0.32)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(gx + st2.s[0], gy + st2.s[1]); ctx.lineTo(gx + x2, gy + y2); ctx.stroke();
  }
  if (cv.phase !== 'fall') {
    const reveal = clamp(cv.progress / 0.93, 0, 1);
    const text = 'NOMAD, NOWHERE TO —';
    const chars = Math.floor(reveal * text.length);
    if (chars > 0) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#c9c2b2';
      ctx.font = '600 13px Georgia, "Times New Roman", serif';
      drawTracked(text.slice(0, chars), cv.x, cv.y + 54, 3.2);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function drawSlashes() {
  for (const s of G.slashes) {
    const k = s.t / s.dur;
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.5;
    ctx.fillStyle = s.col;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.r * (0.85 + 0.15 * k), s.ang - s.half, s.ang + s.half);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawRings() {
  for (const r of G.rings) {
    const k = r.t / r.dur;
    const rad = (r.big ? 26 : 15) + k * (r.big ? 150 : 92);
    ctx.save();
    ctx.globalAlpha = (1 - k) * (r.big ? 0.9 : 0.7);
    ctx.strokeStyle = r.big ? '#fff3d8' : '#ffe9c8';
    ctx.lineWidth = (r.big ? 5 : 3.5) * (1 - k) + 0.8;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
    if (k < 0.35) {                         // the flash at the instant of contact
      ctx.globalAlpha = (1 - k / 0.35) * 0.85;
      ctx.drawImage(GLOW_EMBER, r.x - 30, r.y - 30, 60, 60);
    }
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawSword(len, white) { drawSwordProfile(ctx, len, { white }); }

/* The part of a person an overhead view cannot show: the legs and the trunk
   holding the shoulders up off the floor. Drawn in screen-vertical space so
   it never turns with the facing — you are always looking at it side-on. */
function drawStandColumn(h, wBase, wTop, colLo, colHi, white) {
  if (h < 4) return;
  const g = ctx.createLinearGradient(0, 3, 0, -h);
  g.addColorStop(0, white ? '#ffffff' : colLo);
  g.addColorStop(1, white ? '#ffffff' : colHi);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-wBase, 3);
  ctx.quadraticCurveTo(-wTop * 1.05, -h * 0.55, -wTop, -h);
  ctx.lineTo(wTop, -h);
  ctx.quadraticCurveTo(wTop * 1.05, -h * 0.55, wBase, 3);
  ctx.closePath();
  ctx.fill();
  if (!white) {                       // the light in this room comes from below and behind
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,158,44,0.05)';
    ctx.fillRect(-wBase * 0.8, 0, wBase * 1.6, 2);
  }
}

/* ---------- the two who come to the threshold ----------
   They are not palette swaps. One is built out of the sword Aldric handed
   him; the other is built out of everyone Aldric already killed. */

// a short scavenged blade — chipped, dark, bound with cord at the grip
function drawShortBlade(len, white) {
  ctx.fillStyle = white ? '#ffffff' : '#33261f';
  ctx.fillRect(-6, -1.5, 6, 3);
  ctx.beginPath(); ctx.arc(-7, 0, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = white ? '#ffffff' : '#5a4436';
  ctx.fillRect(-1.2, -4.5, 2.4, 9);
  if (white) ctx.fillStyle = '#ffffff';
  else {
    const g = ctx.createLinearGradient(0, -2.6, 0, 2.6);
    g.addColorStop(0, '#e6e2d6'); g.addColorStop(0.5, '#a9a496'); g.addColorStop(1, '#6d6a60');
    ctx.fillStyle = g;
  }
  ctx.beginPath();
  ctx.moveTo(1.2, -2.4); ctx.lineTo(len - 5, -2.0); ctx.lineTo(len, 0); ctx.lineTo(len - 6, 1.8); ctx.lineTo(1.2, 2.4);
  ctx.closePath(); ctx.fill();
  if (!white) {                       // notches — these blades have been used before
    ctx.fillStyle = 'rgba(20,18,16,0.55)';
    ctx.fillRect(len * 0.45, -2.2, 1.2, 1.4);
    ctx.fillRect(len * 0.7, 0.9, 1, 1.2);
  }
}

/* CHARACTER A — THE GIVEN BLADE. Heavy plate, full helm, the sword he was
   handed. Broad, slow, low to the ground. */
function drawBladeBody(white) {
  const flasking = P.act && P.act.type === 'flask';
  const sprintingNow = P.speedNow > 220;
  const idleBob = P.speedNow < 5 ? Math.sin(G.time * 2.1) * 0.8 : 0;   // breathing
  const sway = Math.sin(P.walkT) * 1.4 + idleBob;
  ctx.translate(0, sway);
  if (sprintingNow) ctx.rotate(0.08);                                  // the lean

  // cape — flutters harder with speed
  const flut = 3 + Math.min(6, P.speedNow * 0.02);
  const cs = Math.sin(G.time * (2.6 + P.speedNow * 0.015) + P.walkT) * flut;
  const cg = ctx.createLinearGradient(-22, 0, -2, 0);
  cg.addColorStop(0, '#2d3a63'); cg.addColorStop(1, '#5265a0');
  ctx.fillStyle = white ? '#ffffff' : cg;
  ctx.beginPath();
  ctx.moveTo(-2, -9);
  ctx.quadraticCurveTo(-15, -8 + cs, -23 - flut * 0.5, -3 + cs);
  ctx.lineTo(-23 - flut * 0.5, 4 + cs);
  ctx.quadraticCurveTo(-15, 8 + cs, -2, 9);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#1a2138';
  ctx.lineWidth = 1.2; ctx.stroke();

  // sprint speed lines
  if (sprintingNow) {
    ctx.strokeStyle = 'rgba(200,212,236,0.3)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-18 - i * 6, -7 + i * 7);
      ctx.lineTo(-29 - i * 7, -7 + i * 7);
      ctx.stroke();
    }
  }

  // armored torso
  const bg = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
  bg.addColorStop(0, '#eef2fa'); bg.addColorStop(0.55, '#b7c1d6'); bg.addColorStop(1, '#7d87a1');
  ctx.fillStyle = white ? '#ffffff' : bg;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#333a4b';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  if (!white) {
    ctx.strokeStyle = 'rgba(51,58,75,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 8, -1.2, 1.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 4.5, -1.4, 1.4); ctx.stroke();
  }

  // pauldrons
  ctx.fillStyle = white ? '#ffffff' : '#98a3ba';
  ctx.strokeStyle = white ? '#ffffff' : '#333a4b';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(-1, -10.5, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-1, 10.5, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // pointed helm
  const hg = ctx.createLinearGradient(2, 0, 16, 0);
  hg.addColorStop(0, '#aab5cc'); hg.addColorStop(1, '#f2f6ff');
  ctx.fillStyle = white ? '#ffffff' : hg;
  ctx.beginPath(); ctx.moveTo(19, 0); ctx.lineTo(2, -8.5); ctx.lineTo(6, 0); ctx.lineTo(2, 8.5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#252c3c';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // glowing visor slit — pale blue, his one warm sign of life
  if (!white) {
    ctx.globalAlpha = 0.55;
    ctx.drawImage(GLOW_BLUE, 3, -7, 14, 14);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = COOL;
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(10, -3.6); ctx.lineTo(14, 0); ctx.lineTo(10, 3.6); ctx.stroke();
  }

  // sword — held low; swings across on attacks, raised flat when guarding
  let swordAng = 0.75, swordLen = 30;
  let trailFrom = null;   // when set, ghost blades sweep behind the cut
  if (P.act && (P.act.type === 'light' || P.act.type === 'heavy')) {
    const alt = P.act.side || 1;
    const kind = (P.act.spec && P.act.spec.kind) || 'cut';
    if (P.act.charging) {
      // held at the top of the wind-up; trembles as the charge builds
      const ch = chargeK();
      swordAng = -1.85 + Math.sin(G.time * (20 + ch * 34)) * 0.05 * ch;
      swordLen = 36;
    } else if (kind === 'smash') {
      const k = clamp((P.act.t - (P.act.held || 0)) / (P.act.dur * 0.58), 0, 1);
      swordAng = lerp(-1.85, 1.15, k * k);       // overhead, driven straight down
      swordLen = 36 + (P.act.chargeT || 0) * 2.5;
      if (k > 0.25 && k < 1) trailFrom = { ang: swordAng, step: -0.42, len: swordLen };
    } else if (kind === 'reap') {
      // the follow-through: a waist-height reaping cut, all the way around the front
      const k = clamp(P.act.t / (P.act.dur * 0.6), 0, 1);
      const e = k < 0.4 ? (k / 0.4) * (k / 0.4) * 0.25 : 0.25 + (k - 0.4) / 0.6 * 0.75;
      swordAng = lerp(2.4, -2.2, e);
      swordLen = 37;
      if (e > 0.28 && e < 1) trailFrom = { ang: swordAng, step: 0.5, len: swordLen };
    } else if (kind === 'high') {
      // lifted out of the return cut and brought down steep across the collar
      const k = clamp(P.act.t / (P.act.dur * 0.6), 0, 1);
      swordAng = lerp(-2.15, 0.95, k * k);
      swordLen = 33;
      if (k > 0.3 && k < 1) trailFrom = { ang: swordAng, step: -0.36, len: swordLen };
    } else if (kind === 'thrust') {
      // gathered back over the hip, then driven straight through the line
      const k = P.act.t / P.act.dur;
      if (k < 0.3) { swordAng = lerp(0.75, 1.9, k / 0.3); swordLen = 32; }
      else if (k < 0.62) {
        const e = (k - 0.3) / 0.32;
        swordAng = lerp(1.9, 0.02, e * e); swordLen = 32 + e * 10;
        if (e > 0.5) trailFrom = { ang: swordAng, step: 0.35, len: swordLen };
      } else { swordAng = lerp(0.02, 0.75, (k - 0.62) / 0.38); swordLen = 38; }
    } else {
      const k = clamp(P.act.t / (P.act.dur * 0.62), 0, 1);
      swordAng = lerp(-1.6 * alt, 1.35 * alt, k);
      swordLen = 32;
      if (k > 0.25 && k < 1) trailFrom = { ang: swordAng, step: -0.4 * alt, len: swordLen };
    }
  } else if (P.act && P.act.type === 'clashed') {
    // thrown high off the bind, wrestled back down by the end of the stun
    const k = clamp(P.act.t / P.act.dur, 0, 1);
    swordAng = lerp(-2.35, 0.75, Math.pow(k, 1.7)) + (k < 0.3 ? Math.sin(G.time * 46) * 0.06 : 0);
    swordLen = 34;
  } else if (P.act && P.act.type === 'parry') {
    swordAng = lerp(0.4, -1.7, clamp(P.act.t / 0.2, 0, 1));
    swordLen = 32;
  } else if (P.act && P.act.type === 'special') {
    const k = P.act.t;
    if (k < 0.16) { swordAng = lerp(-1.9, 0.02, k / 0.16); swordLen = 34; }   // raised high, driven down and in
    else if (k < 0.4) { swordAng = 0.02; swordLen = 40; }                     // buried to the guard
    else { swordAng = lerp(0.02, 0.75, (k - 0.4) / 0.26); swordLen = 34; }    // dragged back out
  } else if (P.blocking) {
    swordAng = -1.15;
    swordLen = 32;
  }
  // ghost blades trailing the arc
  if (trailFrom) {
    for (let i = 1; i <= 3; i++) {
      ctx.save();
      ctx.globalAlpha = 0.26 - i * 0.07;
      ctx.translate(3, 9);
      ctx.rotate(trailFrom.ang + trailFrom.step * i);
      drawSword(trailFrom.len, false);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(3, 9);
  ctx.rotate(swordAng);
  drawSword(swordLen, white);
  // the charge gathers pale-blue light along the blade
  if (P.act && P.act.type === 'heavy' && P.act.charging && P.act.chargeT > 0.05) {
    const ch = chargeK();
    ctx.globalAlpha = 0.3 + ch * 0.5;
    ctx.drawImage(GLOW_BLUE, swordLen - 14, -14, 28 + ch * 16, 28 + ch * 16);
    ctx.globalAlpha = 1;
    if (ch >= 1) {
      ctx.strokeStyle = 'rgba(228,240,255,0.85)';
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(swordLen - 2, 0); ctx.stroke();
    }
  }
  ctx.restore();

  // guard shimmer — a ward of steel across the facing arc
  if (P.blocking) {
    ctx.strokeStyle = `rgba(180,200,240,${0.3 + 0.12 * Math.sin(G.time * 6)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(5, 0, 17, -1.2, 1.2); ctx.stroke();
  }
  // the glint of an active parry window
  if (P.act && P.act.type === 'parry' && P.act.t <= 0.2) {
    ctx.strokeStyle = 'rgba(255,244,214,0.75)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(4, 0, 20, -1.5, 0.6); ctx.stroke();
  }

  if (flasking) drawFlaskSip();
}

/* CHARACTER B — THE SCAVENGED PAIR. Lighter, hooded, crouched forward over
   two dead men's knives. Nothing he wears matches. */
// the ritual's mark: a wet red line down a coated edge
function drawCoatGlow(len) {
  ctx.globalAlpha = 0.4 + 0.2 * Math.sin(G.time * 7);
  ctx.drawImage(GLOW_RED, len * 0.4 - 9, -9, 18, 18);
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(2, 1.4); ctx.lineTo(len - 4, 0.8); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawPairBody(white) {
  const flasking = P.act && P.act.type === 'flask';
  const sprintingNow = P.speedNow > 240;
  const idleBob = P.speedNow < 5 ? Math.sin(G.time * 2.6) * 0.6 : 0;
  const sway = Math.sin(P.walkT * 1.25) * 1.9 + idleBob;
  ctx.translate(0, sway);
  ctx.rotate(sprintingNow ? 0.14 : 0.05);          // always leaning into it
  if (P.frenzy >= 4 && !P.act) ctx.rotate((Math.random() - 0.5) * 0.012 * P.frenzy);   // he cannot hold still

  const a = P.act;
  const pKind = (a && a.spec && a.spec.kind) || '';
  const spinning = pKind === 'spin' || pKind === 'rspin';
  if (spinning) {
    const k = clamp(a.t / a.dur, 0, 1);
    ctx.rotate((pKind === 'rspin' ? -1 : 1) * k * Math.PI * 2.0);   // and the counter-spin unwinds it
    if (pKind === 'rspin') ctx.scale(1, 1 - 0.18 * Math.sin(k * Math.PI));   // sinking low through the turn
  }

  // torn short cloak — ragged hem, cut down to nothing at the knees
  const flut = 4 + Math.min(9, P.speedNow * 0.03);
  const cs = Math.sin(G.time * (3.4 + P.speedNow * 0.02) + P.walkT) * flut;
  ctx.fillStyle = white ? '#ffffff' : '#4a3630';
  ctx.beginPath();
  ctx.moveTo(-1, -8);
  ctx.quadraticCurveTo(-10, -8 + cs * 0.6, -16 - flut * 0.4, -4 + cs);
  ctx.lineTo(-13 - flut * 0.4, -1 + cs);           // torn
  ctx.lineTo(-17 - flut * 0.4, 1 + cs);
  ctx.lineTo(-12 - flut * 0.4, 3 + cs);
  ctx.quadraticCurveTo(-10, 7 + cs * 0.6, -1, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#241a17';
  ctx.lineWidth = 1; ctx.stroke();

  if (sprintingNow || spinning) {
    ctx.strokeStyle = 'rgba(216,101,78,0.28)';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-14 - i * 5, -6 + i * 6);
      ctx.lineTo(-24 - i * 6, -6 + i * 6);
      ctx.stroke();
    }
  }

  // narrow torso — leather over mismatched scraps of other people's armour
  const bg = ctx.createRadialGradient(-2, -2, 1.5, 0, 0, 11);
  bg.addColorStop(0, '#8d8377'); bg.addColorStop(0.55, '#5f574d'); bg.addColorStop(1, '#3a342e');
  ctx.fillStyle = white ? '#ffffff' : bg;
  ctx.beginPath(); ctx.ellipse(0, 0, 10, 8.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#221d19';
  ctx.lineWidth = 1.3; ctx.stroke();
  if (!white) {
    // one looted pauldron on the left, a strapped bracer on the right — nothing matches
    ctx.fillStyle = '#9aa0a8'; ctx.strokeStyle = '#221d19'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(-1, -8.5, 4.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6b5442';
    ctx.beginPath(); ctx.arc(0, 8.5, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // bone-white cord across the chest
    ctx.strokeStyle = 'rgba(224,216,198,0.6)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-5, -7); ctx.lineTo(4, 6); ctx.stroke();
  }

  // hood — a soft cowl, the face inside it left dark
  ctx.fillStyle = white ? '#ffffff' : '#4a3630';
  ctx.beginPath();
  ctx.moveTo(13, 0);
  ctx.quadraticCurveTo(9, -9.5, -2, -7.5);
  ctx.quadraticCurveTo(-6, 0, -2, 7.5);
  ctx.quadraticCurveTo(9, 9.5, 13, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#241a17';
  ctx.lineWidth = 1.1; ctx.stroke();
  if (!white) {
    ctx.fillStyle = '#100d0c';                      // the shadow under the hood
    ctx.beginPath(); ctx.ellipse(7.5, 0, 4.6, 4.4, 0, 0, Math.PI * 2); ctx.fill();
    const mad = P.frenzy / 8;
    ctx.globalAlpha = 0.5 + mad * 0.4;
    ctx.drawImage(GLOW_RED, 4 - mad * 3, -6 - mad * 3, 12 + mad * 6, 12 + mad * 6);
    ctx.globalAlpha = 1;
    ctx.fillStyle = `rgba(${226 + Math.round(mad * 24)},${124 - Math.round(mad * 40)},${100 - Math.round(mad * 40)},${0.85 + mad * 0.15})`;
    const er = 0.95 + mad * 0.45;                   // two points, brightening as he goes
    ctx.beginPath(); ctx.arc(8.6, -1.7, er, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8.6, 1.7, er, 0, Math.PI * 2); ctx.fill();
  }

  // TWO blades. Whichever hand is cutting sweeps; the other stays low and ready.
  let angR = 0.95, angL = -0.95, lenR = 22, lenL = 22;
  let trailSide = 0, trailAng = 0;
  let scissorK = -1;
  if (a && a.type === 'light' && pKind === 'scissor') {
    // both knives at once, closing like shears
    const k = clamp(a.t / (a.dur * 0.7), 0, 1);
    scissorK = k;
    const sw = lerp(-1.7, 0.22, k * k);
    angR = sw; angL = -sw; lenR = lenL = 25;
  } else if (a && a.type === 'light') {
    const k = clamp(a.t / (a.dur * 0.66), 0, 1);
    const sw = lerp(-1.5, 1.25, k);
    if ((a.side || 1) > 0) { angR = sw; lenR = 24; trailSide = 1; trailAng = sw; }
    else { angL = -sw; lenL = 24; trailSide = -1; trailAng = -sw; }
  } else if (spinning) {
    angR = 0.05; angL = -0.05; lenR = lenL = 25;     // both arms flung out, cutting a full circle
  } else if (a && a.type === 'deflected') {
    // both blades slapped wide; he needs the whole recovery to gather them
    const k = clamp(a.t / a.dur, 0, 1);
    const fl = lerp(2.35, 0.95, Math.pow(k, 1.5));
    angR = fl; angL = -fl;
    lenR = lenL = 23;
  } else if (a && a.type === 'parry') {
    const k = clamp(a.t / 0.2, 0, 1);
    angR = lerp(0.95, -0.35, k); angL = lerp(-0.95, 0.35, k);   // crossed high, edge out
    lenR = lenL = 23;
  } else if (a && a.type === 'special') {
    const st = a.stabs || 0;
    angR = (st % 2 === 0) ? 0.06 : 0.75;                        // whichever hand is in him
    angL = (st % 2 === 1) ? -0.06 : -0.75;
    lenR = lenL = 26;
  } else if (a && a.type === 'roll') {
    angR = 1.5; angL = -1.5;
  }

  // the glint of an active parry window — both edges catch the light
  if (a && a.type === 'parry' && a.t <= 0.2) {
    ctx.strokeStyle = 'rgba(255,244,214,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(3, 0, 17, -1.4, 0.5); ctx.stroke();
  }
  // thin sharp trails — a line, not a fan
  if (trailSide !== 0) {
    for (let i = 1; i <= 4; i++) {
      ctx.save();
      ctx.globalAlpha = 0.3 - i * 0.06;
      ctx.translate(2, trailSide * 8);
      ctx.rotate(trailAng - trailSide * 0.26 * i + (Math.random() - 0.5) * 0.02 * P.frenzy);
      ctx.strokeStyle = '#e8ddc8';
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(trailSide > 0 ? 24 : 24, 0); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  // the scissor leaves a pair of converging lines, one from each hand
  if (scissorK > 0.25 && scissorK < 1) {
    for (const sgn of [1, -1]) {
      for (let i = 1; i <= 3; i++) {
        ctx.save();
        ctx.globalAlpha = 0.3 - i * 0.08;
        ctx.translate(2, sgn * 8);
        ctx.rotate(sgn * (lerp(-1.7, 0.22, scissorK * scissorK) - 0.3 * i));
        ctx.strokeStyle = '#e8ddc8';
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(25, 0); ctx.stroke();
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }
  if (spinning) {
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = '#e8ddc8';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  const coated = P.coatT > 0;
  ctx.save(); ctx.translate(2, 8); ctx.rotate(angR); drawShortBlade(lenR, white);
  if (coated && !white) drawCoatGlow(lenR); ctx.restore();
  ctx.save(); ctx.translate(2, -8); ctx.rotate(angL); drawShortBlade(lenL, white);
  if (coated && !white) drawCoatGlow(lenL); ctx.restore();

  if (flasking) drawFlaskSip();
}

function drawFlaskSip() {
  ctx.globalAlpha = 0.7;
  ctx.drawImage(GLOW_GOLD, -12, -25, 20, 20);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#e7bf45';
  ctx.beginPath(); ctx.arc(-2, -15, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8a6a1d';
  ctx.fillRect(-3.6, -22.5, 3.2, 4);
  if (Math.random() < 0.35) spawnDrift(P.x, P.y - 14, rand(-8, 8), rand(-40, -20), '#ffe08a', 0.5, 2);
}

// how full the held charge is, 0..1
function chargeK() {
  const m = CH().chargeMax || 1;
  return clamp((P.act && P.act.chargeT || 0) / m, 0, 1);
}

function drawPlayer() {
  if (P.dead) {
    // his last moments were staged upright — undo the floor's tilt for them
    ctx.save();
    ctx.translate(0, HORIZON); ctx.scale(1, 1 / SQUASH); ctx.translate(0, -HORIZON);
    drawPlayerDeath();
    ctx.restore();
    return;
  }



  // roll afterimages
  for (const t of P.trail) {
    ctx.save();
    ctx.globalAlpha = clamp(t.a, 0, 1) * 0.3;
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rot);
    ctx.fillStyle = CH().id === 'pair' ? '#9c7a6a' : '#9fb2d4';
    ctx.beginPath(); ctx.ellipse(0, 0, CH().id === 'pair' ? 13 : 15, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // the trailing mark off the shoulder — his pale scarf, or his frayed red cord
  if (P.scarf.length) {
    ctx.strokeStyle = CH().accent;
    ctx.lineCap = 'round';
    for (let i = 0; i < P.scarf.length - 1; i++) {
      ctx.globalAlpha = 0.7 * (1 - i / P.scarf.length);
      ctx.lineWidth = 3 - i * 0.35;
      ctx.beginPath();
      ctx.moveTo(P.scarf[i].x, P.scarf[i].y);
      ctx.lineTo(P.scarf[i + 1].x, P.scarf[i + 1].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineCap = 'butt';
  }

  ctx.save();
  ctx.translate(P.x, P.y);
  // the shadow stays on the floor, in the floor's own flattened space
  const pzs = 1 + (P.z || 0) / 40;
  ctx.fillStyle = `rgba(0,0,0,${0.5 / pzs})`;
  ctx.beginPath(); ctx.ellipse(0, 8, 14 * pzs, 5.5 * pzs, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(0,0,0,${0.2 / pzs})`;
  ctx.beginPath(); ctx.ellipse(0, 8, 21 * pzs, 8 * pzs, 0, 0, Math.PI * 2); ctx.fill();
  // and he stands up out of it
  ctx.scale(1, 1 / SQUASH);
  const rolling = P.act && P.act.type === 'roll';
  const pLift = (rolling ? 5 : 22) + (P.z || 0);
  if (!rolling) {
    const pc = CH().id === 'pair'
      ? ['#0d0b0a', '#4a3630']            // dark trousers under a torn cloak
      : ['#10131d', '#3f4860'];           // greaves, then the skirt of his mail
    drawStandColumn(pLift, 6, 11, pc[0], pc[1], P.flash > 0);
  }
  ctx.translate(0, -pLift);

  const flasking = P.act && P.act.type === 'flask';
  const white = P.flash > 0;
  ctx.rotate(rolling ? Math.atan2(P.act.dirY, P.act.dirX) : P.face);

  if (rolling) {
    const k = P.act.t / P.act.dur;
    const pairNow = CH().id === 'pair';
    const rx = (pairNow ? 13 : 16) + 5 * Math.sin(k * Math.PI);
    ctx.fillStyle = white ? '#ffffff' : (pairNow ? '#6b5a4c' : '#c7d1e4');
    ctx.beginPath(); ctx.ellipse(0, 0, rx, pairNow ? 8 : 9.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : (pairNow ? '#2a221d' : '#3a4152');
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.strokeStyle = white ? '#ffffff' : 'rgba(58,65,82,0.8)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const a0 = k * 9 + i * 2.1;
      ctx.beginPath(); ctx.arc(0, 0, 6.5, a0, a0 + 1.1); ctx.stroke();
    }
  } else {
    if (CH().id === 'pair') drawPairBody(white); else drawBladeBody(white);
  }
  ctx.restore();

  // lock-on reticle over boss
  if (P.locked && B.state !== 'dying' && B.state !== 'carve') {
    const pu = 1 + 0.1 * Math.sin(G.time * 6);
    ctx.save();
    ctx.translate(B.x, bossHeadY() - 8);
    ctx.scale(pu, pu);
    ctx.strokeStyle = '#eef2fa';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(8, 0); ctx.lineTo(0, 8); ctx.lineTo(-8, 0); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#eef2fa';
    ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* the three stages of going down, staged upright */
function drawPlayerDeath() {
  /* He goes down in stages: the legs give, he pitches onto the stone,
     and then he simply goes to ash. His sword falls point-first and
     stays standing — the arena is already full of them. */
  const t = G.screenT, fx = P.deathX, fy = P.deathY, ff = P.deathFace || 0;

  // the ground shadow flattens and spreads as he falls
  const spread = clamp(t / 1.55, 0, 1);
  ctx.save();
  ctx.globalAlpha = clamp(1 - (t - 1.8) / 1.7, 0, 1) * 0.45;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(fx, fy + 6, 14 + spread * 10, 6 + spread * 2, ff, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  const pairDead = CH().id === 'pair';
  if (pairDead) {
    // the two scavenged blades fall from opening hands — flat on the stone,
    // one a beat after the other, the way they were picked up
    const drops = [
      { at: 0.55, ang: ff + 0.9, off: 17, spin: 2.2, rest: 0.6 },
      { at: 0.8, ang: ff - 1.2, off: 21, spin: -1.7, rest: -2.4 }
    ];
    for (const dr of drops) {
      if (t <= dr.at) continue;
      const k = clamp((t - dr.at) / 0.35, 0, 1);
      const settle = 1 - Math.pow(1 - k, 3);
      ctx.save();
      ctx.globalAlpha = clamp(1 - (t - 4.0) / 1.0, 0, 1);
      ctx.translate(fx + Math.cos(dr.ang) * dr.off + (1 - settle) * 4,
                    fy + Math.sin(dr.ang) * dr.off + 3 - (1 - settle) * 7);
      ctx.rotate(dr.rest + (1 - settle) * dr.spin);
      ctx.scale(1, 0.85);                 // lying flat, not standing
      drawShortBlade(20, false);
      ctx.restore();
    }
  } else if (t > 0.6) {
    // the given sword, dropped and driven point-first into the floor
    const k = clamp((t - 0.6) / 0.4, 0, 1);
    const settle = 1 - Math.pow(1 - k, 3);
    ctx.save();
    ctx.globalAlpha = clamp(1 - (t - 4.0) / 1.0, 0, 1);
    ctx.translate(fx + Math.cos(ff + 1.1) * 20, fy + Math.sin(ff + 1.1) * 20 + 2);
    ctx.rotate(Math.PI / 2 + (1 - settle) * 1.4);
    drawSwordProfile(ctx, 30, {});
    ctx.restore();
  }

  // the body
  const bodyA = clamp(1 - (t - 1.85) / 1.5, 0, 1);
  if (bodyA > 0) {
    let sink, flat, lean, tip;
    if (t < 0.75) {                       // the legs give out — he holds a moment on his knees
      const k = t / 0.75;
      const e = 1 - Math.pow(1 - k, 2);
      sink = e * 4; flat = e * 0.3; lean = e * 0.2; tip = e * 0.18;
    } else if (t < 1.55) {                // then pitches forward onto the stone
      const k = (t - 0.75) / 0.8;
      const e = k * k;                    // gathering speed as he goes over
      sink = 4 + e * 6; flat = 0.3 + e * 0.62; lean = 0.2 + e * 0.55; tip = 0.18 + e * 1.0;
    } else {
      sink = 10; flat = 0.92; lean = 0.75; tip = 1.18;
    }
    ctx.save();
    ctx.globalAlpha = bodyA;
    ctx.translate(fx + Math.cos(ff) * tip * 7, fy + sink + Math.sin(ff) * tip * 7);
    ctx.rotate(ff + lean * 0.25);
    ctx.scale(1 - flat * 0.1 + tip * 0.16, 1 - flat * 0.66);   // stretches out as he goes flat

    if (pairDead) {
      // the same man in the other clothes: torn short cloak pooling out
      ctx.fillStyle = '#4a3630';
      ctx.beginPath();
      ctx.moveTo(-1, -8);
      ctx.quadraticCurveTo(-12, -9 - flat * 4, -19 - flat * 6, -4);
      ctx.lineTo(-15 - flat * 6, -1);
      ctx.lineTo(-20 - flat * 6, 1);
      ctx.lineTo(-14 - flat * 6, 4);
      ctx.quadraticCurveTo(-12, 8 + flat * 4, -1, 8);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#241a17'; ctx.lineWidth = 1; ctx.stroke();

      // the narrow leather torso and the one looted pauldron
      const bgP = ctx.createRadialGradient(-2, -2, 1.5, 0, 0, 11);
      bgP.addColorStop(0, '#8d8377'); bgP.addColorStop(0.55, '#5f574d'); bgP.addColorStop(1, '#3a342e');
      ctx.fillStyle = bgP;
      ctx.beginPath(); ctx.ellipse(0, 0, 10, 8.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#221d19'; ctx.lineWidth = 1.3; ctx.stroke();
      ctx.fillStyle = '#9aa0a8';
      ctx.beginPath(); ctx.arc(-1, -8.5, 4.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(224,216,198,0.6)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-5, -7); ctx.lineTo(4, 6); ctx.stroke();

      // the hood settles over the face; the two dull points go out
      ctx.save();
      ctx.rotate(lean * 0.5);
      ctx.fillStyle = '#4a3630';
      ctx.beginPath();
      ctx.moveTo(13, 0);
      ctx.quadraticCurveTo(9, -9.5, -2, -7.5);
      ctx.quadraticCurveTo(-6, 0, -2, 7.5);
      ctx.quadraticCurveTo(9, 9.5, 13, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#241a17'; ctx.lineWidth = 1.1; ctx.stroke();
      ctx.fillStyle = '#100d0c';
      ctx.beginPath(); ctx.ellipse(7.5, 0, 4.6, 4.4, 0, 0, Math.PI * 2); ctx.fill();
      const eyeP = clamp(1 - t / 1.45, 0, 1);
      if (eyeP > 0.02) {
        ctx.globalAlpha = bodyA * eyeP * 0.55;
        ctx.drawImage(GLOW_RED, 4, -6, 12, 12);
        ctx.globalAlpha = bodyA;
        ctx.fillStyle = `rgba(226,124,100,${eyeP * 0.85})`;
        ctx.beginPath(); ctx.arc(8.6, -1.7, 0.95, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(8.6, 1.7, 0.95, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    } else {
      // cloak, pooling out behind him
      ctx.fillStyle = '#2d3a63';
      ctx.beginPath();
      ctx.moveTo(-2, -9);
      ctx.quadraticCurveTo(-16, -10 - flat * 5, -25 - flat * 8, -4);
      ctx.lineTo(-25 - flat * 8, 5);
      ctx.quadraticCurveTo(-16, 10 + flat * 5, -2, 9);
      ctx.closePath(); ctx.fill();

      // torso
      const bg = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
      bg.addColorStop(0, '#c9d2e2'); bg.addColorStop(0.6, '#98a3ba'); bg.addColorStop(1, '#5f6981');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2b3140'; ctx.lineWidth = 1.5; ctx.stroke();

      // pauldrons
      ctx.fillStyle = '#8894ab';
      ctx.beginPath(); ctx.arc(-1, -10.5, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(-1, 10.5, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // helm, tipping forward until it rests on the ground
      ctx.save();
      ctx.rotate(lean * 0.5);
      const hg = ctx.createLinearGradient(2, 0, 16, 0);
      hg.addColorStop(0, '#98a3ba'); hg.addColorStop(1, '#d7deeb');
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.moveTo(19, 0); ctx.lineTo(2, -8.5); ctx.lineTo(6, 0); ctx.lineTo(2, 8.5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#232938'; ctx.lineWidth = 1.2; ctx.stroke();
      // the light behind the visor goes out as he falls
      const eye = clamp(1 - t / 1.45, 0, 1);
      if (eye > 0.02) {
        ctx.globalAlpha = bodyA * eye * 0.7;
        ctx.drawImage(GLOW_BLUE, 3, -7, 14, 14);
        ctx.globalAlpha = bodyA;
        ctx.strokeStyle = `rgba(159,199,255,${eye})`;
        ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(10, -3.6); ctx.lineTo(14, 0); ctx.lineTo(10, 3.6); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  // and what is left of him leaves
  const wt = clamp(t - 2.0, 0, 3.2);
  if (wt > 0 && wt < 3.2) {
    const wy = fy - 10 - wt * 26;
    const wa = clamp(1 - wt / 3.2, 0, 0.85) * clamp(wt / 0.4, 0, 1);
    const wx = fx + Math.sin(t * 2.0) * 9;
    ctx.globalAlpha = wa;
    ctx.drawImage(pairDead ? GLOW_RED : GLOW_BLUE, wx - 14, wy - 14, 28, 28);
    ctx.globalAlpha = wa * 0.9;
    ctx.fillStyle = pairDead ? '#f0d9cf' : '#dceaff';
    ctx.beginPath(); ctx.arc(wx, wy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawBoss() {
  const dying = B.state === 'dying';
  const carving = B.state === 'carve';
  let alpha = 1;
  if (dying) alpha = clamp(1 - B.dieT / 1.3, 0, 1);
  if (G.screen === 'victory' && !carving) alpha = 0;
  if (alpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(B.x, B.y);

  /* out of the armor he is a much smaller man — the shrink eases in as he
     rises from the break, and the shard stays every bit as long */
  let shr = 1;
  if (B.phase2) shr = 0.58;
  else if (B.state === 'break') shr = 1 - 0.42 * clamp((B.stateT - 2.35) / 0.7, 0, 1);

  // shadow — pooled on the stone, flattened with the floor
  const zsh = 1 + (B.z || 0) / 70;                 // it spreads and fades as he leaves the ground
  ctx.fillStyle = `rgba(0,0,0,${0.46 / zsh})`;
  ctx.beginPath(); ctx.ellipse(0, 12 * shr, 38 * shr * zsh, 13 * shr * zsh, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(0,0,0,${0.18 / zsh})`;
  ctx.beginPath(); ctx.ellipse(0, 12 * shr, 56 * shr * zsh, 20 * shr * zsh, 0, 0, Math.PI * 2); ctx.fill();
  // he rises out of it further than you do — that is most of what he is
  ctx.scale(1, 1 / SQUASH);
  const bLift = (BPH().height * 0.9) * shr + (B.z || 0);
  drawStandColumn(bLift, 15 * shr, 26 * shr, '#0a080f', '#3b3049', B.flash > 0);
  ctx.translate(0, -bLift);

  ctx.rotate(B.face);
  ctx.scale(shr, shr);
  const stag = B.state === 'stagger';
  const dazed = B.state === 'daze';
  if (stag || dazed) ctx.rotate(0.32 * Math.sin(G.time * 3));
  if (B.state === 'hesitate' && B.stateT > 0.5 && B.stateT < 1.15) ctx.rotate(Math.sin(G.time * 40) * 0.012);
  // going down, and then going out
  if (carving && G.carve) {
    const cv = G.carve;
    let down = 1;                                   // 0 = upright, 1 = flat on the stone
    if (cv.phase === 'fall') down = clamp(cv.t / 1.5, 0, 1);
    const e = down * down;
    ctx.translate(Math.cos(0) * e * 6, e * 9);
    ctx.scale(1 - e * 0.06, 1 - e * 0.34);          // he settles onto the floor
    if (cv.phase === 'dissolve') ctx.globalAlpha = alpha * clamp(1 - cv.t / 1.9, 0, 1);
  } else if (B.state === 'break' && B.breakStep >= 1 && B.breakStep < 3) {
    ctx.scale(1, 0.86); ctx.translate(3, 0);
  }

  const tele = B.tele;
  const white = B.flash > 0;
  const mix = (c1, c2, t) => {
    const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const a = p(c1), b2 = p(c2);
    return `rgb(${Math.round(lerp(a[0], b2[0], t))},${Math.round(lerp(a[1], b2[1], t))},${Math.round(lerp(a[2], b2[2], t))})`;
  };
  const pulse = tele * (0.7 + 0.3 * Math.sin(G.time * 18));
  const breathe = B.state === 'idle' ? Math.sin(G.time * 1.9) * 0.9 : 0;
  const bodyCol = white ? '#ffffff' : mix('#4a3d52', ACCENT, pulse * 0.5);
  const plateCol = white ? '#ffffff' : mix('#6d586d', ACCENT, pulse * 0.65);
  const trimCol = white ? '#ffffff' : mix('#a68b9c', ACCENT, pulse * 0.85);

  // ---- tattered cloak, billowing behind ----
  const sw = Math.sin(G.time * 1.7), sw2 = Math.sin(G.time * 2.3 + 1.1);
  ctx.fillStyle = white ? '#ffffff' : mix('#2b2138', ACCENT, pulse * 0.25);
  ctx.beginPath();
  ctx.moveTo(-6, -30);
  ctx.quadraticCurveTo(-34, -34 + sw * 3, -52 + sw2 * 4, -20 + sw * 4);
  ctx.lineTo(-44, -10 + sw2 * 2);
  ctx.lineTo(-56 + sw * 3, -2);
  ctx.lineTo(-45, 5 + sw2 * 2);
  ctx.lineTo(-54 + sw2 * 3, 16 + sw * 3);
  ctx.lineTo(-42, 14);
  ctx.quadraticCurveTo(-34, 30 + sw * 3, -6, 30);
  ctx.closePath(); ctx.fill();

  ctx.translate(breathe * 0.5, 0);

  // ---- hulking body ----
  const bgrad = ctx.createLinearGradient(20, -30, -26, 30);
  bgrad.addColorStop(0, '#6b5a76'); bgrad.addColorStop(0.45, '#493c53'); bgrad.addColorStop(1, '#241d30');
  ctx.fillStyle = white ? '#ffffff' : (pulse > 0.02 ? bodyCol : bgrad);
  ctx.beginPath();
  ctx.moveTo(30, 0); ctx.lineTo(18, -24); ctx.lineTo(-16, -31);
  ctx.lineTo(-32, -12); ctx.lineTo(-32, 12); ctx.lineTo(-16, 31);
  ctx.lineTo(18, 24);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#0b0810';
