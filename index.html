/* =========================================================================
   RESET / FLOW
   ========================================================================= */
function resetFight() {
  P.x = ARENA.x + 130; P.y = ARENA.y + ARENA.h / 2;
  P.hp = P.hpMax; P.hpGhost = P.hpMax; P.st = P.stMax; P.stDelay = 0; P.stFlash = 0;
  P.walkT = 0; P.trail.length = 0; P.parryStreak = 0; P.blocking = false;
  P.flasks = P.flaskMax; P.face = 0; P.moveDirX = 1; P.moveDirY = 0;
  P.locked = false; P.act = null; P.hurtInv = 0; P.kbX = P.kbY = 0; P.flash = 0; P.dead = false;

  B.x = ARENA.x + ARENA.w - 170; B.y = ARENA.y + ARENA.h / 2;
  B.hp = B.hpMax; B.hpGhost = B.hpMax; B.face = Math.PI;
  B.phase2 = false; B.state = 'idle'; B.stateT = 0; B.cd = 1.1;
  B.atk = null; B.phaseIdx = 0; B.phaseT = 0; B.hitDone = false;
  B.poise = 0; B.staggerT = 0; B.wOff = 0.5; B.wLen = 70; B.tele = 0; B.flash = 0; B.dieT = 0;
  B.hesitated = false; B.mourned = false; B.flared = false;
  B.rampage = false; B.chainCount = 0; B.exposedT = 0; B.coreDim = 0; B.guarding = false;

  G.particles.length = 0; G.slashes.length = 0; G.dmgNums.length = 0; G.ring = null;
  G.hitstop = 0; G.shake = 0; G.flashAmber = 0; G.lastAggro = -10;
}
function goto(screen) { G.screen = screen; G.screenT = 0; }

/* =========================================================================
   COMBAT HELPERS
   ========================================================================= */
function spawnParticles(x, y, n, col, sp, life) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(sp * 0.3, sp);
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(life * 0.5, life), maxLife: life, col, size: rand(1.5, 4) });
  }
}
function addSlash(x, y, ang, r, half, col, dur) {
  G.slashes.push({ x, y, ang, r, half, col, t: 0, dur });
}

function playerInvulnerable() {
  if (P.hurtInv > 0) return true;
  if (P.act && P.act.type === 'roll' && P.act.t < P.act.dur * 0.6) return true;
  return false;
}

// A successful parry: the strike is turned, Osric reels, and clean streaks expose him.
function onParrySuccess() {
  if (P.act) P.act.success = true;
  P.act = null;                              // instant recovery — the window is the reward
  P.hurtInv = Math.max(P.hurtInv, 0.3);
  P.parryStreak++;
  const mx = (P.x + B.x) / 2, my = (P.y + B.y) / 2;
  spawnParticles(mx, my, 22, '#ffe9a8', 260, 0.5);
  spawnParticles(mx, my, 10, '#f2f6ff', 330, 0.3);
  addSlash(mx, my, Math.atan2(P.y - B.y, P.x - B.x), 44, Math.PI, '#ffe9a8', 0.12);
  G.hitstop = Math.max(G.hitstop, 0.09);
  G.shake = Math.max(G.shake, 7);
  sfx.parry();
  rumble(140, 0.5, 0.9);
  // Osric reels off the deflection
  if (B.state !== 'dying' && B.state !== 'stagger') {
    B.state = 'recoil'; B.stateT = 0; B.atk = null; B.tele = 0; B.chainCount = 0;
    B.poise += 1;
    if (B.poise >= 6) {
      B.state = 'stagger'; B.stateT = 0; B.staggerT = 1.5; B.poise = 0;
      sfx.stagger();
      G.shake = Math.max(G.shake, 8);
      spawnParticles(B.x, B.y, 24, ACCENT, 220, 0.6);
    }
  }
  if (P.parryStreak >= 5) {                  // five clean turns of the blade — he is EXPOSED
    P.parryStreak = 0;
    B.exposedT = 10;
    sfx.exposed();
    spawnParticles(B.x, B.y, 30, '#e8c15a', 250, 0.8);
    G.shake = Math.max(G.shake, 6);
    rumble(320, 0.4, 0.85);
  }
}

function damagePlayer(dmg, srcX, srcY, parryable) {
  if (P.dead) return false;
  // parry — active window at the start of the attempt turns any parryable strike
  if (parryable && P.act && P.act.type === 'parry' && P.act.t >= 0.02 && P.act.t <= 0.2) {
    onParrySuccess();
    return true;                             // the swing is spent on the deflection
  }
  if (playerInvulnerable()) return false;
  // block — guard held, attack from the front
  if (P.blocking && P.st > 0) {
    const toSrc = Math.atan2(srcY - P.y, srcX - P.x);
    if (Math.abs(angDiff(P.face, toSrc)) < 1.75) {
      const cost = 14 + dmg * 0.45;
      if (P.st >= cost) {                    // the guard holds — chip damage + stamina
        P.st -= cost; P.stDelay = 0.7;
        P.hp -= Math.max(1, Math.round(dmg * 0.22));
        P.hurtInv = Math.max(P.hurtInv, 0.2);
        const ba = Math.atan2(P.y - srcY, P.x - srcX);
        P.kbX = Math.cos(ba) * 130; P.kbY = Math.sin(ba) * 130;
        spawnParticles(P.x + Math.cos(toSrc) * 14, P.y + Math.sin(toSrc) * 14, 8, '#cfd6e4', 180, 0.35);
        G.hitstop = Math.max(G.hitstop, 0.035);
        G.shake = Math.max(G.shake, 4);
        sfx.block();
        rumble(90, 0.3, 0.5);
        if (P.hp <= 0) { P.hp = 0; P.dead = true; killPlayer(); }
        return true;
      }
      // not enough stamina behind the shield-arm — GUARD BREAK
      P.st = -25; P.stDelay = 0.9;
      dmg = Math.round(dmg * 0.5);
      P.hp -= dmg;
      P.flash = 0.12;
      P.hurtInv = 0.45;
      P.parryStreak = 0;
      const gba = Math.atan2(P.y - srcY, P.x - srcX);
      P.kbX = Math.cos(gba) * 330; P.kbY = Math.sin(gba) * 330;
      P.act = { type: 'hurt', t: 0, dur: 0.7 };
      G.hitstop = Math.max(G.hitstop, 0.08);
      G.shake = Math.max(G.shake, 11);
      spawnParticles(P.x, P.y, 16, '#c33b3b', 200, 0.5);
      sfx.guardBreak();
      rumble(320, 1.0, 0.6);
      if (P.hp <= 0) { P.hp = 0; P.dead = true; killPlayer(); }
      return true;
    }
  }
  P.hp -= dmg;
  P.flash = 0.12;
  P.hurtInv = 0.45;
  P.parryStreak = 0;                          // a clean hit ends the streak
  const a = Math.atan2(P.y - srcY, P.x - srcX);
  P.kbX = Math.cos(a) * 260; P.kbY = Math.sin(a) * 260;
  const wasFlask = P.act && P.act.type === 'flask';
  P.act = { type: 'hurt', t: 0, dur: 0.35 };
  if (wasFlask) sfx.flaskEmpty(); // the sip is wasted
  G.hitstop = Math.max(G.hitstop, 0.07);
  G.shake = Math.max(G.shake, 9 + dmg * 0.15);
  spawnParticles(P.x, P.y, 14, '#c33b3b', 190, 0.5);
  sfx.playerHit();
  rumble(220, 0.95, 0.5);
  if (P.hp <= 0) { P.hp = 0; P.dead = true; killPlayer(); }
  return true;
}

function killPlayer() {
  P.act = null;
  sfx.bell();
  rumble(500, 0.8, 0.8);
  goto('dead');
}

function damageBoss(dmg) {
  if (B.state === 'dying' || G.screen !== 'fight') return;
  if (B.exposedT > 0) dmg *= 2;              // five parries left him open
  B.hp -= dmg;
  B.flash = 0.1;
  B.poise += 1;
  G.hitstop = Math.max(G.hitstop, 0.07);
  G.shake = Math.max(G.shake, 4);
  const a = Math.atan2(P.y - B.y, P.x - B.x);
  spawnParticles(B.x + Math.cos(a) * B.r, B.y + Math.sin(a) * B.r, 10, '#e8e2d0', 170, 0.4);
  G.dmgNums.push({ x: B.x + Math.cos(a) * (B.r + 10), y: B.y + Math.sin(a) * (B.r + 10) - 6, v: dmg, t: 0 });
  sfx.hit();
  rumble(70, 0.15, 0.5);

  if (B.poise >= 6 && B.state !== 'stagger' && B.state !== 'roar' && B.state !== 'hesitate' && B.state !== 'flare') {
    B.state = 'stagger'; B.stateT = 0; B.staggerT = 1.5; B.poise = 0;
    B.atk = null; B.tele = 0;
    sfx.stagger();
    G.shake = Math.max(G.shake, 8);
    spawnParticles(B.x, B.y, 24, ACCENT, 220, 0.6);
  }
  if (B.hp <= 0) {
    B.hp = 0; B.state = 'dying'; B.dieT = 0; B.atk = null; B.tele = 0;
    P.locked = false;
    G.shake = 12;
    sfx.slamImpact();
    spawnParticles(B.x, B.y, 60, '#d9c98a', 260, 1.1);
  }
}

function spendStamina(cost) { P.st = Math.max(-25, P.st - cost); P.stDelay = 0.7; }

/* =========================================================================
   PLAYER UPDATE
   ========================================================================= */
function updatePlayer(dt) {
  if (P.dead) return;
  P.hurtInv = Math.max(0, P.hurtInv - dt);
  P.flash = Math.max(0, P.flash - dt);
  P.stFlash = Math.max(0, P.stFlash - dt * 2.2);
  P.hpGhost = Math.max(P.hp, P.hpGhost - P.hpMax * 0.3 * dt);

  // knockback decay
  P.x += P.kbX * dt; P.y += P.kbY * dt;
  P.kbX -= P.kbX * 10 * dt; P.kbY -= P.kbY * 10 * dt;

  const mvX = Input.moveX, mvY = Input.moveY, mag = Input.moveMag;
  if (mag > 0.01) { P.moveDirX = mvX / (Math.hypot(mvX, mvY) || 1); P.moveDirY = mvY / (Math.hypot(mvX, mvY) || 1); }

  // lock-on toggle
  if (Input.lock && G.screen === 'fight') {
    if (B.state !== 'dying') P.locked = !P.locked;
  }
  if (B.state === 'dying') P.locked = false;

  // facing
  if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
  else if (mag > 0.01 && (!P.act || P.act.type === 'flask')) P.face = Math.atan2(mvY, mvX);

  // guard is a held stance, only while otherwise free
  P.blocking = Input.blockHeld && !P.act && G.screen === 'fight';

  const busy = P.act && P.act.type !== 'flask';
  const sprinting = Input.sprint && !busy && !P.blocking && mag > 0.01 && P.st > 0;

  /* ---- start buffered actions ---- */
  const canAct = !P.act || (P.act.type === 'flask'); // roll may cancel flask (wastes rest of the sip)
  if (canAct && G.screen === 'fight') {
    const want = Input.peekBuffer();
    if (want === 'roll' && P.st > 0) {
      Input.consumeBuffer();
      spendStamina(25);
      let dx = P.moveDirX, dy = P.moveDirY;
      if (mag <= 0.01) {
        if (P.locked) { const a = Math.atan2(P.y - B.y, P.x - B.x); dx = Math.cos(a); dy = Math.sin(a); }
        else { dx = Math.cos(P.face); dy = Math.sin(P.face); }
      } else { dx = mvX / (Math.hypot(mvX, mvY) || 1); dy = mvY / (Math.hypot(mvX, mvY) || 1); }
      P.act = { type: 'roll', t: 0, dur: 0.45, dirX: dx, dirY: dy };
      sfx.roll();
    } else if ((want === 'light' || want === 'heavy') && (!P.act) && P.st > 0) {
      Input.consumeBuffer();
      const heavy = want === 'heavy';
      spendStamina(heavy ? 35 : 20);
      if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
      P.act = { type: want, t: 0, dur: heavy ? 0.8 : 0.45, hitDone: false, face: P.face };
      G.lastAggro = G.time;                  // swinging reads as aggression
      sfx.swing(heavy);
    } else if (want === 'parry' && !P.act && P.st > 0) {
      Input.consumeBuffer();
      spendStamina(10);
      if (P.locked) P.face = Math.atan2(B.y - P.y, B.x - P.x);
      P.act = { type: 'parry', t: 0, dur: 0.45, success: false };
      sfx.swing(false);
    } else if ((want === 'light' || want === 'heavy' || want === 'roll' || want === 'parry') && P.st <= 0) {
      // not enough stamina — drop it and flash the stamina bar
      Input.consumeBuffer();
      P.stFlash = 0.4;
    }
  }
  // flask (not buffered; explicit press)
  if (Input.flask && !P.act && G.screen === 'fight') {
    if (P.flasks > 0) {
      P.flasks -= 1;
      P.act = { type: 'flask', t: 0, dur: 1.0 };
      sfx.gulp();
    } else sfx.flaskEmpty();
  }

  /* ---- run current action ---- */
  let speedMul = 1;
  if (P.act) {
    P.act.t += dt;
    const a = P.act;
    if (a.type === 'roll') {
      const k = a.t / a.dur;
      const sp = 470 * (1 - k * 0.75);
      P.x += a.dirX * sp * dt; P.y += a.dirY * sp * dt;
      P.trail.push({ x: P.x, y: P.y, rot: Math.atan2(a.dirY, a.dirX), a: 0.9 });
      if (a.dirX * (B.x - P.x) + a.dirY * (B.y - P.y) > 0) G.lastAggro = G.time; // rolling in counts
      speedMul = 0;
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'light' || a.type === 'heavy') {
      speedMul = 0;
      const heavy = a.type === 'heavy';
      const wStart = heavy ? 0.34 : 0.14, wEnd = heavy ? 0.5 : 0.27;
      if (heavy && a.t > 0.15 && a.t < 0.45) { P.x += Math.cos(a.face) * 150 * dt; P.y += Math.sin(a.face) * 150 * dt; }
      if (!a.hitDone && a.t >= wStart && a.t <= wEnd) {
        const r1 = heavy ? 94 : 80, half = heavy ? 1.35 : 1.2;
        const d = dist(P.x, P.y, B.x, B.y);
        if (d < r1 + B.r && Math.abs(angDiff(a.face, Math.atan2(B.y - P.y, B.x - P.x))) < half + Math.asin(clamp(B.r / Math.max(d, B.r), 0, 1))) {
          a.hitDone = true;
          damageBoss(heavy ? 58 : 30);
        }
      }
      if (a.t >= wStart && !a.slashed) { a.slashed = true; addSlash(P.x, P.y, a.face, heavy ? 94 : 80, heavy ? 1.3 : 1.1, '#dfe6f2', 0.16); }
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'parry') {
      speedMul = 0;
      if (a.t >= a.dur) {
        if (!a.success) P.parryStreak = 0;   // a whiffed parry breaks the streak
        P.act = null;
      }
    } else if (a.type === 'flask') {
      speedMul = 0.42;
      P.hp = Math.min(P.hpMax, P.hp + 45 * dt / 1.0);
      if (a.t >= a.dur) P.act = null;
    } else if (a.type === 'hurt') {
      speedMul = 0;
      if (a.t >= a.dur) P.act = null;
    }
  }

  /* ---- movement ---- */
  if (speedMul > 0 || !P.act) {
    const base = sprinting ? 265 : (P.blocking ? 96 : 175);
    const sp = base * mag * (P.act ? speedMul : 1);
    P.x += mvX * sp * dt; P.y += mvY * sp * dt;
    P.walkT += sp * dt * 0.05;
    // closing distance reads as aggression
    if (mag > 0.01) {
      const ux = B.x - P.x, uy = B.y - P.y, ul = Math.hypot(ux, uy) || 1;
      if ((mvX * ux + mvY * uy) / ul * sp > 70) G.lastAggro = G.time;
    }
  }

  /* ---- stamina regen: delayed, never while sprinting or mid-action ---- */
  P.stDelay = Math.max(0, P.stDelay - dt);
  if (P.stDelay <= 0 && !sprinting && !P.act) P.st = Math.min(P.stMax, P.st + 25 * (P.blocking ? 0.4 : 1) * dt);

  // clamp to arena
  P.x = clamp(P.x, ARENA.x + P.r, ARENA.x + ARENA.w - P.r);
  P.y = clamp(P.y, ARENA.y + P.r, ARENA.y + ARENA.h - P.r);

  // body separation vs boss
  if (B.state !== 'dying') {
    const d = dist(P.x, P.y, B.x, B.y), minD = P.r + B.r - 4;
    if (d < minD && d > 0.001) {
      const a = Math.atan2(P.y - B.y, P.x - B.x);
      P.x = B.x + Math.cos(a) * minD; P.y = B.y + Math.sin(a) * minD;
      P.x = clamp(P.x, ARENA.x + P.r, ARENA.x + ARENA.w - P.r);
      P.y = clamp(P.y, ARENA.y + P.r, ARENA.y + ARENA.h - P.r);
    }
  }
}

/* =========================================================================
   BOSS UPDATE
   ========================================================================= */
function bossStartAttack(name) {
  B.atk = name; B.phaseIdx = 0; B.phaseT = 0; B.hitDone = false;
  B.state = 'attack'; B.stateT = 0;
  B.phaseDur = phaseDuration(ATK[name].phases[0], name);
}
function phaseDuration(ph, name) {
  let d = ph.d;
  if (ph.k === 'w' || ph.k === 'g') {
    if (B.rampage) d = ph.d * 0.62;          // rampage REPLACES the phase-2 multiplier (from base)
    else if (B.phase2 && !ph.noSpeed) d = ph.d * 0.76;
  }
  return d;
}
function chooseAttack() {
  const d = dist(B.x, B.y, P.x, P.y);
  if (d > 260 && Math.random() < 0.85) return 'lunge';
  const pool = [['slam', 1.0], ['sweep', 1.1], ['combo', 0.95]];
  if (B.phase2) { pool.push(['shock', 0.85], ['delayed', 1.0]); }
  if (d > 180) pool.push(['lunge', 0.9]);
  let tot = 0; for (const p of pool) tot += p[1];
  let r = Math.random() * tot;
  for (const p of pool) { r -= p[1]; if (r <= 0) return p[0]; }
  return 'slam';
}

function updateBoss(dt) {
  B.flash = Math.max(0, B.flash - dt);
  B.hpGhost = Math.max(B.hp, B.hpGhost - B.hpMax * 0.35 * dt);
  B.poise = Math.max(0, B.poise - 0.85 * dt);
  B.stateT += dt;
  B.exposedT = Math.max(0, B.exposedT - dt);
  if (B.state !== 'hesitate') B.coreDim = Math.max(0, B.coreDim - 1.2 * dt);

  // phase-2 embers drift off the Keeper — a storm of them in the rampage
  if (B.phase2 && B.state !== 'dying' && Math.random() < dt * (B.rampage ? 22 : 8)) {
    G.particles.push({ x: B.x + rand(-26, 26), y: B.y + rand(-26, 26), vx: rand(-10, 10), vy: rand(-48, -22), life: rand(0.4, 0.9), maxLife: 0.9, col: ACCENT, size: rand(1.5, 3) });
  }

  if (B.state === 'dying') {
    B.dieT += dt;
    B.tele = 0;
    if (B.dieT > 1.35 && G.screen === 'fight') { goto('victory'); }
    return;
  }

  // phase 2 trigger
  if (!B.phase2 && B.hp <= B.hpMax * 0.5 && B.state !== 'roar') {
    B.phase2 = true;
    B.state = 'roar'; B.stateT = 0; B.atk = null; B.tele = 0;
    sfx.roar();
    rumble(1000, 1.0, 0.7);
    G.shake = Math.max(G.shake, 14);
    spawnParticles(B.x, B.y, 40, ACCENT, 300, 0.9);
    return;
  }

  const angToP = Math.atan2(P.y - B.y, P.x - B.x);

  if (B.state === 'roar') {
    B.wOff = lerp(B.wOff, 0.9, 6 * dt); B.wLen = lerp(B.wLen, 55, 6 * dt);
    if (B.stateT >= 1.6) { B.state = 'idle'; B.cd = 0.35; }
    return;
  }

  if (B.state === 'stagger') {
    B.staggerT -= dt;
    B.tele = 0;
    B.wOff = lerp(B.wOff, 1.6, 5 * dt); B.wLen = lerp(B.wLen, 60, 5 * dt);
    if (B.staggerT <= 0) { B.state = 'idle'; B.cd = 0.6; }
    return;
  }

  // THE HESITATION — once per attempt. He raises the blade like the slam
  // the player has learned to fear... and cannot bring it down.
  if (B.state === 'hesitate') {
    const t = B.stateT;
    if (t < 0.5) {                                  // the raise, indistinguishable from a kill blow
      const k = t / 0.5;
      B.wOff = lerp(0.5, 0.05, k); B.wLen = lerp(70, 28, k);
      B.tele = k * 0.85;
      B.face = turnToward(B.face, angToP, 1.6 * dt);
    } else if (t < 1.15) {                          // held at the top — and nothing comes
      B.tele = 0;
      B.coreDim = Math.min(1, B.coreDim + 4 * dt);
      if (!B.mourned) { B.mourned = true; sfx.mourn(); }
    } else if (t < 2.45) {                          // the blade comes down, unswung
      const k = (t - 1.15) / 1.3;
      B.wOff = lerp(0.05, 1.35, k); B.wLen = lerp(28, 70, k);
      B.coreDim = 1;
    } else {
      B.hesitated = true;                           // never again this attempt
      B.state = 'flare'; B.stateT = 0; B.flared = false;
    }
    return;
  }

  // THE RAMPAGE ignites — a silent beat, then he makes himself do it
  if (B.state === 'flare') {
    const t = B.stateT;
    B.tele = 0;
    if (t < 0.35) {
      B.coreDim = Math.max(0, 1 - t / 0.35);
    } else {
      if (!B.flared) {
        B.flared = true;
        B.rampage = true;
        B.coreDim = 0;
        sfx.flare();
        G.shake = Math.max(G.shake, 14);
        G.flashAmber = 0.55;
        rumble(800, 1.0, 0.85);
        spawnParticles(B.x, B.y, 50, ACCENT, 320, 1.0);
      }
      B.wOff = lerp(B.wOff, 0.5, 8 * dt); B.wLen = lerp(B.wLen, 70, 8 * dt);
    }
    if (t >= 0.95) { B.state = 'idle'; B.cd = 0.25; }
    return;
  }

  // knocked off balance by a parry
  if (B.state === 'recoil') {
    B.tele = 0;
    B.wOff = lerp(B.wOff, -1.45, 7 * dt); B.wLen = lerp(B.wLen, 82, 7 * dt);
    if (B.stateT < 0.2) {
      B.x -= Math.cos(B.face) * 55 * dt; B.y -= Math.sin(B.face) * 55 * dt;
      B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
      B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
    }
    if (B.stateT >= 0.85) { B.state = 'idle'; B.cd = B.rampage ? rand(0.3, 0.6) : 0.75; }
    return;
  }

  // between chained rampage attacks: weapon low, breathing heavy — a real window
  if (B.state === 'chainPause') {
    B.tele = 0;
    B.wOff = lerp(B.wOff, 1.2, 6 * dt); B.wLen = lerp(B.wLen, 66, 6 * dt);
    B.face = turnToward(B.face, angToP, 1.0 * dt);
    if (B.stateT >= B.pauseDur) { B.chainCount++; bossStartAttack(chooseAttack()); }
    return;
  }

  if (B.state === 'idle') {
    B.tele = Math.max(0, B.tele - 4 * dt);
    // REACTIVE STANCE (phase 1): if the player shows no aggression, he does not
    // press the fight — he circles, holds guard, and waits at the threshold.
    const passive = !B.phase2 && (G.time - G.lastAggro > 1.4);
    B.guarding = passive;
    B.wOff = lerp(B.wOff, passive ? 1.1 : 0.5, 4 * dt);
    B.wLen = lerp(B.wLen, passive ? 76 : 70, 4 * dt);
    B.face = turnToward(B.face, angToP, 3.2 * dt);
    const d = dist(B.x, B.y, P.x, P.y);
    // reposition — a waiting Osric keeps his distance instead of closing
    if (d > (passive ? 250 : 155)) {
      const sp = d > 300 ? 165 : 108;
      B.x += Math.cos(angToP) * sp * dt; B.y += Math.sin(angToP) * sp * dt;
    } else {
      B.strafeT -= dt;
      if (B.strafeT <= 0) { B.strafeDir = Math.random() < 0.5 ? -1 : 1; B.strafeT = rand(0.8, 1.8); }
      const sa = angToP + Math.PI / 2 * B.strafeDir;
      B.x += Math.cos(sa) * (passive ? 72 : 55) * dt; B.y += Math.sin(sa) * (passive ? 72 : 55) * dt;
    }
    B.cd -= dt * (passive ? 0.15 : 1);
    if (B.cd <= 0) {
      if (B.phase2 && !B.hesitated && !B.rampage && P.hp <= 35) {
        B.state = 'hesitate'; B.stateT = 0; B.mourned = false;
      } else if (passive && Math.random() < 0.6) {
        B.cd = rand(0.9, 1.6);                      // he shifts his guard and keeps waiting
      } else {
        B.chainCount = 1;
        bossStartAttack(chooseAttack());
      }
    }
  } else if (B.state === 'attack' && B.atk) {
    const atk = ATK[B.atk];
    const ph = atk.phases[B.phaseIdx];
    const pdur = B.phaseDur;
    B.phaseT += dt;
    const k = clamp(B.phaseT / pdur, 0, 1);

    // pose interpolation
    B.wOff = lerp(ph.w[0], ph.w[1], k);
    B.wLen = lerp(ph.L[0], ph.L[1], k);

    // telegraph intensity: ramps during windups, flickers on the delayed swing
    if (ph.k === 'w') {
      B.tele = ph.flicker ? (0.45 + 0.55 * Math.abs(Math.sin(G.time * 11))) * (0.35 + 0.65 * k) : k;
    } else if (ph.k === 'g' && ph.flicker) {
      B.tele = 0.9;
    } else if (ph.k === 'a' || ph.k === 'ring') {
      B.tele = Math.max(0, B.tele - 8 * dt);
    } else {
      B.tele = Math.max(0, B.tele - 6 * dt);
    }

    // tracking during windups/gaps only — active phases are committed
    if ((ph.k === 'w' || ph.k === 'g') && ph.track) {
      const tr = ph.track * (B.phase2 ? 1.15 : 1);
      B.face = turnToward(B.face, angToP, tr * dt);
    }

    // movement within a phase
    if (ph.move) {
      B.x += Math.cos(B.face) * ph.move.sp * dt;
      B.y += Math.sin(B.face) * ph.move.sp * dt;
    }

    // entering active: swing sound, spawn ring
    if ((ph.k === 'a' || ph.k === 'ring') && !B.phaseStarted) {
      B.phaseStarted = true; B.hitDone = false;
      if (ph.k === 'ring') {
        G.ring = { x: B.x, y: B.y, r: B.r + 6, speed: ph.ring.speed, width: ph.ring.width, maxR: ph.ring.maxR, dmg: ph.dmg, hitDone: false };
        sfx.slamImpact();
        G.shake = Math.max(G.shake, ph.shake || 6);
        spawnParticles(B.x, B.y, 22, ACCENT, 240, 0.6);
        rumble(180, 0.6, 0.3);
      } else {
        sfx.bossSwing();
        if (ph.hit && ph.hit.s === 'arc') {
          addSlash(B.x, B.y, B.face + (ph.w[0] + ph.w[1]) / 2, ph.hit.r1, ph.hit.half, ACCENT, 0.18);
        }
      }
    }

    // active hit check
    if (ph.k === 'a' && ph.hit && !B.hitDone) {
      let hit = false;
      if (ph.hit.s === 'arc') {
        const d = dist(B.x, B.y, P.x, P.y);
        if (d > ph.hit.r0 - P.r && d < ph.hit.r1 + P.r) {
          const rel = Math.abs(angDiff(B.face, Math.atan2(P.y - B.y, P.x - B.x)));
          if (rel < ph.hit.half + Math.asin(clamp(P.r / Math.max(d, P.r), 0, 1))) hit = true;
        }
      } else if (ph.hit.s === 'c') {
        const cx = B.x + Math.cos(B.face) * ph.hit.dist, cy = B.y + Math.sin(B.face) * ph.hit.dist;
        if (dist(cx, cy, P.x, P.y) < ph.hit.r + P.r) hit = true;
      }
      if (hit) {
        B.hitDone = damagePlayer(ph.dmg, B.x, B.y, true) || B.hitDone;
        if (B.state !== 'attack') { B.phaseStarted = false; return; } // a parry knocked him out of the swing
      }
      // ground impact feedback once, at start of active
      if (ph.impact && !B.impacted) {
        B.impacted = true;
        sfx.slamImpact();
        G.shake = Math.max(G.shake, ph.shake || 8);
        const cx = B.x + Math.cos(B.face) * (ph.hit.dist || 70), cy = B.y + Math.sin(B.face) * (ph.hit.dist || 70);
        spawnParticles(cx, cy, 18, '#8a7f6a', 200, 0.55);
      }
    }

    // advance phase
    if (B.phaseT >= pdur) {
      B.phaseIdx++;
      B.phaseT = 0; B.phaseStarted = false; B.impacted = false;
      if (B.phaseIdx >= atk.phases.length) {
        B.atk = null;
        // rampage: he refuses to stop — chains into another attack after a
        // heaving pause that is itself the punish window
        if (B.rampage && B.chainCount < 4 && Math.random() < 0.7) {
          B.state = 'chainPause'; B.stateT = 0; B.pauseDur = rand(0.45, 0.7);
        } else {
          B.chainCount = 0;
          B.state = 'idle'; B.stateT = 0;
          B.cd = B.rampage ? rand(0.15, 0.5) : (B.phase2 ? rand(0.35, 0.85) : rand(0.65, 1.3));
        }
      } else {
        B.phaseDur = phaseDuration(atk.phases[B.phaseIdx], B.atk);
      }
    }
  }

  // clamp boss to arena
  B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r);
  B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);
}

/* ---------- shockwave ring ---------- */
function updateRing(dt) {
  const r = G.ring;
  if (!r) return;
  r.r += r.speed * dt;
  if (!r.hitDone) {
    const d = dist(r.x, r.y, P.x, P.y);
    if (Math.abs(d - r.r) < r.width / 2 + P.r * 0.6) {
      if (damagePlayer(r.dmg, r.x, r.y)) r.hitDone = true;
      else if (playerInvulnerable()) r.hitDone = true; // rolled through it — it's past you now
    }
  }
  if (r.r > r.maxR) G.ring = null;
}

/* =========================================================================
   UPDATE DISPATCH
   ========================================================================= */
function update(dt) {
  G.time += dt;
  G.screenT += dt;
  G.shake = Math.max(0, G.shake - G.shake * 7 * dt - 2 * dt);
  G.flashAmber = Math.max(0, G.flashAmber - 1.1 * dt);

  // particles & slashes always tick
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 4 * dt); p.vy *= (1 - 4 * dt);
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.slashes.length - 1; i >= 0; i--) {
    G.slashes[i].t += dt;
    if (G.slashes[i].t > G.slashes[i].dur) G.slashes.splice(i, 1);
  }
  for (let i = G.dmgNums.length - 1; i >= 0; i--) {
    G.dmgNums[i].t += dt;
    if (G.dmgNums[i].t > 0.7) G.dmgNums.splice(i, 1);
  }
  for (let i = P.trail.length - 1; i >= 0; i--) {
    P.trail[i].a -= 4.5 * dt;
    if (P.trail[i].a <= 0) P.trail.splice(i, 1);
  }

  switch (G.screen) {
    case 'title':
      if (Input.confirm) {
        resetFight();
        sfx.fog();
        goto(G.firstFight ? 'intro' : 'refade');
      }
      break;
    case 'intro': {
      // fog-gate walk-in
      const t = G.screenT;
      P.x = lerp(ARENA.x + 60, ARENA.x + 130, clamp(t / 1.5, 0, 1));
      P.face = 0;
      if (t >= 1.6 || Input.confirm) { G.firstFight = false; goto('fight'); }
      break;
    }
    case 'refade':
      if (G.screenT >= 0.45) goto('fight');
      break;
    case 'fight':
      updatePlayer(dt);
      updateBoss(dt);
      updateRing(dt);
      break;
    case 'dead':
      // world freezes behind the overlay; boss finishes its swing cosmetically
      B.tele = Math.max(0, B.tele - dt);
      if (G.screenT > 2.1 && Input.confirm) {
        resetFight();
        goto('refade');
      }
      break;
    case 'victory':
      if (!G.victoryChimed && G.screenT > 0.4) { G.victoryChimed = true; sfx.chime(); }
      if (G.screenT > 2.3 && Input.confirm) {
        G.victoryChimed = false;
        resetFight();
        goto('refade');
      }
      break;
  }
}

/* =========================================================================
   RENDERING
   ========================================================================= */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawFloor() {
  ctx.fillStyle = '#0b0d12';
  ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 480);
  g.addColorStop(0, '#232939');
  g.addColorStop(0.7, '#191e2b');
  g.addColorStop(1, '#10131c');
  ctx.fillStyle = g;
  ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  for (const c of G.floorCracks) {
    ctx.beginPath(); ctx.moveTo(c.x1, c.y1); ctx.lineTo(c.x2, c.y2); ctx.stroke();
  }
  // stone flagging
  ctx.strokeStyle = 'rgba(255,255,255,0.028)';
  ctx.lineWidth = 1;
  for (let gx = ARENA.x + 54; gx < ARENA.x + ARENA.w; gx += 54) {
    ctx.beginPath(); ctx.moveTo(gx, ARENA.y); ctx.lineTo(gx, ARENA.y + ARENA.h); ctx.stroke();
  }
  for (let gy = ARENA.y + 54; gy < ARENA.y + ARENA.h; gy += 54) {
    ctx.beginPath(); ctx.moveTo(ARENA.x, gy); ctx.lineTo(ARENA.x + ARENA.w, gy); ctx.stroke();
  }

  // ritual sigil at the arena's heart
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.strokeStyle = 'rgba(150,160,190,0.1)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 122, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 112, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 58, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = `rgba(255,158,44,${B.phase2 ? 0.14 : 0.07})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {                       // inscribed pentacle
    const a = -Math.PI / 2 + (i * 4 * Math.PI * 2) / 5;
    const x = Math.cos(a) * 112, y = Math.sin(a) * 112;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();

  // corner braziers — the arena's only warm light
  for (const c of [[ARENA.x + 34, ARENA.y + 34], [ARENA.x + ARENA.w - 34, ARENA.y + 34],
                   [ARENA.x + 34, ARENA.y + ARENA.h - 34], [ARENA.x + ARENA.w - 34, ARENA.y + ARENA.h - 34]]) {
    const fl = 0.75 + 0.25 * Math.sin(G.time * 7 + c[0] * 0.1);
    const g2 = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], 90 * fl);
    g2.addColorStop(0, 'rgba(255,158,44,0.16)');
    g2.addColorStop(0.5, 'rgba(255,120,40,0.05)');
    g2.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(c[0], c[1], 90 * fl, 0, Math.PI * 2); ctx.fill();
    // bowl
    ctx.fillStyle = '#2a2530';
    ctx.beginPath(); ctx.moveTo(c[0] - 9, c[1] - 4); ctx.lineTo(c[0] + 9, c[1] - 4);
    ctx.lineTo(c[0] + 6, c[1] + 6); ctx.lineTo(c[0] - 6, c[1] + 6); ctx.closePath(); ctx.fill();
    // flame
    ctx.fillStyle = `rgba(255,${150 + Math.floor(60 * fl)},60,${0.85 * fl})`;
    ctx.beginPath();
    ctx.moveTo(c[0], c[1] - 12 - 5 * fl);
    ctx.quadraticCurveTo(c[0] + 6, c[1] - 4, c[0], c[1] - 3);
    ctx.quadraticCurveTo(c[0] - 6, c[1] - 4, c[0], c[1] - 12 - 5 * fl);
    ctx.fill();
  }

  // drifting ash motes
  ctx.fillStyle = 'rgba(200,190,170,0.16)';
  for (let i = 0; i < 30; i++) {
    const sx = (i * 137.5) % ARENA.w;
    const sy = ((i * 71.3) + G.time * (12 + (i % 5) * 6)) % ARENA.h;
    const wob = Math.sin(G.time * 0.8 + i) * 6;
    ctx.fillRect(ARENA.x + sx + wob, ARENA.y + ARENA.h - sy, 1.6, 1.6);
  }
}

// One baked radial-gradient sprite, blitted for every wisp — far cheaper on
// mobile than building 40+ gradients per frame.
const FOG_SPRITE = (() => {
  const s = document.createElement('canvas');
  s.width = s.height = 64;
  const c = s.getContext('2d');
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(150,165,205,1)');
  g.addColorStop(1, 'rgba(150,165,205,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, 64, 64);
  return s;
})();

function drawFogWall() {
  const t = G.time;
  ctx.save();
  // border band
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(130,148,190,0.4)';
  roundRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h, 10);
  ctx.stroke();
  // drifting wisps along each edge
  ctx.globalAlpha = 1;
  for (let i = 0; i < 42; i++) {
    const u = (i / 42 + t * 0.014 * (i % 3 === 0 ? 1.6 : 1)) % 1;
    const per = 2 * (ARENA.w + ARENA.h);
    let p = u * per, x, y;
    if (p < ARENA.w) { x = ARENA.x + p; y = ARENA.y; }
    else if (p < ARENA.w + ARENA.h) { x = ARENA.x + ARENA.w; y = ARENA.y + (p - ARENA.w); }
    else if (p < 2 * ARENA.w + ARENA.h) { x = ARENA.x + ARENA.w - (p - ARENA.w - ARENA.h); y = ARENA.y + ARENA.h; }
    else { x = ARENA.x; y = ARENA.y + ARENA.h - (p - 2 * ARENA.w - ARENA.h); }
    const s = Math.abs(10 + 9 * Math.sin(t * 0.8 + i * 2.1)) + 8;
    ctx.globalAlpha = 0.09 + 0.06 * Math.sin(t * 1.3 + i);
    ctx.drawImage(FOG_SPRITE, x - s, y - s, s * 2, s * 2);
  }
  // dark outside
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(4,5,8,0.72)';
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  roundRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h, 10);
  ctx.fill('evenodd');
  ctx.restore();
}

function drawRing() {
  const r = G.ring;
  if (!r) return;
  const fade = clamp(1 - r.r / r.maxR, 0, 1) * 0.85 + 0.15;
  ctx.save();
  ctx.strokeStyle = ACCENT;
  ctx.globalAlpha = 0.85 * fade;
  ctx.lineWidth = r.width * 0.55;
  ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 0.35 * fade;
  ctx.lineWidth = r.width * 1.3;
  ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawSlashes() {
  for (const s of G.slashes) {
    const k = s.t / s.dur;
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.5;
    ctx.fillStyle = s.col;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.r * (0.85 + 0.15 * k), s.ang - s.half, s.ang + s.half);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawSword(len, white) {
  // grip + pommel
  ctx.fillStyle = white ? '#ffffff' : '#4a3b2c';
  ctx.fillRect(-8, -1.8, 8, 3.6);
  ctx.beginPath(); ctx.arc(-9, 0, 2.4, 0, Math.PI * 2); ctx.fill();
  // crossguard
  ctx.fillStyle = white ? '#ffffff' : '#6e6046';
  ctx.fillRect(-1.5, -7, 3, 14);
  // tapered blade
  const g = ctx.createLinearGradient(0, -3.5, 0, 3.5);
  g.addColorStop(0, '#f4f7ff'); g.addColorStop(0.5, '#c3cddf'); g.addColorStop(1, '#8f9ab0');
  ctx.fillStyle = white ? '#ffffff' : g;
  ctx.beginPath();
  ctx.moveTo(1.5, -3.2); ctx.lineTo(len - 8, -2.4); ctx.lineTo(len, 0); ctx.lineTo(len - 8, 2.4); ctx.lineTo(1.5, 3.2);
  ctx.closePath(); ctx.fill();
  if (!white) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(len - 7, 0); ctx.stroke();
  }
}

function drawPlayer() {
  if (G.screen === 'dead' && G.screenT > 0.8) return;

  // roll afterimages
  for (const t of P.trail) {
    ctx.save();
    ctx.globalAlpha = clamp(t.a, 0, 1) * 0.3;
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rot);
    ctx.fillStyle = '#9fb2d4';
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(0, 6, 14, 6, 0, 0, Math.PI * 2); ctx.fill();

  const rolling = P.act && P.act.type === 'roll';
  const flasking = P.act && P.act.type === 'flask';
  const white = P.flash > 0;
  ctx.rotate(rolling ? Math.atan2(P.act.dirY, P.act.dirX) : P.face);

  if (rolling) {
    const k = P.act.t / P.act.dur;
    const rx = 16 + 5 * Math.sin(k * Math.PI);
    ctx.fillStyle = white ? '#ffffff' : '#c7d1e4';
    ctx.beginPath(); ctx.ellipse(0, 0, rx, 9.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#3a4152';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    // tuck lines suggest the tumble
    ctx.strokeStyle = white ? '#ffffff' : 'rgba(58,65,82,0.8)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const a0 = k * 9 + i * 2.1;
      ctx.beginPath(); ctx.arc(0, 0, 6.5, a0, a0 + 1.1); ctx.stroke();
    }
  } else {
    const sway = Math.sin(P.walkT) * 1.4;
    ctx.translate(0, sway);

    // cape
    const cs = Math.sin(G.time * 2.6 + P.walkT) * 3;
    const cg = ctx.createLinearGradient(-22, 0, -2, 0);
    cg.addColorStop(0, '#2d3a63'); cg.addColorStop(1, '#5265a0');
    ctx.fillStyle = white ? '#ffffff' : cg;
    ctx.beginPath();
    ctx.moveTo(-2, -9);
    ctx.quadraticCurveTo(-15, -8 + cs, -23, -3 + cs);
    ctx.lineTo(-23, 4 + cs);
    ctx.quadraticCurveTo(-15, 8 + cs, -2, 9);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#1a2138';
    ctx.lineWidth = 1.2; ctx.stroke();

    // armored torso
    const bg = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
    bg.addColorStop(0, '#eef2fa'); bg.addColorStop(0.55, '#b7c1d6'); bg.addColorStop(1, '#7d87a1');
    ctx.fillStyle = white ? '#ffffff' : bg;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#333a4b';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // plate seams
    if (!white) {
      ctx.strokeStyle = 'rgba(51,58,75,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, 8, -1.2, 1.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 4.5, -1.4, 1.4); ctx.stroke();
    }

    // pauldrons
    ctx.fillStyle = white ? '#ffffff' : '#98a3ba';
    ctx.strokeStyle = white ? '#ffffff' : '#333a4b';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(-1, -10.5, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-1, 10.5, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // helm with visor
    const hg = ctx.createLinearGradient(2, 0, 16, 0);
    hg.addColorStop(0, '#aab5cc'); hg.addColorStop(1, '#f2f6ff');
    ctx.fillStyle = white ? '#ffffff' : hg;
    ctx.beginPath(); ctx.moveTo(19, 0); ctx.lineTo(2, -8.5); ctx.lineTo(6, 0); ctx.lineTo(2, 8.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#252c3c';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    if (!white) {
      // dark visor slit — the one bit of "face" the knight gets
      ctx.strokeStyle = '#141924';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(10, -3.6); ctx.lineTo(14, 0); ctx.lineTo(10, 3.6); ctx.stroke();
    }

    // sword — held low; swings across on attacks, raised flat when guarding
    let swordAng = 0.75, swordLen = 30;
    if (P.act && (P.act.type === 'light' || P.act.type === 'heavy')) {
      const heavy = P.act.type === 'heavy';
      const wEnd = heavy ? 0.5 : 0.27;
      const k = clamp(P.act.t / wEnd, 0, 1);
      swordAng = lerp(-1.6, 1.3, k);
      swordLen = heavy ? 36 : 32;
    } else if (P.act && P.act.type === 'parry') {
      swordAng = lerp(0.4, -1.7, clamp(P.act.t / 0.2, 0, 1));
      swordLen = 32;
    } else if (P.blocking) {
      swordAng = -1.15;
      swordLen = 32;
    }
    ctx.save();
    ctx.translate(3, 9);
    ctx.rotate(swordAng);
    drawSword(swordLen, white);
    ctx.restore();

    // guard shimmer — a ward of steel across the facing arc
    if (P.blocking) {
      ctx.strokeStyle = `rgba(180,200,240,${0.3 + 0.12 * Math.sin(G.time * 6)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(5, 0, 17, -1.2, 1.2); ctx.stroke();
    }
    // the glint of an active parry window
    if (P.act && P.act.type === 'parry' && P.act.t <= 0.2) {
      ctx.strokeStyle = 'rgba(255,244,214,0.75)';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(4, 0, 20, -1.5, 0.6); ctx.stroke();
    }

    if (flasking) {
      const fg = ctx.createRadialGradient(-2, -15, 1, -2, -15, 10);
      fg.addColorStop(0, 'rgba(255,220,120,0.85)'); fg.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(-2, -15, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e7bf45';
      ctx.beginPath(); ctx.arc(-2, -15, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a6a1d';
      ctx.fillRect(-3.6, -22.5, 3.2, 4);
      if (Math.random() < 0.35) spawnParticles(P.x, P.y - 14, 1, '#ffe08a', 45, 0.5);
    }
  }
  ctx.restore();

  // lock-on reticle over boss
  if (P.locked && B.state !== 'dying') {
    const pu = 1 + 0.1 * Math.sin(G.time * 6);
    ctx.save();
    ctx.translate(B.x, B.y - B.r - 26);
    ctx.scale(pu, pu);
    ctx.strokeStyle = '#eef2fa';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(8, 0); ctx.lineTo(0, 8); ctx.lineTo(-8, 0); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#eef2fa';
    ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawBoss() {
  const dying = B.state === 'dying';
  let alpha = 1;
  if (dying) alpha = clamp(1 - B.dieT / 1.3, 0, 1);
  if (G.screen === 'victory') alpha = 0;
  if (alpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(B.x, B.y);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(0, 10, 38, 14, 0, 0, Math.PI * 2); ctx.fill();

  ctx.rotate(B.face);
  const stag = B.state === 'stagger';
  if (stag) ctx.rotate(0.35 * Math.sin(G.time * 3));
  // a tremor in the held blade while he cannot bring it down
  if (B.state === 'hesitate' && B.stateT > 0.5 && B.stateT < 1.15) ctx.rotate(Math.sin(G.time * 40) * 0.012);

  const tele = B.tele;
  const white = B.flash > 0;
  // body color lerps toward the accent while telegraphing
  const mix = (c1, c2, t) => {
    const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const a = p(c1), b2 = p(c2);
    return `rgb(${Math.round(lerp(a[0], b2[0], t))},${Math.round(lerp(a[1], b2[1], t))},${Math.round(lerp(a[2], b2[2], t))})`;
  };
  const pulse = tele * (0.7 + 0.3 * Math.sin(G.time * 18));
  const breathe = B.state === 'idle' ? Math.sin(G.time * 1.9) * 0.9
    : (B.state === 'chainPause' ? Math.sin(G.time * 7) * 1.7 : 0);
  const bodyCol = white ? '#ffffff' : mix('#4a3d52', ACCENT, pulse * 0.5);
  const plateCol = white ? '#ffffff' : mix('#6d586d', ACCENT, pulse * 0.65);
  const trimCol = white ? '#ffffff' : mix('#a68b9c', ACCENT, pulse * 0.85);

  // ---- tattered cloak, billowing behind ----
  const sw = Math.sin(G.time * 1.7), sw2 = Math.sin(G.time * 2.3 + 1.1);
  ctx.fillStyle = white ? '#ffffff' : mix('#2b2138', ACCENT, pulse * 0.25);
  ctx.beginPath();
  ctx.moveTo(-6, -30);
  ctx.quadraticCurveTo(-34, -34 + sw * 3, -52 + sw2 * 4, -20 + sw * 4);
  // ragged hem
  ctx.lineTo(-44, -10 + sw2 * 2);
  ctx.lineTo(-56 + sw * 3, -2);
  ctx.lineTo(-45, 5 + sw2 * 2);
  ctx.lineTo(-54 + sw2 * 3, 16 + sw * 3);
  ctx.lineTo(-42, 14);
  ctx.quadraticCurveTo(-34, 30 + sw * 3, -6, 30);
  ctx.closePath(); ctx.fill();

  ctx.translate(breathe * 0.5, 0);

  // ---- hulking body ----
  const bgrad = ctx.createLinearGradient(20, -30, -26, 30);
  bgrad.addColorStop(0, '#6b5a76'); bgrad.addColorStop(0.45, '#493c53'); bgrad.addColorStop(1, '#241d30');
  ctx.fillStyle = white ? '#ffffff' : (pulse > 0.02 ? bodyCol : bgrad);
  ctx.beginPath();
  ctx.moveTo(30, 0); ctx.lineTo(18, -24); ctx.lineTo(-16, -31);
  ctx.lineTo(-32, -12); ctx.lineTo(-32, 12); ctx.lineTo(-16, 31);
  ctx.lineTo(18, 24);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#0b0810';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // cold rim light down the leading edge keeps him readable against the dark floor
  if (!white) {
    ctx.strokeStyle = 'rgba(190,205,240,0.5)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(18, -24); ctx.lineTo(30, 0); ctx.lineTo(18, 24);
    ctx.stroke();
  }

  // chest plate + ashen sigil
  ctx.fillStyle = plateCol;
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(8, -15); ctx.lineTo(-8, -12);
  ctx.lineTo(-8, 12); ctx.lineTo(8, 15);
  ctx.closePath(); ctx.fill();
  if (!white) {
    ctx.strokeStyle = mix('#c9a34a', ACCENT, pulse);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-2, -7); ctx.lineTo(-2, 7); ctx.closePath(); ctx.stroke();
  }
  // ember cracks across the plate — phase 2 shows them, the rampage tears them wide
  if (B.phase2 && !white) {
    const cr = (B.rampage ? 1 : 0.55) * (1 - 0.7 * B.coreDim);
    ctx.strokeStyle = `rgba(255,158,44,${(0.3 + 0.25 * Math.sin(G.time * 6)) * cr})`;
    ctx.lineWidth = B.rampage ? 2.4 : 1.3;
    const cracks = [[-2, -7, -14, -18], [-2, 7, -16, 16], [6, -2, 18, -10], [-6, 0, -22, 3], [4, 6, 14, 19]];
    const n = B.rampage ? cracks.length : 3;
    for (let i = 0; i < n; i++) {
      const c = cracks[i];
      ctx.beginPath();
      ctx.moveTo(c[0], c[1]);
      ctx.lineTo((c[0] + c[2]) / 2 + 2, (c[1] + c[3]) / 2 - 2);
      ctx.lineTo(c[2], c[3]);
      ctx.stroke();
    }
  }

  // ---- spiked pauldrons ----
  const drawPauldron = (sy) => {
    ctx.save();
    ctx.translate(-6, sy * 27);
    ctx.fillStyle = trimCol;
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 12, sy * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#0d0a14';
    ctx.lineWidth = 1.8; ctx.stroke();
    // spikes fanning away from the body
    ctx.fillStyle = white ? '#ffffff' : mix('#d8c7d2', ACCENT, pulse);
    ctx.strokeStyle = white ? '#ffffff' : '#0b0810';
    ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
      ctx.save();
      ctx.rotate((sy > 0 ? 0 : Math.PI) + i * 0.44);
      ctx.beginPath(); ctx.moveTo(-4, 2); ctx.lineTo(4, 2); ctx.lineTo(0, 17); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  };
  drawPauldron(-1); drawPauldron(1);

  // ---- horned helm ----
  ctx.save();
  ctx.translate(24, 0);
  // horns sweep forward past the head, well clear of the pauldrons
  const hornCol = white ? '#ffffff' : mix('#e6d8c2', ACCENT, pulse);
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(1, s * 3);
    ctx.quadraticCurveTo(20, s * 9, 32, s * 23);    // outer edge out to the tip
    ctx.quadraticCurveTo(15, s * 17, 1, s * 12);    // inner edge back to the base
    ctx.closePath();
    ctx.fillStyle = hornCol;
    ctx.fill();
    ctx.strokeStyle = white ? '#ffffff' : '#0b0810';
    ctx.lineWidth = 1.3; ctx.stroke();
    // ridge line along the horn
    if (!white) {
      ctx.strokeStyle = 'rgba(120,96,70,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(4, s * 7); ctx.quadraticCurveTo(18, s * 12, 29, s * 21); ctx.stroke();
    }
  }
  // helm, projecting forward of the shoulders
  const hgr = ctx.createLinearGradient(-9, 0, 20, 0);
  hgr.addColorStop(0, '#3a2f43'); hgr.addColorStop(1, '#7c6989');
  ctx.fillStyle = white ? '#ffffff' : (pulse > 0.02 ? mix('#54465e', ACCENT, pulse * 0.6) : hgr);
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(6, -12); ctx.lineTo(-9, -10);
  ctx.lineTo(-9, 10); ctx.lineTo(6, 12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#0b0810';
  ctx.lineWidth = 1.8; ctx.stroke();
  // crest ridge
  if (!white) {
    ctx.strokeStyle = mix('#c9a34a', ACCENT, pulse);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-6, 0); ctx.stroke();
  }
  // burning eyes — always lit, fiercer in phase 2
  if (!white) {
    let eg = B.phase2 ? 1 : 0.62;
    eg *= (1 - 0.8 * B.coreDim);              // the core dims when he falters
    if (B.rampage) eg = Math.min(1.25, eg * 1.35);  // and burns brightest after
    const flick = eg * (0.85 + 0.15 * Math.sin(G.time * 13));
    const glow = ctx.createRadialGradient(4, 0, 0, 4, 0, 16);
    glow.addColorStop(0, `rgba(255,158,44,${0.6 * flick})`);
    glow.addColorStop(1, 'rgba(255,158,44,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(4, 0, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,232,190,${flick})`;
    ctx.beginPath(); ctx.ellipse(6, -4.6, 3.8, 2, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, 4.6, 3.8, 2, -0.3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // ---- greatblade ----
  ctx.save();
  ctx.rotate(B.wOff);
  const L = B.wLen, hilt = 16;
  // wrapped grip + heavy crossguard
  ctx.fillStyle = white ? '#ffffff' : '#3a2c22';
  ctx.fillRect(hilt - 16, -3, 16, 6);
  ctx.fillStyle = white ? '#ffffff' : mix('#8d7385', ACCENT, pulse);
  ctx.beginPath(); ctx.moveTo(hilt - 2, -13); ctx.lineTo(hilt + 5, -4); ctx.lineTo(hilt + 5, 4); ctx.lineTo(hilt - 2, 13);
  ctx.lineTo(hilt - 6, 9); ctx.lineTo(hilt - 6, -9); ctx.closePath(); ctx.fill();
  // broad tapered blade
  const blg = ctx.createLinearGradient(0, -8, 0, 8);
  blg.addColorStop(0, '#b9c2d4'); blg.addColorStop(0.45, '#7e8798'); blg.addColorStop(1, '#464e5e');
  ctx.fillStyle = white ? '#ffffff' : (pulse > 0.02 ? mix('#7e8798', ACCENT, pulse) : blg);
  ctx.beginPath();
  ctx.moveTo(hilt + 4, -7.5);
  ctx.lineTo(hilt + L * 0.62, -8.5);
  ctx.lineTo(hilt + L * 0.9, -5);
  ctx.lineTo(hilt + L, 0);
  ctx.lineTo(hilt + L * 0.9, 5);
  ctx.lineTo(hilt + L * 0.62, 8.5);
  ctx.lineTo(hilt + 4, 7.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = white ? '#ffffff' : '#14111c';
  ctx.lineWidth = 1.5; ctx.stroke();
  // fuller
  if (!white) {
    ctx.strokeStyle = mix('#14111c', ACCENT, pulse * 0.7);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hilt + 8, 0); ctx.lineTo(hilt + L * 0.85, 0); ctx.stroke();
  }
  // telegraph: the edge ignites
  if (tele > 0.05) {
    ctx.save();
    ctx.globalAlpha = alpha * tele;
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(hilt + 4, -7.5); ctx.lineTo(hilt + L * 0.62, -8.5);
    ctx.lineTo(hilt + L * 0.9, -5); ctx.lineTo(hilt + L, 0);
    ctx.stroke();
    ctx.globalAlpha = alpha * tele * 0.6;
    const gx = hilt + L * 0.8;
    const grad = ctx.createRadialGradient(gx, 0, 0, gx, 0, 34);
    grad.addColorStop(0, ACCENT); grad.addColorStop(1, 'rgba(255,158,44,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(gx, 0, 34, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // outline flare while telegraphing
  if (tele > 0.05 && !white) {
    ctx.globalAlpha = alpha * tele * 0.85;
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(30, 0); ctx.lineTo(18, -24); ctx.lineTo(-16, -31);
    ctx.lineTo(-32, -12); ctx.lineTo(-32, 12); ctx.lineTo(-16, 31);
    ctx.lineTo(18, 24);
    ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = alpha;
  }
  // EXPOSED — five parries stripped his guard; gold shimmer for the window
  if (B.exposedT > 0 && !white) {
    ctx.globalAlpha = alpha * (0.45 + 0.3 * Math.sin(G.time * 8));
    ctx.strokeStyle = '#e8c15a';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(30, 0); ctx.lineTo(18, -24); ctx.lineTo(-16, -31);
    ctx.lineTo(-32, -12); ctx.lineTo(-32, 12); ctx.lineTo(-16, 31);
    ctx.lineTo(18, 24);
    ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = alpha;
  }
  ctx.restore();

  // stagger — "STANCE BROKEN" cue, drawn unrotated so it stays readable
  if (stag) {
    ctx.save();
    ctx.globalAlpha = alpha * (0.55 + 0.45 * Math.sin(G.time * 9));
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe9a8';
    ctx.font = '600 13px Georgia, serif';
    ctx.fillText('STANCE BROKEN', B.x, B.y - B.r - 34);
    ctx.globalAlpha = alpha;
    for (let i = 0; i < 3; i++) {
      const a = G.time * 4 + i * 2.1;
      ctx.beginPath(); ctx.arc(B.x + Math.cos(a) * 22, B.y + Math.sin(a) * 10 - B.r - 16, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textAlign = 'left';
    ctx.restore();
  }

  // roar shockwave (cosmetic) + heat bloom
  if (B.state === 'roar') {
    const k = B.stateT / 1.6;
    ctx.save();
    for (let i = 0; i < 3; i++) {
      const kk = clamp(k - i * 0.12, 0, 1);
      if (kk <= 0) continue;
      ctx.globalAlpha = (1 - kk) * 0.45;
      ctx.strokeStyle = ACCENT;
      ctx.lineWidth = 4 - i;
      ctx.beginPath(); ctx.arc(B.x, B.y, 40 + kk * 280, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = (1 - k) * 0.3;
    const bloom = ctx.createRadialGradient(B.x, B.y, 0, B.x, B.y, 120);
    bloom.addColorStop(0, ACCENT); bloom.addColorStop(1, 'rgba(255,158,44,0)');
    ctx.fillStyle = bloom;
    ctx.beginPath(); ctx.arc(B.x, B.y, 120, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // the rampage ignition burst
  if (B.state === 'flare' && B.stateT > 0.35) {
    const k = clamp((B.stateT - 0.35) / 0.6, 0, 1);
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.6;
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 5 - 3 * k;
    ctx.beginPath(); ctx.arc(B.x, B.y, 30 + k * 240, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // EXPOSED floating cue (stagger text takes precedence)
  if (B.exposedT > 0 && !stag && B.state !== 'dying') {
    ctx.save();
    ctx.globalAlpha = alpha * (0.55 + 0.45 * Math.sin(G.time * 7));
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8c15a';
    ctx.font = '600 13px Georgia, serif';
    ctx.fillText('EXPOSED', B.x, B.y - B.r - 34);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

function drawDamageNumbers() {
  for (const d of G.dmgNums) {
    const k = d.t / 0.7;
    ctx.save();
    ctx.globalAlpha = (1 - k) * (1 - k);
    ctx.textAlign = 'center';
    ctx.font = '600 ' + (17 - k * 3).toFixed(1) + 'px Georgia, serif';
    ctx.fillStyle = '#0a0a0e';
    ctx.fillText(Math.round(d.v), d.x + 1, d.y - k * 26 + 1);
    ctx.fillStyle = d.v >= 50 ? '#ffd98a' : '#f0f3fa';
    ctx.fillText(Math.round(d.v), d.x, d.y - k * 26);
    ctx.restore();
  }
  ctx.textAlign = 'left';
}

/* ---------- UI ---------- */
// Ornate framed bar: dark socket, beveled frame, damage-ghost, inner sheen.
function drawBar(x, y, w, h, frac, col, colTop, ghostFrac, opts) {
  opts = opts || {};
  frac = clamp(frac, 0, 1);
  // socket + frame
  ctx.fillStyle = 'rgba(6,7,11,0.9)';
  ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  ctx.strokeStyle = opts.frame || 'rgba(148,138,116,0.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 3.5, y - 3.5, w + 7, h + 7);
  ctx.fillStyle = 'rgba(24,22,26,0.95)';
  ctx.fillRect(x, y, w, h);
  // damage ghost
  if (ghostFrac !== undefined && ghostFrac > frac) {
    ctx.fillStyle = opts.ghostCol || 'rgba(201,163,74,0.75)';
    ctx.fillRect(x + w * frac, y, w * (clamp(ghostFrac, 0, 1) - frac), h);
  }
  // fill with vertical shading
  if (frac > 0) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, colTop || col); g.addColorStop(0.5, col); g.addColorStop(1, colTop || col);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w * frac, h);
    // top sheen
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(x, y, w * frac, Math.max(1, h * 0.28));
  }
}

function drawFlask(x, y, s, filled, glow) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (filled && glow) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 16);
    g.addColorStop(0, 'rgba(255,206,90,0.35)'); g.addColorStop(1, 'rgba(255,206,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
  }
  // bulb
  ctx.beginPath();
  ctx.moveTo(-4, -6); ctx.lineTo(4, -6);
  ctx.quadraticCurveTo(9, 2, 6, 8);
  ctx.lineTo(-6, 8);
  ctx.quadraticCurveTo(-9, 2, -4, -6);
  ctx.closePath();
  if (filled) {
    const g = ctx.createLinearGradient(0, -6, 0, 8);
    g.addColorStop(0, '#ffe08a'); g.addColorStop(1, '#c78d1c');
    ctx.fillStyle = g;
  } else ctx.fillStyle = 'rgba(58,52,40,0.65)';
  ctx.fill();
  ctx.strokeStyle = filled ? 'rgba(70,52,16,0.9)' : 'rgba(90,82,64,0.7)';
  ctx.lineWidth = 1.2; ctx.stroke();
  // neck + cork
  ctx.fillStyle = filled ? '#9a7a2a' : 'rgba(58,52,40,0.65)';
  ctx.fillRect(-2.6, -10, 5.2, 4.5);
  ctx.fillStyle = filled ? '#6d4f22' : 'rgba(70,64,50,0.65)';
  ctx.fillRect(-3.2, -13, 6.4, 3.2);
  ctx.restore();
}

function drawHUD() {
  const lowHP = P.hp / P.hpMax < 0.3 && !P.dead && G.screen === 'fight';

  // ---- player vitals ----
  const hpFlash = P.flash > 0 ? 'rgba(255,255,255,0.9)' : null;
  drawBar(26, 26, 268, 15, P.hp / P.hpMax, hpFlash || '#b3202a', hpFlash || '#7a151c', P.hpGhost / P.hpMax);
  const stLow = P.st < 25;
  const stCol = P.stFlash > 0 ? '#e2c14a' : (stLow ? '#7c8f3a' : '#3f9e4d');
  drawBar(26, 48, 214, 11, Math.max(0, P.st) / P.stMax, stCol, P.stFlash > 0 ? '#b89a2c' : '#2c7538');

  // parry streak pips — five clean parries expose him
  for (let i = 0; i < 5; i++) {
    ctx.save();
    ctx.translate(252 + i * 14, 53.5);
    ctx.rotate(Math.PI / 4);
    if (i < P.parryStreak) {
      ctx.fillStyle = '#ffe9a8';
      ctx.fillRect(-3.2, -3.2, 6.4, 6.4);
    } else {
      ctx.strokeStyle = 'rgba(200,208,226,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-3, -3, 6, 6);
    }
    ctx.restore();
  }

  // flasks
  for (let i = 0; i < P.flaskMax; i++) {
    drawFlask(38 + i * 26, 82, 1, i < P.flasks, i < P.flasks && P.hp / P.hpMax < 0.6);
  }
  ctx.fillStyle = 'rgba(214,207,194,0.75)';
  ctx.font = '11px Georgia, serif';
  ctx.fillText('x' + P.flasks, 38 + P.flaskMax * 26 - 6, 86);

  // low-health pulse vignette
  if (lowHP) {
    const a = 0.16 + 0.1 * Math.sin(G.time * 4.5);
    const v = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 560);
    v.addColorStop(0, 'rgba(150,20,20,0)');
    v.addColorStop(1, `rgba(150,20,20,${a})`);
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- boss banner ----
  if (B.hp > 0 || B.state === 'dying') {
    const bw = W * 0.62, bx = (W - bw) / 2, by = H - 44;
    ctx.textAlign = 'center';
    // name plate
    ctx.font = '600 18px Georgia, "Times New Roman", serif';
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillText(BOSS_NAME + ' — ' + BOSS_TITLE, W / 2 + 1, by - 11);
    ctx.fillStyle = B.phase2 ? '#e6b45c' : '#d6cfc2';
    ctx.fillText(BOSS_NAME + ' — ' + BOSS_TITLE, W / 2, by - 12);

    drawBar(bx, by, bw, 11, B.hp / B.hpMax, B.phase2 ? '#c02a24' : '#a8242c', '#6d161c', B.hpGhost / B.hpMax,
      { frame: B.phase2 ? 'rgba(230,180,92,0.7)' : 'rgba(148,138,116,0.55)' });

    // halfway notch marks the phase-2 threshold
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(bx + bw * 0.5, by - 2, 1, 15);

    // stagger meter — fills as poise breaks, so the player can read the punish window
    if (B.poise > 0.4 && B.state !== 'stagger') {
      const pw = bw * 0.32, px = W / 2 - pw / 2;
      ctx.fillStyle = 'rgba(6,7,11,0.8)';
      ctx.fillRect(px, by + 15, pw, 3);
      ctx.fillStyle = 'rgba(255,233,168,0.85)';
      ctx.fillRect(px, by + 15, pw * clamp(B.poise / 6, 0, 1), 3);
    }
    // EXPOSED countdown — the double-damage window draining away
    if (B.exposedT > 0) {
      const ew = bw * 0.4, ex = W / 2 - ew / 2;
      ctx.fillStyle = 'rgba(6,7,11,0.8)';
      ctx.fillRect(ex, by + 20, ew, 3);
      ctx.fillStyle = 'rgba(232,193,90,0.9)';
      ctx.fillRect(ex, by + 20, ew * (B.exposedT / 10), 3);
    }
    ctx.textAlign = 'left';
  }
}

/* ---------- prompts ---------- */
function promptText(kind) {
  const pad = Input.device === 'pad';
  if (kind === 'confirm') return pad ? 'Press  A / START' : 'Press  ENTER';
  return '';
}

// Both control schemes side by side; the active device's column is lit.
function drawControls(y) {
  const pad = Input.device === 'pad';
  const rows = [
    ['Move', 'Left Stick', 'W A S D'],
    ['Roll', 'B  (tap)', 'Space (tap)'],
    ['Sprint', 'B  (hold)', 'Space (hold)'],
    ['Light attack', 'RB', 'Left Mouse'],
    ['Heavy attack', 'RT', 'Right Mouse'],
    ['Block (hold)', 'L1', 'Shift'],
    ['Parry', 'L2', 'F'],
    ['Lock-on', 'R3', 'Q'],
    ['Flask', 'X', 'E'],
    ['Confirm', 'A / Start', 'Enter']
  ];
  const colL = W / 2 - 130, colPad = W / 2, colKb = W / 2 + 160;

  ctx.textAlign = 'center';
  ctx.font = '600 12px Georgia, serif';
  ctx.fillStyle = pad ? ACCENT : 'rgba(150,150,160,0.5)';
  ctx.fillText('CONTROLLER', colPad, y - 14);
  ctx.fillStyle = !pad ? ACCENT : 'rgba(150,150,160,0.5)';
  ctx.fillText('KEYBOARD', colKb, y - 14);

  // divider under the headers
  ctx.strokeStyle = 'rgba(148,138,116,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - 235, y - 7); ctx.lineTo(W / 2 + 235, y - 7); ctx.stroke();

  rows.forEach((r, i) => {
    const ry = y + 8 + i * 19;
    ctx.textAlign = 'right';
    ctx.font = '13px Georgia, serif';
    ctx.fillStyle = 'rgba(214,207,194,0.72)';
    ctx.fillText(r[0], colL, ry);
    ctx.textAlign = 'center';
    ctx.font = (pad ? '600 ' : '') + '13px Georgia, serif';
    ctx.fillStyle = pad ? '#e8e2d0' : 'rgba(150,150,160,0.45)';
    ctx.fillText(r[1], colPad, ry);
    ctx.font = (!pad ? '600 ' : '') + '13px Georgia, serif';
    ctx.fillStyle = !pad ? '#e8e2d0' : 'rgba(150,150,160,0.45)';
    ctx.fillText(r[2], colKb, ry);
  });
  ctx.textAlign = 'left';
}

function drawTitle() {
  drawFloor(); drawFogWall();
  ctx.fillStyle = 'rgba(5,6,10,0.74)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  // title with an ember glow behind it
  const tg = ctx.createRadialGradient(W / 2, 104, 10, W / 2, 104, 320);
  tg.addColorStop(0, 'rgba(255,158,44,0.13)');
  tg.addColorStop(1, 'rgba(255,158,44,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, 240);

  ctx.font = '600 56px Georgia, "Times New Roman", serif';
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillText('THE  ASHEN  GATE', W / 2 + 2, 106);
  const tgrad = ctx.createLinearGradient(0, 74, 0, 116);
  tgrad.addColorStop(0, '#f2ece0'); tgrad.addColorStop(1, '#a2916f');
  ctx.fillStyle = tgrad;
  ctx.fillText('THE  ASHEN  GATE', W / 2, 104);

  // filigree rule
  ctx.strokeStyle = 'rgba(201,163,74,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - 190, 122); ctx.lineTo(W / 2 - 14, 122); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2 + 14, 122); ctx.lineTo(W / 2 + 190, 122); ctx.stroke();
  ctx.fillStyle = 'rgba(201,163,74,0.8)';
  ctx.save(); ctx.translate(W / 2, 122); ctx.rotate(Math.PI / 4); ctx.fillRect(-4, -4, 8, 8); ctx.restore();

  ctx.font = 'italic 17px Georgia, serif';
  ctx.fillStyle = 'rgba(214,207,194,0.72)';
  ctx.fillText('a boss duel', W / 2, 146);

  ctx.fillStyle = ACCENT;
  ctx.font = '15px Georgia, serif';
  ctx.fillText('beyond the fog waits  ' + BOSS_NAME + ',  ' + BOSS_TITLE.toLowerCase(), W / 2, 182);

  drawControls(226);

  const blink = 0.55 + 0.45 * Math.sin(G.time * 3);
  ctx.textAlign = 'center';
  ctx.globalAlpha = blink;
  ctx.fillStyle = '#e8e2d0';
  ctx.font = '600 20px Georgia, serif';
  ctx.fillText(promptText('confirm') + '  to traverse the fog', W / 2, 452);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawIntro() {
  drawWorld();
  // fog curtain parting
  const k = clamp(G.screenT / 1.5, 0, 1);
  ctx.fillStyle = `rgba(150,165,205,${0.55 * (1 - k)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(5,6,10,${0.5 * (1 - k)})`;
  ctx.fillRect(0, 0, W, H);
  // boss name reveal
  ctx.textAlign = 'center';
  ctx.globalAlpha = clamp((G.screenT - 0.3) / 0.7, 0, 1);
  ctx.fillStyle = '#d6cfc2';
  ctx.font = '600 34px Georgia, "Times New Roman", serif';
  ctx.fillText(BOSS_NAME, W / 2, H / 2 - 30);
  ctx.font = 'italic 19px Georgia, serif';
  ctx.fillText(BOSS_TITLE, W / 2, H / 2);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawDead() {
  drawWorld();
  const t = G.screenT;
  ctx.fillStyle = `rgba(0,0,0,${clamp(t / 1.2, 0, 0.82)})`;
  ctx.fillRect(0, 0, W, H);
  const a = clamp((t - 0.4) / 1.6, 0, 1);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.translate(W / 2, H / 2);
  const grow = 1 + 0.05 * clamp(t / 2, 0, 1);
  ctx.scale(grow, grow);
  // dark band behind the text, classic treatment
  ctx.globalAlpha = a * 0.75;
  const band = ctx.createLinearGradient(-W / 2, 0, W / 2, 0);
  band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(0.5, 'rgba(0,0,0,0.85)'); band.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = band;
  ctx.fillRect(-W / 2, -46, W, 92);
  ctx.globalAlpha = a;
  ctx.font = '600 74px Georgia, "Times New Roman", serif';
  const dg = ctx.createLinearGradient(0, -34, 0, 26);
  dg.addColorStop(0, '#a81c1c'); dg.addColorStop(1, '#5e0d0d');
  ctx.fillStyle = dg;
  ctx.fillText('YOU DIED', 0, 14);
  ctx.restore();
  if (t > 2.1) {
    const blink = 0.5 + 0.5 * Math.sin(G.time * 3);
    ctx.textAlign = 'center';
    ctx.globalAlpha = blink;
    ctx.fillStyle = '#cfc8ba';
    ctx.font = '18px Georgia, serif';
    ctx.fillText(promptText('confirm') + '  to try again', W / 2, H / 2 + 90);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

function drawVictory() {
  drawWorld();
  const t = G.screenT;
  ctx.fillStyle = `rgba(0,0,0,${clamp(t / 1.4, 0, 0.7)})`;
  ctx.fillRect(0, 0, W, H);
  const a = clamp((t - 0.3) / 1.4, 0, 1);
  ctx.textAlign = 'center';
  // gold light blooming from the centre
  ctx.globalAlpha = a * 0.55;
  const bloom = ctx.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, 420);
  bloom.addColorStop(0, 'rgba(232,193,90,0.5)');
  bloom.addColorStop(0.4, 'rgba(232,193,90,0.12)');
  bloom.addColorStop(1, 'rgba(232,193,90,0)');
  ctx.fillStyle = bloom;
  ctx.fillRect(0, 0, W, H);
  // rising motes of light
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(255,226,150,0.7)';
  for (let i = 0; i < 26; i++) {
    const ph = (G.time * (26 + (i % 4) * 9) + i * 53) % 340;
    ctx.globalAlpha = a * clamp(1 - ph / 340, 0, 1) * 0.8;
    ctx.fillRect(W / 2 - 220 + ((i * 97) % 440) + Math.sin(G.time + i) * 8, H / 2 + 150 - ph, 2, 2);
  }
  ctx.globalAlpha = a;
  ctx.font = '600 54px Georgia, "Times New Roman", serif';
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillText('GREAT ENEMY FELLED', W / 2 + 2, H / 2 + 14);
  const vg = ctx.createLinearGradient(0, H / 2 - 26, 0, H / 2 + 22);
  vg.addColorStop(0, '#f7e2a2'); vg.addColorStop(0.5, '#e8c15a'); vg.addColorStop(1, '#b8862c');
  ctx.fillStyle = vg;
  ctx.fillText('GREAT ENEMY FELLED', W / 2, H / 2 + 12);
  ctx.globalAlpha = 1;
  if (t > 2.3) {
    const blink = 0.5 + 0.5 * Math.sin(G.time * 3);
    ctx.globalAlpha = blink;
    ctx.fillStyle = '#cfc8ba';
    ctx.font = '18px Georgia, serif';
    ctx.fillText(promptText('confirm') + '  to challenge ' + BOSS_NAME + ' again', W / 2, H / 2 + 84);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function drawWorld() {
  drawFloor();
  drawRing();
  drawSlashes();
  // draw whichever is further "back" first, so overlap reads correctly
  if (B.y <= P.y) { drawBoss(); drawPlayer(); } else { drawPlayer(); drawBoss(); }
  drawParticles();
  drawDamageNumbers();
  drawFogWall();
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, 220, W / 2, H / 2, 560);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  if (G.flashAmber > 0) {
    ctx.fillStyle = `rgba(255,158,44,${G.flashAmber * 0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
}

function render() {
  // shake offset applies to the world transform
  let ox = 0, oy = 0;
  if (G.shake > 0.2) { ox = rand(-G.shake, G.shake); oy = rand(-G.shake, G.shake); }
  ctx.setTransform(RS, 0, 0, RS, ox * RS, oy * RS);
  ctx.clearRect(-20, -20, W + 40, H + 40);

  switch (G.screen) {
    case 'title': drawTitle(); break;
    case 'intro': drawIntro(); break;
    case 'refade': {
      drawWorld();
      const k = 1 - clamp(G.screenT / 0.45, 0, 1);
      ctx.fillStyle = `rgba(5,6,10,${k})`;
      ctx.fillRect(0, 0, W, H);
      break;
    }
    case 'fight': drawWorld(); break;
    case 'dead': drawDead(); break;
    case 'victory': drawVictory(); break;
  }
}

/* =========================================================================
   MAIN LOOP — requestAnimationFrame + delta time (framerate independent)
   ========================================================================= */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - lastT) / 1000;
  lastT = now;
  if (rdt > 0.05) rdt = 0.05;
  if (rdt <= 0) return;

  Input.poll(rdt);

  if (G.hitstop > 0) {           // hitstop: freeze the world, keep rendering
    G.hitstop -= rdt;
    render();
    return;
  }
  update(rdt);
  render();
}
requestAnimationFrame(frame);

/* test/debug hook (harmless in normal play) */
window.__game = { G, P, B, Input, resetFight, damagePlayer, damageBoss, onParrySuccess, bossStartAttack };
</script>
